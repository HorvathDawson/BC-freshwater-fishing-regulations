<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T531 mockup: species under their calendar</title>
<style>
:root{ /* app tokens: packages/map/style/themes/light.json */
--page:#EFEFEC;--card:#FFFFFF;--wash:#F7F7F5;--tint:#EEEFEB;--line:#E5E6E1;--line2:#D3D5CF;--ink:#15181C;--sub:#555C62;--accent:#5F26E0;
--open:#016890;--restricted:#421652;--closed:#8F0006;}
:root[data-theme=dark]{--page:#0A0B0D;--card:#15181B;--wash:#101215;--tint:#1E2227;--line:#252A2F;--line2:#343B42;--ink:#F0F2F0;--sub:#B0B8BF;--accent:#A97CFF;
--open:#A7FBB2;--restricted:#BE8DC2;--closed:#FF3B6D;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/21px Archivo,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.bar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;background:var(--wash);border-bottom:1px solid var(--line2)}
.bar button{font:600 13px system-ui;padding:6px 10px;border:1px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.phone{width:390px;margin:0 auto;background:var(--card)}
.hdr{padding:14px 16px 6px;border-bottom:1px solid var(--line)}
.hdr h1{font:800 22px/26px "Bricolage Grotesque",system-ui;margin:0;letter-spacing:-.2px}
.hdr p{margin:0;color:var(--sub);font-size:12.5px}
.tabs{display:flex;border-bottom:1px solid var(--line2)}
.tabs span{flex:1;text-align:center;padding:10px 0;font-weight:600;font-size:14px;color:var(--sub)}
.tabs span.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.blk{padding:14px 16px 4px}
.blk+.blk{border-top:1.5px solid var(--ink);margin-top:12px}
.kick{font:700 12.48px/16px system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin:0 0 2px}
.ans{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px}
.ans b{font:800 26px/26px "Bricolage Grotesque",system-ui;letter-spacing:-.5px}
.ans small{font-size:12.48px;color:var(--sub)}
.soon{margin-left:auto;font:700 12.48px system-ui;padding:2px 8px;border:1.5px solid}
.cal{position:relative;margin-top:22px;height:10px}
.cal svg{display:block;width:100%;height:10px}
.mk{position:absolute;top:-6px;width:2px;height:22px;background:var(--ink)}
.mk i{position:absolute;bottom:24px;left:-40px;width:82px;text-align:center;font:600 12.48px/12px system-ui;font-style:normal}
.mo{display:flex;justify-content:space-between;margin-top:5px;font:500 10px/10px "JetBrains Mono",ui-monospace,monospace;color:var(--sub)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.leg span{display:flex;align-items:center;gap:6px}
.leg.after{font-size:12.48px;color:var(--sub)}
.leg.before span{font-size:12.48px;color:var(--sub)}
/* after: full ink, 14px (was sub, 12.48) */
.leg.new span{font:600 14px/20px system-ui;color:var(--ink)}
.rows{margin-top:10px}
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 0;border-top:1px solid var(--line)}
.row .th{width:56px;height:28px;display:flex;justify-content:center}
.row .nm{flex:1;font-size:15px}
.row .nm em{display:block;font:600 12.48px/17px system-ui;font-style:normal;color:var(--sub)}
.row .v{font-weight:700}
.row .ch{color:var(--sub)}
.row .btn{border:1px solid var(--ink);padding:4px 8px;font:700 12.48px system-ui;min-width:84px;text-align:center}
.sec{border-top:1.5px solid var(--ink);margin-top:14px;padding:18px 16px 4px}
.sec h2{font:800 17px/20px "Bricolage Grotesque",system-ui;margin:0 0 8px;letter-spacing:-.2px}
.o{color:var(--open)}.r{color:var(--restricted)}.c{color:var(--closed)}
.poss{margin:8px 16px 0;border-top:1.5px solid var(--ink);padding:9px 0;display:flex}
.poss span:first-child{flex:1}
.foot{padding:10px 16px 24px;font-size:12.5px;color:var(--sub)}
.label{max-width:390px;margin:18px auto 6px;padding:0 16px;font:700 12px system-ui;color:var(--sub);text-transform:uppercase;letter-spacing:1px}
.note{max-width:620px;margin:24px auto;padding:0 16px;font-size:14px;color:var(--ink)}
.note code{background:var(--tint);padding:1px 4px}
.shot .note,.shot .bar,.shot .label{display:none}
.v-only{display:none}
.show-before .after-v,.show-after .before-v{display:none}
</style></head><body>
<div class="bar" id="ctl">
 <button data-t="light" aria-pressed="true">Light</button><button data-t="dark" aria-pressed="false">Dark</button>
 <button data-v="after" aria-pressed="true">After (proposed)</button><button data-v="before" aria-pressed="false">Before (today)</button>
 <button data-w="vedder" aria-pressed="true">Vedder River</button><button data-w="lake" aria-pressed="false">No-salmon water</button>
</div>
<div class="label" id="lbl"></div>
<div class="phone" id="phone"></div>
<div class="note" id="note"></div>
<script>
// Illustrative values: faithful to the screen's shape; real limits come from the bundle rule data (see the ticket).
const MO="JFMAMJJASOND";
const patt=(id)=>`<defs>
<pattern id="${id}c" patternUnits="userSpaceOnUse" width="8.49" height="8.49" patternTransform="rotate(135)"><rect width="8.49" height="8.49" fill="var(--card)"/><rect width="8.49" height="8.49" fill="var(--closed)" opacity=".3"/><rect width="4.24" height="8.49" fill="var(--closed)"/></pattern>
<pattern id="${id}r" patternUnits="userSpaceOnUse" width="5" height="10"><rect width="3" height="10" fill="var(--restricted)"/></pattern>
<pattern id="${id}f" patternUnits="userSpaceOnUse" width="5" height="10"><rect width="5" height="10" fill="var(--card)"/><rect width="3" height="10" fill="var(--open)"/></pattern></defs>`;
const fill=(id,k)=>k==="o"?"var(--open)":k==="c"?`url(#${id}c)`:k==="r"?`url(#${id}r)`:k==="f"?`url(#${id}f)`:"var(--line2)";
function cal(id,runs,today){const W=358,G=2,tot=runs.reduce((a,r)=>a+r[0],0),room=W-G*(runs.length-1);let x=0,s="";
 for(const [d,k] of runs){const w=room*d/tot;s+=`<rect x="${x}" y="0" width="${w}" height="10" fill="${fill(id,k)}"/>`;x+=w+G;}
 return `<div class="cal"><svg viewBox="0 0 ${W} 10" preserveAspectRatio="none">${patt(id)}${s}</svg><div class="mk" style="left:${today*100}%"><i>Nov 9</i></div></div>
 <div class="mo">${[...MO].map(m=>`<span>${m}</span>`).join("")}</div>`;}
function sw(id,k){return `<svg width="${k==="r"?12:14}" height="10">${patt(id)}<rect width="14" height="10" fill="${fill(id,k)}"/></svg>`}
function legend(id,items,cls){return `<div class="leg ${cls}">${items.map(([k,t])=>`<span>${sw(id+k,k)}${t}</span>`).join("")}</div>`}
const thumb=`<svg width="48" height="24" viewBox="0 0 64 32"><path d="M6 16c7-8 18-11 29-9.5 7 1 12 4.5 16 9.5-4 5-9 8.5-16 9.5C24 27 13 24 6 16Zm45 0 9-7.5v15Z" fill="var(--line2)"/><circle cx="15" cy="14" r="1.6" fill="var(--tint)"/></svg>`;
const row=(n,sub,v,cls,end)=>`<div class="row"><div class="th">${thumb}</div><div class="nm">${n}${sub?`<em>${sub}</em>`:""}</div><span class="v ${cls||""}">${v}</span>${end||'<span class="ch">›</span>'}</div>`;
const det=`<span class="btn">Details ⌄</span>`;
const gameLegBefore=[["o","✓ open"],["f","fly fishing"],["c","✕ closed"]];
const gameLegAfter=[["o","✓ Open"],["f","Fly fishing only"],["c","✕ Closed"]];
const salLegBefore=[["o","Open"],["r","Release"],["c","Closed"]];
const salLegAfter=[["o","Open"],["r","Release only"],["c","Closed"]];
const game=[[60,"o"],[45,"f"],[75,"o"],[30,"c"],[100,"o"],[55,"f"]];
const sal=[[50,"c"],[40,"r"],[120,"o"],[60,"r"],[95,"c"]];
const gameB=(id,leg,cls,rows)=>`<div class="kick">Game fish (B.C. rules)</div><div class="ans"><b class="o">✓ Open today</b><small>fly fishing only until Dec 31</small><span class="soon c">Closes Dec 31</span></div>${cal(id,game,.86)}${legend(id,leg,cls)}${rows||""}`;
const salB=(id,leg,cls,rows)=>`<div class="kick">Salmon (DFO)</div><div class="ans"><b class="r">Release only</b><small>until Nov 30</small><span class="soon c">Closes Nov 30</span></div>${cal(id,sal,.86)}${legend(id,leg,cls)}${rows||""}`;
const gRows=`<div class="rows">${row("Trout and char","Dolly Varden, rainbow, cutthroat","Keep 2","",)}${row("Kokanee","","Keep 5","")}${row("Whitefish","","Keep 15","")}</div>`;
const sRows=`<div class="rows">${row("Salmon","Chinook, coho, chum, pink, sockeye","Release","r",det)}</div>`;
const head=(n)=>`<div class="hdr"><h1>${n}</h1><p>Region 2 · Lower Mainland</p></div><div class="tabs"><span>Overview</span><span class="on">Regulations</span><span>Conditions</span></div>`;
const tail=`<div class="poss"><span>Possession limit</span><b>2 trout</b><span style="margin-left:8px;color:var(--sub)">›</span></div><div class="foot">Always check the printed synopsis.</div>`;
function build(w,v){
 const vedder=w==="vedder";
 let h=head(vedder?"Vedder River":"Cultus Lake (illustrative: no DFO salmon block)");
 if(v==="after"){
  if(vedder) h+=`<div class="blk">${salB("sa",salLegAfter,"new",sRows)}</div><div class="blk">${gameB("ga",gameLegAfter,"new",gRows)}</div>`;
  else h+=`<div class="blk">${gameB("ga",gameLegAfter,"new",gRows)}</div>`;
 } else {
  if(vedder) h+=`<div class="blk" style="border:0">${gameB("gb",gameLegBefore,"before")}</div><div class="blk" style="border:0;margin-top:0;padding-top:6px">${salB("sb",salLegBefore,"before")}</div><div class="sec"><h2>Species and limits</h2>${sRows.replace('<div class="rows">','<div class="rows" style="margin:0">')}${gRows.replace('<div class="rows">','<div class="rows" style="margin:0">')}</div>`;
  else h+=`<div class="blk">${gameB("gb",gameLegBefore,"before")}</div><div class="sec"><h2>Species and limits</h2>${gRows.replace('<div class="rows">','<div class="rows" style="margin:0">')}</div>`;
 }
 return h+tail;
}
const q=new URLSearchParams(location.search);
const st={t:q.get("t")||"light",v:q.get("v")||"after",w:q.get("w")||"vedder"};
if(q.has("shot"))document.body.classList.add("shot");
function render(){document.documentElement.dataset.theme=st.t;
 document.getElementById("phone").innerHTML=build(st.w,st.v);
 document.getElementById("lbl").textContent=`${st.v==="after"?"Proposed":"Today"} · ${st.w==="vedder"?"Vedder River":"water with one block"} · ${st.t}`;
 document.querySelectorAll("#ctl button").forEach(b=>{const k=b.dataset.t?"t":b.dataset.v?"v":"w";b.setAttribute("aria-pressed",String(st[k]===(b.dataset.t||b.dataset.v||b.dataset.w)))});}
document.getElementById("ctl").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t)st.t=b.dataset.t;if(b.dataset.v)st.v=b.dataset.v;if(b.dataset.w)st.w=b.dataset.w;render()};
document.getElementById("note").innerHTML=`<b>How species land in a block.</b> Each species row is assigned by the <i>source of the rule that governs it</i> (the rule's <code>source</code> / DFO tag in the bundle), never a hand list in the UI: a species whose answer comes from a DFO rule (salmon) goes under the Salmon (DFO) calendar; every species whose answer comes from a B.C. synopsis rule goes under Game fish (B.C. rules). A water with no DFO salmon rule has no Salmon block, so it shows one block. Order: the block that is open/most relevant today stays first as the app orders them now; here DFO is shown first only to match the owner's sketch. Legend text moves from <code>sub</code> 12.48 px to <code>ink</code> 14 px semibold; "fly fishing" becomes "Fly fishing only"; "✓ open" is plain ink, not grey.<br><br>Values (limits, dates) are illustrative; colours, type sizes, bar geometry and row shapes follow KeepBlocks.tsx / YearStrip.tsx and the theme tokens.`;
render();
</script></body></html>
