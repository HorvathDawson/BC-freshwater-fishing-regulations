name: feeds — sync curated inputs → R2 private/

# T225 follow-up (owner 2026-10-28). MANUAL ONLY (workflow_dispatch) for now.
#
# The feeds Worker reads curated inputs from R2 PRIVATE keys (never served — the data worker 404s private/), so a
# curator's change reaches the feeds on their next run with no redeploy; the app reads the in-season links (PUBLIC).
# THE LIST IS NOT HERE (T331): `python -m pipeline.deliver.sync_inputs` stages every input at out/<R2 key> and prints
# `<key>\t<cache-control|->` — dfo-entries, wording (T321), roster, inseason-matches (see that module). The Mac twin,
# deploy/staging/sync-inputs.sh, puts the same staged set, so the two cannot drift (this one lacked wording.json).
# Only objects whose bytes differ from what R2 holds are written (compared by MD5 = the R2 ETag of a single-part put).
#
# Later (owner's call): run it on push to those paths — uncomment the `push:` block below.
#
# TARGET: staging only until the owner enables production (uncomment the option + the prod secrets).
# SECRETS (already set in the repo by the owner): CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. The token
#   may be account-wide: the bucket guard below is what keeps this staging-only.
# NOTE: listed in the Actions tab only once on the default branch; until then:
#   gh workflow run feeds-sync-inputs.yml --ref redesign/stream-sections -f what=all -f dry_run=true

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which R2 bucket"
        type: choice
        default: staging
        options:
          - staging
          # - production   # OWNER: uncomment to enable (and the prod secrets in the env block below)
      what:
        description: "What to sync (all = every input in pipeline.deliver.sync_inputs)"
        type: choice
        default: all
        options: [all, dfo-entries, wording, roster, inseason-matches]
      dry_run:
        description: "List what would change; write nothing"
        type: boolean
        default: true
  # push:
  #   branches: [main]
  #   paths:
  #     - data/curated/regulations/entries/dfo_salmon/**
  #     - data/curated/dfo_salmon/wording.json
  #     - data/source/bc_hydrometric_stations.json
  #     - data/curated/inseason/matches.json
  #     - data/curated/waters/splits.json

concurrency:
  group: feeds-sync-inputs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUCKET: ${{ inputs.target == 'production' && 'bc-fishing-regulations' || 'bc-fishing-regulations-staging' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Guard — staging only until the owner enables production
        run: |
          case "$BUCKET" in
            bc-fishing-regulations-staging) echo "target bucket: $BUCKET" ;;
            *) echo "::error::only bc-fishing-regulations-staging is allowed (got $BUCKET)"; exit 1 ;;
          esac
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::R2 keys are not set (see the header)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the files (the one list, pipeline.deliver.sync_inputs)
        run: |
          pip install --quiet "pydantic>=2" pyyaml
          W="${{ inputs.what }}"
          ONLY=(); [ "$W" != "all" ] && ONLY=(--only "$W")
          python -m pipeline.deliver.sync_inputs --out out ${ONLY[@]+"${ONLY[@]}"} > manifest.tsv
          cat manifest.tsv

      - name: Put what changed
        run: |
          put() {  # put <local> <key> [cache-control]
            local want have
            want=$(md5sum "$1" | cut -d' ' -f1)
            have=$(aws s3api head-object --bucket "$BUCKET" --key "$2" --endpoint-url "$R2_ENDPOINT" \
                   --query ETag --output text 2>/dev/null | tr -d '"' || true)
            if [ "$want" = "$have" ]; then echo "same     $2"; return; fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo "WOULD PUT $2"; return; fi
            aws s3 cp "$1" "s3://$BUCKET/$2" --endpoint-url "$R2_ENDPOINT" --content-type application/json \
              ${3:+--cache-control "$3"} --only-show-errors
            echo "put      $2"
          }
          while IFS=$'\t' read -r key cache; do
            if [ "$cache" = "-" ]; then put "out/$key" "$key"; else put "out/$key" "$key" "$cache"; fi
          done < manifest.tsv
