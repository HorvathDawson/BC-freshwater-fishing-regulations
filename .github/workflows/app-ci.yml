name: app

on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml", "pipeline/deliver/bundle/schema.sql",
            "pipeline/deliver/bundle/indexes.sql"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml", "pipeline/deliver/bundle/schema.sql",
            "pipeline/deliver/bundle/indexes.sql"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }

      - run: pnpm install --frozen-lockfile

      # `pnpm check` runs the generated-file --checks (gauge policy, calendar, answers model) with the repo's
      # `.venv/bin/python`, exactly as on a laptop. They need no data, only the pipeline's code (P03).
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - name: Python venv for the generated-file checks
        working-directory: .
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt

      # THE SAME GATE AS A LAPTOP (P03): boundaries → platform → style → colours → spinner → fixture → gauge-policy →
      # calendar → answers → deps → typecheck → test. One command, so CI cannot drift from `pnpm check` by
      # forgetting a step (colours, spinner and fixture were missing here). Boundaries run first inside it: the
      # cheapest check, and its failure means the architecture is being violated, not that a test broke.
      - name: pnpm check (every app gate + tests + conformance)
        run: pnpm check

      # The regulations design prototype (design/regs-v11.html), rendered headless and offline: no
      # hand-written fact, the fishway lines beside the open/closed strip, ONE Sources line per Gear &
      # licence section (no chip per line, no trailing barbless box), and a water map painted in the
      # app's own status tokens from the pipeline's export. Chrome ships on ubuntu-latest.
      - name: Design prototype checks (regs-v11)
        run: node design/regs-v11/tools/check.mjs design/regs-v11.html
        env: { CHROME: google-chrome }

      # Nothing above bundles anything. Metro's monorepo resolution, the react-native-web
      # aliasing and the single-React pin are exactly the things that break silently and
      # are only observable in a bundle — a workspace link can typecheck and still fail to
      # resolve at bundle time. This builds the web output the phone UI actually ships as.
      - name: Web bundle builds (Expo + react-native-web)
        run: pnpm --filter @app/mobile run export:web

      # Same tree through the native transform + Hermes. Catches a web-only API reaching
      # shared code, which check-platform only catches for the cases it knows by name.
      - name: Native bundles build (iOS + Android JS)
        run: pnpm --filter @app/mobile exec expo export --platform android --platform ios
