name: app

on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml", "pipeline/deliver/bundle/schema.sql",
            "pipeline/deliver/bundle/indexes.sql",
            # (T543) the worker parity tests import these through Python; requirements/constraints build the venv
            "pipeline/regs/dfo_salmon/**", "pipeline/gauges/**", "requirements.txt", "constraints.txt",
            # (2026-11-13) `pnpm check` runs the ticket ledger + handoff docs guard (tools/check-tickets.mjs): a ledger fix
            # alone must run it, or a red run on a ledger edit stays the newest and blocks the release's CI check
            "handoff/PLAN/app-integration/tickets/**", "handoff/PLAN/*.md"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml", "pipeline/deliver/bundle/schema.sql",
            "pipeline/deliver/bundle/indexes.sql",
            # (T543) the worker parity tests import these through Python; requirements/constraints build the venv
            "pipeline/regs/dfo_salmon/**", "pipeline/gauges/**", "requirements.txt", "constraints.txt",
            # (2026-11-13) `pnpm check` runs the ticket ledger + handoff docs guard (tools/check-tickets.mjs): a ledger fix
            # alone must run it, or a red run on a ledger edit stays the newest and blocks the release's CI check
            "handoff/PLAN/app-integration/tickets/**", "handoff/PLAN/*.md"]

# (T543) a newer push to the same ref supersedes the run in flight
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      # FULL history: tools/check-tickets.test.ts scans the commit subjects for ticket ids (a shallow clone has one)
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        # (T543) the version is app/package.json "packageManager", the one place it is written
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v4
        # app/.nvmrc = the Mac's Node: the generated-file gates (spinner PNG deflate) are byte-exact only on the same Node
        with: { node-version-file: app/.nvmrc, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }

      - run: pnpm install --frozen-lockfile

      # `pnpm check` runs the generated-file --checks (gauge policy, calendar, answers model) with the repo's
      # `.venv/bin/python`, exactly as on a laptop. They need no data, only the pipeline's code (P03).
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "requirements.txt\nconstraints.txt" }
      - name: Python venv for the generated-file checks
        working-directory: .
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt -c constraints.txt

      # THE SAME GATE AS A LAPTOP (P03): boundaries → platform → style → colours → spinner → fixture → gauge-policy →
      # calendar → answers → deps → typecheck → test. One command, so CI cannot drift from `pnpm check` by
      # forgetting a step (colours, spinner and fixture were missing here). Boundaries run first inside it: the
      # cheapest check, and its failure means the architecture is being violated, not that a test broke.
      - name: pnpm check (every app gate + tests + conformance)
        run: pnpm check

      # (T431) THE FEEDS WORKER'S OWN SUITES. The worker is not in the pnpm workspace, so `pnpm check` never ran them:
      # the DFO and gauge parity with the Python (the venv above), the report / crash endpoints, the cron dispatcher.
      # deploy/staging/feeds.sh runs the same command before it deploys.
      - name: Feeds worker tests
        working-directory: app/workers/feeds
        run: npx vitest run --root .

      # Nothing above bundles anything. Metro's monorepo resolution, the react-native-web
      # aliasing and the single-React pin are exactly the things that break silently and
      # are only observable in a bundle — a workspace link can typecheck and still fail to
      # resolve at bundle time. This builds the web output the phone UI actually ships as.
      - name: Web bundle builds (Expo + react-native-web)
        run: pnpm --filter @app/mobile run export:web

      # Same tree through the native transform + Hermes. Catches a web-only API reaching
      # shared code, which check-platform only catches for the cases it knows by name.
      - name: Native bundles build (iOS + Android JS)
        run: pnpm --filter @app/mobile exec expo export --platform android --platform ios
