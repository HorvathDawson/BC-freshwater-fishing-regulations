name: app

# (T993) THE APP'S CHECKS AS PARALLEL JOBS, so a failing one hides no other: one push learns every failure at once.
# Before this the whole of it was one job of sequential steps (`pnpm check`, the worker suite, two bundles), and the
# first red step skipped the rest (a red `pnpm check` hid the worker suite for 20.9 h, 0.8.5 stop 4). The same checks
# run, split as:
#   gates    `pnpm run check:fast`   every static gate, the typechecks, the inventories (the first half of `pnpm check`)
#   vitest   `pnpm run test`         the app's whole test suite (the second half of `pnpm check`)
#   bundles  web + native bundles    each step runs whether or not the other failed
# The feeds worker's own suites (T431) are a separate workflow, feeds-worker-ci.yml, with its own path filter; the
# ticket ledger / handoff docs guard is docs-ci.yml, on handoff/** (a docs-only push used to run this whole workflow for
# it: 210 runs, 1,578 minutes in 30 days). `scripts/ci_status.py` reads all of them.
#
# NOT here any more: pipeline/regs/dfo_salmon/**, pipeline/gauges/**, requirements.txt, constraints.txt and handoff/**
# (the worker parity tests that read them moved to feeds-worker-ci.yml; the generated-file gates over the pipeline's
# code are also pipeline-ci.yml's `emit --check`).

on:
  # (T995) a push to the trunk or a release branch runs this only when its area changed: these paths are
  # scripts/ci_paths.py AREAS["app"], word for word (test_workflow_pins.py); lanes get CI through their PR
  push:
    branches: [main, "release/**"]
    paths: ["app/**", ".github/workflows/app-ci.yml", ".github/actions/app-setup/**",
            "pipeline/deliver/bundle/schema.sql", "pipeline/deliver/bundle/indexes.sql",
            ".github/workflows/feeds-worker-ci.yml", "data/LICENSE-ODbL.md", "deploy/staging/build-apk.sh",
            "deploy/staging/build-ios-sim.sh", "deploy/staging/build-ios-testflight.sh", "deploy/staging/feeds.sh",
            "handoff/PLAN/runbooks/release.md", "pipeline/deliver/tiles/basemap.py",
            "pipeline/deliver/tiles/ladder.py", "pipeline/deliver/tiles/layers.py",
            "pipeline/deliver/tiles/tile-contract.json", "pipeline/gauges/consume/panel.py",
            "pipeline/gauges/feed/climatology.py", "pipeline/gauges/feed/publish.py", "scripts/test-full.sh",
            ".github/actions/changes/**", "scripts/ci_paths.py"]
  # (T995) EVERY pull request runs this workflow, with no path filter: a required check from a workflow that did not
  # run stays pending forever. Its `changes` job asks scripts/ci_paths.py whether the PR touched this area; the jobs
  # run only then (`if:`, a skip counts as a pass), and `app ok`, the required check, always reports.
  pull_request:

# (T543) a newer push to the same ref supersedes the run in flight
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # (T993) every job runs in BC time, as vitest.config.ts already pins for the tests: the runner is UTC, and a zone-
  # dependent test or gate fails here only. Named here too so the gates (node scripts) and the bundles agree.
  TZ: America/Vancouver

jobs:
  # (T995) which of this workflow's jobs a pull request needs (scripts/ci_paths.py AREAS["app"]); a push: all
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { run: "${{ steps.c.outputs.run }}" }
    steps:
      # full history, no file contents: the PR's merge base must be in the clone
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: c
        uses: ./.github/actions/changes
        with: { area: app }

  gates:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      # FULL history, no file contents (a partial clone): tools/check-tickets.mjs scans the commit subjects for ticket ids
      # (a shallow clone has one); the blobs of old commits are never read
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/app-setup
      # THE SAME GATES AS A LAPTOP (P03): tickets → anchors → changelog → boundaries → platform → style → colours →
      # spinner → coho → adipose → splash → gauge-policy → calendar → fish → answers → pack → app-reads → feed-formats →
      # deps → knip → typecheck (+ worker, seo) → promises → inventories. One command, so CI cannot drift from
      # `pnpm run check:fast` by forgetting a step. Boundaries run early inside it: the cheapest check, and its failure
      # means the architecture is being violated, not that a test broke.
      - name: pnpm run check:fast (every app gate)
        run: pnpm run check:fast

  vitest:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      # full history: tools/check-tickets.test.ts reads the commit subjects (see `gates`)
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/app-setup
      - name: pnpm run test (the whole app suite)
        run: pnpm run test

  bundles:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/app-setup
        with: { python: "false" }
      # Nothing in the gates or the tests bundles anything. Metro's monorepo resolution, the react-native-web
      # aliasing and the single-React pin are exactly the things that break silently and
      # are only observable in a bundle — a workspace link can typecheck and still fail to
      # resolve at bundle time. This builds the web output the phone UI actually ships as.
      - name: Web bundle builds (Expo + react-native-web)
        run: pnpm --filter @app/mobile run export:web

      # Same tree through the native transform + Hermes. Catches a web-only API reaching
      # shared code, which check-platform only catches for the cases it knows by name.
      # `!cancelled()`: it runs even when the web bundle failed, so one run lists both.
      - name: Native bundles build (iOS + Android JS)
        if: ${{ !cancelled() }}
        run: pnpm --filter @app/mobile exec expo export --platform android --platform ios

  # (T995) THE REQUIRED CHECK for main's branch protection (scripts/ci_paths.py REQUIRED): it always runs, and passes
  # only when every job above passed or was skipped by its `if:` (a failed or cancelled one fails it)
  ok:
    name: app ok
    if: always()
    needs: [changes, gates, vitest, bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: scripts/ci_paths.py, sparse-checkout-cone-mode: false }
      - name: Every job passed or was skipped
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: python3 scripts/ci_paths.py verdict
