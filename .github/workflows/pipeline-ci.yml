name: pipeline

# THE GUARDS, NOT THE MILL. Everything here is seconds and megabytes.
#
# The heavy half of this project — a full build, the gauge match, the tile export — runs a
# few times a year on a machine that can hold the atlas. It CANNOT run here and should not
# be made to: one build directory is ~10 GB (graph.gpkg alone is 4.5) against a hosted
# runner's 14 GB, and the match needs 2.8 GB of pickled geometry. Forcing it produces a job
# that fails for reasons unrelated to the change, and a job people learn to ignore is worse
# than no job.
#
# So this checks the things that are cheap to check and expensive to get wrong: that the
# committed artifacts still agree with the rosters they were built from, that generated
# files were regenerated, and that the suite passes. See
# AGENTS.md 39 for the two-tier split.

on:
  # (T995) a push to the trunk or a release branch runs this only when its area changed: these paths are
  # scripts/ci_paths.py AREAS["pipeline"], word for word (test_workflow_pins.py); lanes get CI through their PR
  push:
    branches: [main, "release/**"]
    paths: ["pipeline/**", "data/**", "config.yaml", "project_config.py", "requirements.txt", "constraints.txt",
            "curation-review/**", "scripts/**", ".github/**", ".githooks/**", "deploy/**", "app/**", "README.md",
            "pytest.ini", "conftest.py", ".gitignore", "handoff/PLAN/app-data/**", "handoff/PLAN/runbooks/**",
            ".github/actions/changes/**", "scripts/ci_paths.py"]
  # (T995) EVERY pull request runs this workflow, with no path filter: a required check from a workflow that did not
  # run stays pending forever. Its `changes` job asks scripts/ci_paths.py whether the PR touched this area; the jobs
  # run only then (`if:`, a skip counts as a pass), and `pipeline ok`, the required check, always reports.
  pull_request:
  # (T1041) A MERGE QUEUE's group runs this too, filtered as its pull requests were (scripts/ci_paths.py FILTERED),
  # so the required check reports on the group. Nothing sends the event until a ruleset turns a queue on.
  merge_group:
  workflow_dispatch:

# (T994 6) least privilege: the job reads the repo and nothing else
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # (T995) which of this workflow's jobs a pull request needs (scripts/ci_paths.py AREAS["pipeline"]); a push: all
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { run: "${{ steps.c.outputs.run }}" }
    steps:
      # full history, no file contents: the PR's merge base must be in the clone
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: c
        uses: ./.github/actions/changes
        with: { area: pipeline }

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Tests step on hosted runners, 2026-11-22: 10, 10, 11, 14.5, 17 min, one cut off past 17.5 (+ ~3 min setup), so 20
    # cancelled a sound run; 30 keeps the stop on a hang with room for the runner's spread
    timeout-minutes: 30
    # (T667) the interpreter scripts/test-env.sh runs: setup-python's `python` (on PATH from the step below). A hosted
    # runner has no .venv, the local default; test-env.sh stops naming PIPELINE_PY when neither runs.
    env: { PIPELINE_PY: python }
    steps:
      # FULL history: the review-proposal tests rebuild their fixtures with `git show <commit>:<path>` from the commit
      # the owner's marks were made against (test_review_proposals.py `MARKED_AT`); a shallow clone has no such commit.
      # (T993) A PARTIAL clone (`blob:none`): every commit and tree, no old file contents. That `show` fetches the one
      # blob it names (the checkout keeps its credentials); the full clone cost 30-37 s per run.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "requirements.txt\nconstraints.txt" }

      # (T416/T543) the pinned versions the release was built with; the freeze is printed so a drift shows in the run
      - run: pip install -r requirements.txt -c constraints.txt && pip freeze

      # The basemap zoom-cap audit's tests (test_basemap_zoom_audit.py) build a tiny fixture archive and run the
      # build's own path over it: tippecanoe, tile-join and tippecanoe-decode (Ubuntu's tippecanoe package) and the
      # go-pmtiles CLI (`pmtiles extract`), pinned. Seconds and a few MB — the tools, never the 4 GB source.
      - name: Tile tools (tippecanoe, pmtiles)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | sudo tar xz -C /usr/local/bin pmtiles
          tippecanoe --version; pmtiles version

      # FIRST, because it is the cheapest and its failure means the tree cannot be trusted
      # rather than that a test broke: every curated path in config.yaml resolves to a file
      # that exists. pydantic refuses to construct otherwise, naming the key.
      #
      # This is the `--splits` incident's tripwire. That flag had no default, silently
      # dropped all 376 curated cuts from three full builds, and nothing looked wrong.
      - name: Every curated path resolves
        run: python -c "from pipeline.common.curated import load, load_data_tree; load_data_tree(); print(load().model_dump_json(indent=1))"

      # Are the committed match artifacts still in step with the rosters they were built
      # from? A new station appearing with nobody re-running the match is invisible
      # otherwise — the river is just ungauged, with no error and no empty table.
      #
      # It never regenerates; it prints the command. Regeneration needs a completed build
      # and a human to read the diff.
      - name: Committed match artifacts are in step with their rosters
        run: python -m pipeline.tools.audit.check_curated --ci

      # T324: the hand-edited waters files (name_variants, area_closures, added_*, continuations, unmapped_waters) —
      # shape + references, seconds. The build runs the same check as its first step. A runner has no atlas registry,
      # so the registry references are skipped here, and the output says so.
      - name: Hand-edited waters files are sound
        run: python -m pipeline.tools.audit.check_curated --waters

      # THE GENERATORS (AGENTS 40): the gauge policy (trust bands, temperature, change, record), the answers/2 frame
      # models, the calendar spec and the release contract each exist in Python and in TypeScript/JSON for the app
      # (and the reference page's JS). One command re-runs all four and fails if any committed copy is stale or was
      # edited by hand, so the two sides cannot drift (`pipeline/tools/emit`).
      - name: Generated files are current (gauge policy, calendar, release contract, answers model)
        run: python -m pipeline.tools.emit --check

      # The no-data tier. A test that reads generated or fetched data (bundle, atlas, reach run,
      # tiles, the gpkg, the DFO cache) carries a needs_* marker and FAILS without it — it never
      # skips (pipeline/tests/conftest.py, test_no_silent_skips.py). A runner has none of that
      # data, so those tiers are deselected here by marker; `-m` replaces pytest.ini's
      # `-m "not slow"`, so slow is deselected again explicitly.
      - name: Tests
        run: python -m pytest -q --durations=25 -m "not slow and not needs_bundle and not needs_atlas and not needs_reach_run and not needs_tiles and not needs_source and not needs_cache"

      # (T667 slice 8) THE MINI RELEASE the app's logic tests read is what the real pipeline builds from the invented
      # world NOW: rebuilt in a temp dir (no live data: ~10 s) and compared by content with the committed copy; a
      # pipeline change that moves it fails here, naming the files and `python -m pipeline.tools.mini_release --write`.
      # (T978) after a merge too (both lanes passed alone, their merge moved it; 0.8.4's build found it): the annotation
      # puts the re-cut command on the run's summary page, not only in the log
      - name: The committed mini release matches a rebuild
        run: |
          python -m pipeline.tools.mini_release --check || {
            echo "::error title=The committed mini release is stale::re-cut it: python -m pipeline.tools.mini_release --write, then commit app/packages/data/dev/mini-release"
            exit 1; }

      # NO HARDCODED PATH MAY BYPASS THE CONFIG. Everything curated, and everything
      # fetched, is reached through `pipeline.common.curated`.
      #
      # The patterns match CODE, not prose: lines that are comments, or that contain a
      # backtick (this repo's docstring convention), are excluded — a docstring saying
      # "it used to be `Path(\"pipeline/atlas/splits.json\")`" is documentation of a fixed bug and
      # should stay. `project_config.py` is exempt from the data/ check because naming
      # paths is what that file is FOR.
      #
      # This is a hard gate. A missed path fails at RUNTIME with an EMPTY LOAD, not at
      # import with a crash: a --splits flag with no default silently dropped all 376
      # curated cuts from three full builds and nothing looked wrong.
      - name: No hardcoded curated or source paths
        run: |
          DIRS="pipeline data curation-review project_config.py"
          fail=0
          # Tracked files only: an untracked scratch file under data/generated/ is machine state CI never sees.
          hits () { git ls-files -- $DIRS | grep '\.py$' \
                    | grep -vE '(^|/)(archive|\.venv|node_modules|__pycache__|graphify-out)/' | tr '\n' '\0' \
                    | xargs -0 grep -EHn "$1" 2>/dev/null \
                    | grep -v ':[0-9]*: *#' | grep -vE "$2"; }
          check () {
            n=$(hits "$2" "${3:-^$}" | wc -l | tr -d ' ')
            printf '  %-42s %3s\n' "$1" "$n"
            [ "$n" -eq 0 ] || { hits "$2" "${3:-^$}" | sed 's/^/      /'; fail=1; }
          }
          check "quoted pipeline/*.json as a value" '[=(,]\s*"pipeline/[a-z_]+\.json"'
          # `.parent /` as well as `parents[N] /`. The build found this hole the hard way:
          # `_DEFAULT_SPLITS = Path(__file__).resolve().parent / "splits.json"` survived the
          # migration, and the first full build after it stopped dead — correctly, because
          # the missing-splits guard fired, but the gate should have caught it first.
          check "a __file__-relative curated file"  '(parents\[[0-9]\]|\.parent)\s*/\s*"(splits|cuts|name_variants|gauge_match|gauge_review|match_calls|added_streams|added_lakes|areas|area_closures|ungazetted|unmapped_waters)'
          check "quoted data/<file> as a value"     '[=(,]\s*"data/[a-z_]+\.(json|sqlite3|geojson|gpkg|csv|pmtiles)"'
          # the repo's top-level data/ only (a root then "data"): app/packages/data is a package, data/fetch_data.py code
          check "ROOT / \"data\" / a bare file"      '(ROOT|REPO|parents\[[0-9]\])\s*/\s*"data"\s*/\s*"[a-z]' '"(source|curated|generated)"|project_config\.py|"fetch_data\.py"'
          # (T435) the ONE-STRING form, `ROOT / "data/curated/…"`, which the check above (separate parts) missed 23 times;
          # tests are exempt (they pin the real files on purpose)
          check "ROOT / \"data/<tree>/…\" one string"   '(ROOT|REPO|parents\[[0-9]\]|\.parent)\s*/\s*"data/(curated|generated|source)/' '^pipeline/tests/'
          check "/ \"entries\" outside a tmp fixture" '(_ROOT|__file__|parents\[[0-9]\])[^\n]*/ "entries"'
          # (T994 7, T1021) THE MULTI-SEGMENT LITERAL, read by the AST (scripts/check_data_paths.py: its docstring is the
          # rule): any string that starts a path under data/ or cache/ (`"./data/x"`, `f"data/{x}"`, `"data/" + "x"`,
          # `Path("data")`, `os.path.join("data", …)`, any case), in code: only a docstring or a comment is exempt, never
          # a code line that happens to hold a backtick (the grep it replaced dropped those; so do the greps above no
          # more). Tests are exempt. A string that only names a path says `# path-label: <why>`; the labels let through
          # are listed and pinned (pipeline/tests/test_data_path_gate.py).
          python scripts/check_data_paths.py || fail=1
          exit $fail

  # (T995) THE REQUIRED CHECK for main's branch protection (scripts/ci_paths.py REQUIRED): it always runs, and passes
  # only when every job above passed or was skipped by its `if:` (a failed or cancelled one fails it)
  ok:
    name: pipeline ok
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: scripts/ci_paths.py, sparse-checkout-cone-mode: false }
      - name: Every job passed or was skipped
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: python3 scripts/ci_paths.py verdict
