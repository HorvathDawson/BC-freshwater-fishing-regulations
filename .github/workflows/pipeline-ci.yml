name: pipeline

# THE GUARDS, NOT THE MILL. Everything here is seconds and megabytes.
#
# The heavy half of this project — a full build, the gauge match, the tile export — runs a
# few times a year on a machine that can hold the atlas. It CANNOT run here and should not
# be made to: one build directory is ~10 GB (graph.gpkg alone is 4.5) against a hosted
# runner's 14 GB, and the match needs 2.8 GB of pickled geometry. Forcing it produces a job
# that fails for reasons unrelated to the change, and a job people learn to ignore is worse
# than no job.
#
# So this checks the things that are cheap to check and expensive to get wrong: that the
# committed artifacts still agree with the rosters they were built from, that generated
# files were regenerated, and that the suite passes. See
# pipeline/docs/archive/HANDOFF-curated-layout.md §8 for the two-tier split.

on:
  push:
    paths: ["pipeline/**", "data/**", "config.yaml", "project_config.py",
            "requirements.txt", ".github/workflows/pipeline-ci.yml"]
  pull_request:
    paths: ["pipeline/**", "data/**", "config.yaml", "project_config.py",
            "requirements.txt", ".github/workflows/pipeline-ci.yml"]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }

      - run: pip install -r requirements.txt

      # FIRST, because it is the cheapest and its failure means the tree cannot be trusted
      # rather than that a test broke: every curated path in config.yaml resolves to a file
      # that exists. pydantic refuses to construct otherwise, naming the key.
      #
      # This is the `--splits` incident's tripwire. That flag had no default, silently
      # dropped all 376 curated cuts from three full builds, and nothing looked wrong.
      - name: Every curated path resolves
        run: python -c "from pipeline.common.curated import load, load_data_tree; load_data_tree(); print(load().model_dump_json(indent=1))"

      # Are the committed match artifacts still in step with the rosters they were built
      # from? A new station appearing with nobody re-running the match is invisible
      # otherwise — the river is just ungauged, with no error and no empty table.
      #
      # It never regenerates; it prints the command. Regeneration needs a completed build
      # and a human to read the diff.
      - name: Committed match artifacts are in step with their rosters
        run: python -m pipeline.tools.check_curated --ci

      # The trust bands exist in Python and in TypeScript, because a browser cannot import
      # shed.py and a union type must exist before a bundle is opened. This re-runs the
      # generator and fails if the committed output differs, so the two cannot drift.
      - name: Generated gauge policy is current
        run: python -m pipeline.tools.emit_gauge_policy --check

      # The answers/2 frame models exist in Python (pydantic) and in TypeScript/JSON Schema for the
      # page; the generator re-runs and fails on any drift (AGENTS 40, DATAFLOW P7).
      - name: Generated answers/2 schema and types are current
        run: python -m pipeline.deliver.answers.model --check

      # The no-data tier. A test that reads generated or fetched data (bundle, atlas, reach run,
      # tiles, the gpkg, the DFO cache) carries a needs_* marker and FAILS without it — it never
      # skips (pipeline/tests/conftest.py, test_no_silent_skips.py). A runner has none of that
      # data, so those tiers are deselected here by marker; `-m` replaces pytest.ini's
      # `-m "not slow"`, so slow is deselected again explicitly.
      - name: Tests
        run: python -m pytest -q -m "not slow and not needs_bundle and not needs_atlas and not needs_reach_run and not needs_tiles and not needs_source and not needs_cache"

      # NO HARDCODED PATH MAY BYPASS THE CONFIG. Everything curated, and everything
      # fetched, is reached through `pipeline.common.curated`.
      #
      # The patterns match CODE, not prose: lines that are comments, or that contain a
      # backtick (this repo's docstring convention), are excluded — a docstring saying
      # "it used to be `Path(\"pipeline/atlas/splits.json\")`" is documentation of a fixed bug and
      # should stay. `project_config.py` is exempt from the data/ check because naming
      # paths is what that file is FOR.
      #
      # This is a hard gate. A missed path fails at RUNTIME with an EMPTY LOAD, not at
      # import with a crash: a --splits flag with no default silently dropped all 376
      # curated cuts from three full builds and nothing looked wrong.
      - name: No hardcoded curated or source paths
        run: |
          X="--exclude-dir=archive --exclude-dir=.venv --exclude-dir=node_modules \
             --exclude-dir=__pycache__ --exclude-dir=graphify-out --exclude-dir=.git"
          DIRS="pipeline data curation-review project_config.py"
          fail=0
          hits () { grep -rEn $X --include='*.py' "$1" $DIRS 2>/dev/null \
                    | grep -v ':[0-9]*: *#' | grep -v '`' | grep -vE "$2"; }
          check () {
            n=$(hits "$2" "${3:-^$}" | wc -l | tr -d ' ')
            printf '  %-42s %3s\n' "$1" "$n"
            [ "$n" -eq 0 ] || { hits "$2" "${3:-^$}" | sed 's/^/      /'; fail=1; }
          }
          check "quoted pipeline/*.json as a value" '[=(,]\s*"pipeline/[a-z_]+\.json"'
          # `.parent /` as well as `parents[N] /`. The build found this hole the hard way:
          # `_DEFAULT_SPLITS = Path(__file__).resolve().parent / "splits.json"` survived the
          # migration, and the first full build after it stopped dead — correctly, because
          # the missing-splits guard fired, but the gate should have caught it first.
          check "a __file__-relative curated file"  '(parents\[[0-9]\]|\.parent)\s*/\s*"(splits|name_variants|gauge_match|gauge_review|added_streams|added_lakes|areas|ungazetted)'
          check "quoted data/<file> as a value"     '[=(,]\s*"data/[a-z_]+\.(json|sqlite3|geojson|gpkg|csv|pmtiles)"'
          check "ROOT / \"data\" / a bare file"      '/\s*"data"\s*/\s*"[a-z]' '"(source|curated|generated)"|project_config\.py'
          check "/ \"entries\" outside a tmp fixture" '(_ROOT|__file__|parents\[[0-9]\])[^\n]*/ "entries"'
          exit $fail
