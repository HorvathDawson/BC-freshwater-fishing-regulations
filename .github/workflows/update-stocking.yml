name: Update Stocking

# Light tier of the two-tier stocking refresh (see refresh-stocking-db.yml for
# the heavy tier). Pulls anglerinfo.db from R2 read-only, refreshes FIDQ
# stocking release rows via fetch_stocking (no geopandas), then exports
# per-waterbody records/<waterbody_id>.json + stocking_index.json (NO reach
# resolution — the reach→waterbody match table ships with a full pipeline build).
# Surfaces NEW RELEASES for existing waterbodies; new waterbodies enter via the
# monthly heavy job.
#
# Weekly, not daily — FIDQ stocking changes seasonally, and reach mappings only
# move on a full regulations build.
on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays ~01:00 PST (09:00 UTC)
  workflow_dispatch: {}

concurrency:
  group: stocking-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # R2 I/O is pure-Python now (S3/boto3 via pipeline.recurring.r2_storage).
      - name: Install dependencies
        run: pip install pyyaml python-dotenv boto3

      - name: Export and upload stocking records
        run: bash scripts/update-stocking.sh --upload
        env:
          DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
