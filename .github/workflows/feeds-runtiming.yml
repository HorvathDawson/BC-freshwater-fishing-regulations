name: feeds — run timing (PSF + DFO) → R2 runtiming/

# T199 (owner 2026-10-28): run timing is ITS OWN STREAM. T412 (owner 2026-11-05): this workflow is its ONLY publisher —
# a "slow feed". Started by a button, by deploy/staging/upload.sh for a new release (`tiles`), or by the feeds worker;
# NEVER a GitHub schedule (owner: flaky, unpaid).
#
# What it does (pipeline/runtiming/feed/__init__.py has the data contract):
#   1. which atlas: the `tiles` input (a release being uploaded: its pointer flips only after this run publishes), else
#      the bucket's live release/manifest.json → its tiles' id; section_handles = the id's first part
#   2. the binding base for those handles: private/runtiming/base/<handles>.json.gz (the atlas reduced to what the
#      binding reads; every release ships it — `pipeline deliver` stages it, the staging upload puts it here)
#   3. fetch: the Pacific Salmon Explorer's run-timing page + the CU polygon tiles (PSF), NuSEDS (DFO, OGL – Canada)
#   4. parse (pipeline.runtiming.parse) → timing.json + cu_polygons.geojson, in the runner only
#   5. build (pipeline.runtiming.feed.build) → runtiming/{runs,paint,waters}-<sha12>.json.gz + index.json, checked
#   6. diff against the live runtiming/ (pipeline.runtiming.feed.diff): runs added / dropped / changed, in the summary;
#      (T552 item 1) THE FLOOR: PSF runs, DFO runs or painted sections falling > 10% against the live feed FAIL the run
#      (an upstream column or page change), unless `allow_shrink` gives the owner's reason
#   7. (upload: true, and only on a real change) the files, then index.json LAST (pipeline.runtiming.feed.publish)
# (T485, owner 2026-11-07) THE LAST GOOD SOURCES ARE KEPT, PRIVATELY: a fresh fetch (`refresh`, or no copy yet) is
# stored at private/runtiming/src/sources.tar.gz with its fetch date — (T552 item 1) only AFTER parse, build and the
# floor pass, so a broken download never becomes the copy later runs build from — (never public: the PSF pages may not be re-hosted,
# T162); every other run builds from that copy and makes NO outside request, so an open.canada.ca outage cannot block a
# release. The summary names the copy's date; a copy older than MAX_SRC_DAYS fails the run. The run's artifact is the
# REPORT only (counts, sizes), never the data.
#
# TARGET: staging by default and, for now, ONLY staging. Production is an explicit choice that is commented out
# below until the owner enables it (uncomment the option AND the prod secrets block; publish.py names only staging —
# give it a --bucket first).
#
# SECRETS (the repo's existing ones, as feeds-hydat.yml):
#   CLOUDFLARE_ACCOUNT_ID            the account id (R2's S3 endpoint is https://<id>.r2.cloudflarestorage.com)
#   R2_ACCESS_KEY_ID                 the repo's R2 API token (Object Read & Write); it may be account-wide, so the
#   R2_SECRET_ACCESS_KEY             bucket guard below is what keeps this staging-only
#   (prod, later) PROD_R2_ACCESS_KEY_ID / PROD_R2_SECRET_ACCESS_KEY
#
# NOTE: GitHub only lists a workflow_dispatch workflow in the Actions tab once the file is on the default branch
# (main); until then run it with `gh workflow run feeds-runtiming.yml --ref redesign/stream-sections -f upload=false`.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which R2 bucket"
        type: choice
        default: staging
        options:
          - staging
          # - production   # OWNER: uncomment to enable (and the prod secrets in the env block below)
      upload:
        description: "Upload to R2 runtiming/ (false = build and report only)"
        type: boolean
        default: false
      tiles:
        description: "Bind for these tiles (a release being uploaded; empty = the live release's)"
        type: string
        default: ""
      refresh:
        description: "Fetch the sources afresh (PSF + NuSEDS) and keep them; false = build from the kept copy"
        type: boolean
        default: false
      expect_dfo:
        description: "(T552) the NuSEDS date (YYYYMMDD) this run must reach (the feeds worker's new-NuSEDS run); empty = none"
        type: string
        default: ""
      allow_shrink:
        description: "(T552) the owner's reason to let a > 10% fall in runs or painted sections through; empty = refuse it"
        type: string
        default: ""
  # (T412/T413) REGISTRATION ONLY: GitHub can dispatch a workflow that is not on the default branch (main stays
  # untouched) only once it has run there; a push of THIS file registers it. The job below is skipped for a push.
  push:
    paths: [".github/workflows/feeds-runtiming.yml"]

concurrency:
  group: feeds-runtiming
  cancel-in-progress: false

jobs:
  runtiming:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUCKET: ${{ inputs.target == 'production' && 'bc-fishing-regulations' || 'bc-fishing-regulations-staging' }}
      UPLOAD: ${{ inputs.upload }}
      TILES_IN: ${{ inputs.tiles }}
      REFRESH: ${{ inputs.refresh }}
      ALLOW_SHRINK: ${{ inputs.allow_shrink }}
      EXPECT_DFO: ${{ inputs.expect_dfo }}
      MAX_SRC_DAYS: "400"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # OWNER (prod): replace the two lines above with
      #   AWS_ACCESS_KEY_ID: ${{ inputs.target == 'production' && secrets.PROD_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      #   AWS_SECRET_ACCESS_KEY: ${{ inputs.target == 'production' && secrets.PROD_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      W: ${{ github.workspace }}/work
      DATA: https://data-staging.canifishthis.ca
    steps:
      - name: Guard — staging only until the owner enables production
        run: |
          case "$BUCKET" in
            bc-fishing-regulations-staging) echo "target bucket: $BUCKET" ;;
            *) echo "::error::only bc-fishing-regulations-staging is allowed (got $BUCKET)"; exit 1 ;;
          esac
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::R2 keys are not set (see the header)"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # only what fetch / parse / build import (pipeline.common.curated: pyyaml + pydantic; the polygons: shapely +
      # mapbox-vector-tile), not the whole pipeline's requirements.txt
      - run: pip install -c constraints.txt pyyaml pydantic shapely mapbox-vector-tile orjson

      - name: 1/7 which atlas (the tiles input, else release/manifest.json)
        run: |
          if [ -n "$TILES_IN" ]; then
            T="$TILES_IN"
          else
            aws s3 cp "s3://$BUCKET/release/manifest.json" /tmp/manifest.json --endpoint-url "$R2_ENDPOINT" --only-show-errors \
              || { echo "::error::no release/manifest.json in $BUCKET"; exit 1; }
            T=$(python -c 'import json; print(json.load(open("/tmp/manifest.json"))["tiles"]["current"]["id"])')
          fi
          echo "TILES=$T" >> "$GITHUB_ENV"
          echo "HANDLES=${T%%.*}" >> "$GITHUB_ENV"
          echo "tiles $T (section_handles ${T%%.*})"

      - name: 2/7 the binding base for that atlas
        run: |
          mkdir -p "$W"
          aws s3 cp "s3://$BUCKET/private/runtiming/base/$HANDLES.json.gz" "$W/base.json.gz" --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors || {
            echo "::error::no binding base for section_handles $HANDLES: the staging upload of that release puts it there"
            exit 1; }

      - name: 3/7 sources (the kept copy; fetched afresh on `refresh` or when none is kept — T485)
        run: |
          KEPT="s3://$BUCKET/private/runtiming/src/sources.tar.gz"
          if [ "$REFRESH" != "true" ] && aws s3 cp "$KEPT" "$W/sources.tar.gz" --endpoint-url "$R2_ENDPOINT" --only-show-errors; then
            tar -xzf "$W/sources.tar.gz" -C "$W"
            AGE=$(python -c 'import datetime,sys; f=datetime.date.fromisoformat(open(sys.argv[1]).read().strip()); print((datetime.date.today()-f).days)' "$W/src/FETCHED")
            echo "sources: the kept copy, fetched $(cat "$W/src/FETCHED") ($AGE days old)" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$AGE" -le "$MAX_SRC_DAYS" ] || { echo "::error::the kept sources are $AGE days old (> $MAX_SRC_DAYS): run this workflow with refresh=true"; exit 1; }
          else
            [ "$REFRESH" = "true" ] && WHY="refresh asked" || WHY="no kept copy yet"
            echo "sources: fetched afresh ($WHY)" | tee -a "$GITHUB_STEP_SUMMARY"
            python -m pipeline.runtiming.fetch.explorer --out "$W/src" --only run-timing
            python -m pipeline.runtiming.fetch.boundaries --out "$W/src"
            python -m pipeline.runtiming.fetch.nuseds --out "$W/src/dfo"
            date -u +%F > "$W/src/FETCHED"
            tar -czf "$W/sources.tar.gz" -C "$W" src
            # kept only after parse, build and the floor pass (the step after the diff), never before
            echo "FRESH=true" >> "$GITHUB_ENV"
          fi

      - name: 4/7 parse
        run: |
          # (T552 item 2) --expect-dfo: a run started for a new NuSEDS fails when its sources still are not that version
          python -m pipeline.runtiming.parse --src "$W/src" --out "$W/timing.json" --polygons "$W/cu_polygons.geojson" \
            --expect-dfo "$EXPECT_DFO"

      - name: 5/7 build (bind + paint index + checks)
        run: |
          python -m pipeline.runtiming.feed.build --timing "$W/timing.json" --polygons "$W/cu_polygons.geojson" \
            --base "$W/base.json.gz" --tile-version "$TILES" --out "$W/out"
          ls -la "$W/out/runtiming"
          { echo '```json'; cat "$W/out/report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with: { name: "runtiming-report-${{ env.HANDLES }}", path: work/out/report.json, retention-days: 30 }

      - name: 6/7 diff against the live run timing
        run: |
          set -o pipefail
          # exit 1 when the new feed fell past the floor (the report is written first and shown either way)
          RC=0
          python -m pipeline.runtiming.feed.diff --new "$W/out/runtiming" --live "$DATA/runtiming" --out "$W/out/diff.json" \
            --allow-shrink "$ALLOW_SHRINK" || RC=$?
          { echo '### diff against the live run timing'; echo '```json'; cat "$W/out/diff.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            echo "::error::the new run timing fell past the floor against the live feed (see the summary): nothing kept, nothing uploaded"
            exit "$RC"
          fi
          echo "CHANGED=$(python -c 'import json; print(str(json.load(open("'"$W"'/out/diff.json"))["changed"]).lower())')" >> "$GITHUB_ENV"

      - name: keep the fresh sources (only a fresh fetch that parsed, built and passed the floor — T485, T552)
        if: env.FRESH == 'true'
        run: |
          aws s3 cp "$W/sources.tar.gz" "s3://$BUCKET/private/runtiming/src/sources.tar.gz" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "sources: kept at private/runtiming/src/sources.tar.gz ($(du -h "$W/sources.tar.gz" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 7/7 upload to R2 (files, then index.json last) — only a real change
        if: env.UPLOAD == 'true' && env.CHANGED == 'true'
        run: |
          python -m pipeline.runtiming.feed.publish --dir "$W/out/runtiming" --via aws --yes
          echo "Uploaded run timing (atlas $HANDLES) to $BUCKET/runtiming/." >> "$GITHUB_STEP_SUMMARY"
