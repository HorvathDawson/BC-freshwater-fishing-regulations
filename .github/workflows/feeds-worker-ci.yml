name: feeds worker

# (T431, T993) THE FEEDS WORKER'S OWN SUITES, as their own workflow with their own path filter. The worker is not in the
# pnpm workspace, so `pnpm check` never ran them: the DFO and gauge parity with the Python (the venv below), the report
# / crash endpoints, the cron dispatcher. deploy/staging/feeds.sh runs the same command before it deploys.
# It was the last step of app-ci's one job (skipped whenever an earlier step failed) and app-ci ran for every change
# under app/ and handoff/. Now it runs when what it reads changes: the worker, the core package it imports, the
# Python the parity tests call (pipeline/regs/dfo_salmon, pipeline/gauges), the venv's requirements, and the app's
# lockfile (vitest resolves from app/node_modules).

on:
  push:
    paths: ["app/workers/feeds/**", "app/packages/core/**", "app/tools/test-tmp.ts", "app/package.json", "app/pnpm-lock.yaml",
            "pipeline/regs/dfo_salmon/**", "pipeline/gauges/**", "pipeline/tests/fixtures/**",
            # (review) what the worker's tests import or read outside the worker and core: derived by
            # pipeline/tests/test_workflow_pins.py, which fails when a test reaches a path this list misses
            "app/conformance/**", "app/tools/gauge-feed-contract*", "app/tools/seo/**", "app/packages/map/style/**",
            "data/curated/dfo_salmon/**", "data/source/bc_hydrometric_stations.json", "scripts/update-hydat.sh",
            "deploy/**",
            "requirements.txt", "constraints.txt",
            ".github/workflows/feeds-worker-ci.yml", ".github/actions/app-setup/**"]
  pull_request:
    paths: ["app/workers/feeds/**", "app/packages/core/**", "app/tools/test-tmp.ts", "app/package.json", "app/pnpm-lock.yaml",
            "pipeline/regs/dfo_salmon/**", "pipeline/gauges/**", "pipeline/tests/fixtures/**",
            # (review) what the worker's tests import or read outside the worker and core: derived by
            # pipeline/tests/test_workflow_pins.py, which fails when a test reaches a path this list misses
            "app/conformance/**", "app/tools/gauge-feed-contract*", "app/tools/seo/**", "app/packages/map/style/**",
            "data/curated/dfo_salmon/**", "data/source/bc_hydrometric_stations.json", "scripts/update-hydat.sh",
            "deploy/**",
            "requirements.txt", "constraints.txt",
            ".github/workflows/feeds-worker-ci.yml", ".github/actions/app-setup/**"]

concurrency:
  group: feeds-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: America/Vancouver

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # pnpm + Node + install, and the venv the Python parity needs (before the tests)
      - uses: ./.github/actions/app-setup
      - name: Feeds worker tests
        working-directory: app/workers/feeds
        run: npx vitest run --root .
