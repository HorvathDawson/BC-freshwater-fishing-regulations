name: feeds worker

# (T431, T993) THE FEEDS WORKER'S OWN SUITES, as their own workflow with their own path filter. The worker is not in the
# pnpm workspace, so `pnpm check` never ran them: the DFO and gauge parity with the Python (the venv below), the report
# / crash endpoints, the cron dispatcher. deploy/staging/feeds.sh runs the same command before it deploys.
# It was the last step of app-ci's one job (skipped whenever an earlier step failed) and app-ci ran for every change
# under app/ and docs/. Now it runs when what it reads changes: the worker, the core package it imports, the
# Python the parity tests call (pipeline/regs/dfo_salmon, pipeline/gauges), the venv's requirements, and the app's
# lockfile (vitest resolves from app/node_modules).

on:
  # (T995) a push to the trunk or a release branch runs this only when its area changed: these paths are
  # scripts/ci_paths.py AREAS["feeds-worker"], word for word (test_workflow_pins.py); lanes get CI through their PR
  push:
    branches: [main, "release/**"]
    paths: ["app/workers/feeds/**", "app/packages/core/**", "app/tools/test-tmp.ts", "app/package.json",
            "app/pnpm-lock.yaml", "pipeline/regs/dfo_salmon/**", "pipeline/gauges/**", "pipeline/tests/fixtures/**",
            "app/conformance/**", "app/tools/gauge-feed-contract*", "app/tools/seo/**", "app/packages/map/style/**",
            "data/curated/dfo_salmon/**", "data/source/bc_hydrometric_stations.json", "scripts/update-hydat.sh",
            "deploy/**", "requirements.txt", "constraints.txt", ".github/workflows/feeds-worker-ci.yml",
            ".github/actions/app-setup/**", ".github/actions/changes/**", "scripts/ci_paths.py"]
  # (T995) EVERY pull request runs this workflow, with no path filter: a required check from a workflow that did not
  # run stays pending forever. Its `changes` job asks scripts/ci_paths.py whether the PR touched this area; the jobs
  # run only then (`if:`, a skip counts as a pass), and `feeds worker ok`, the required check, always reports.
  pull_request:
  # (T1041) A MERGE QUEUE's group runs this too, filtered as its pull requests were (scripts/ci_paths.py FILTERED),
  # so the required check reports on the group. Nothing sends the event until a ruleset turns a queue on.
  merge_group:

concurrency:
  group: feeds-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: America/Vancouver

jobs:
  # (T995) which of this workflow's jobs a pull request needs (scripts/ci_paths.py AREAS["feeds-worker"]); a push: all
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { run: "${{ steps.c.outputs.run }}" }
    steps:
      # full history, no file contents: the PR's merge base must be in the clone
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: c
        uses: ./.github/actions/changes
        with: { area: feeds-worker }

  worker:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # pnpm + Node + install, and the venv the Python parity needs (before the tests)
      - uses: ./.github/actions/app-setup
      - name: Feeds worker tests
        working-directory: app/workers/feeds
        run: npx vitest run --root .

  # (T995) THE REQUIRED CHECK for main's branch protection (scripts/ci_paths.py REQUIRED): it always runs, and passes
  # only when every job above passed or was skipped by its `if:` (a failed or cancelled one fails it)
  ok:
    name: feeds worker ok
    if: always()
    needs: [changes, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: scripts/ci_paths.py, sparse-checkout-cone-mode: false }
      - name: Every job passed or was skipped
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: python3 scripts/ci_paths.py verdict
