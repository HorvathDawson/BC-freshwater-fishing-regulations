name: docs

# (T993) THE TICKET LEDGER AND HANDOFF DOCS GUARD, on its own. app/tools/check-tickets.mjs (T84, T539) keeps the ledger
# whole and reads every commit SUBJECT for a ticket id (a subject that names a Tnnn before its file and ledger row exist
# fails), and checks the handoff docs (START-HERE, the restart pages and the runbooks cite paths that exist;
# START-HERE and each restart page stay short, a restart page holds no state; AGENTS rule ids are unique). (T1081) It also
# holds the size budgets (app/tools/check-size.mjs: required reading, READMEs, open tickets, any markdown file, the docs
# tree's totals, closed tickets' picture folders). A ledger fix alone must run it, or a red run on a ledger
# edit stays the newest and blocks the release's CI check (scripts/ci_status.py reads this workflow too).
#
# It used to run inside app-ci for every push under docs/: 210 docs-only pushes, 1,578 minutes in 30 days, to run
# a check that takes seconds. Here a docs push costs the install and two small test files.

on:
  # (T995) a push to the trunk or a release branch runs this only when its area changed: these paths are
  # scripts/ci_paths.py AREAS["docs"], word for word (test_workflow_pins.py); lanes get CI through their PR
  push:
    branches: [main, "release/**"]
    paths: ["docs/**", "tickets/**", "AGENTS.md", ".github/copilot-instructions.md", "app/tools/check-tickets.mjs",
            "app/tools/check-tickets.test.ts", "app/tools/start-here.test.ts", "app/tools/ledger.mjs",
            "app/tools/ledger.test.ts", "app/tools/check-size.mjs", "app/tools/check-size.test.ts",
            # (T1081) the size guard reads every markdown file's length and each package's README / manifest
            "*.md", "**/*.md", "pipeline/*/__init__.py", "app/apps/*/package.json", "app/packages/*/package.json",
            "app/workers/*/package.json", ".github/workflows/docs-ci.yml",
            ".github/actions/app-setup/**", ".github/actions/changes/**", "scripts/ci_paths.py"]
  # (T995) EVERY pull request runs this workflow, with no path filter: a required check from a workflow that did not
  # run stays pending forever. Its `changes` job asks scripts/ci_paths.py whether the PR touched this area; the jobs
  # run only then (`if:`, a skip counts as a pass), and `docs ok`, the required check, always reports.
  # (T998) `edited` too: a PR title fixed by hand re-runs the `commits` job (a re-run reads the old title)
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # (T1041) A MERGE QUEUE's group runs this too, filtered as its pull requests were (scripts/ci_paths.py FILTERED),
  # so the required check reports on the group. Nothing sends the event until a ruleset turns a queue on.
  merge_group:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # (T995) which of this workflow's jobs a pull request needs (scripts/ci_paths.py AREAS["docs"]); a push: all
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { run: "${{ steps.c.outputs.run }}" }
    steps:
      # full history, no file contents: the PR's merge base must be in the clone
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - id: c
        uses: ./.github/actions/changes
        with: { area: docs }

  ledger:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app
    steps:
      # full history, no old file contents (a partial clone): the guard reads commit subjects
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      # no venv: the guard and its two test files read text and git only
      - uses: ./.github/actions/app-setup
        with: { python: "false" }
      - name: The ticket ledger is whole, the handoff docs are right
        run: pnpm run tickets
      # `if: !cancelled()`: both run, so one push lists both failures
      # (T1041) ledger.test.ts: the row block, the views, the import's round trip on the real old files (git history:
      # the clone above has it) and the carry of an old-style branch
      - name: The guard's own tests, the ledger tool's, and the one start-here page
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tools/check-tickets.test.ts tools/start-here.test.ts tools/ledger.test.ts tools/check-size.test.ts

  # (T998) EVERY COMMIT IN THE PULL REQUEST, AND ITS TITLE, FOLLOW CONVENTIONAL COMMITS (app/tools/check-commits.mjs,
  # the commit-msg hook's check). On every pull request, whatever it touched: no `changes` gate. The title is checked
  # as the merge commit GitHub writes from it (`<title> (#N)`, merge_commit_title=PR_TITLE); a push skips it (its
  # commits were checked on their PR).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app
    steps:
      # full history, no old file contents: the PR's commits and the cutover must be in the clone
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/app-setup
        with: { python: "false" }
      - name: Every commit and the PR title follow Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/check-commits.mjs --range "$BASE_SHA..$HEAD_SHA" --title "$PR_TITLE" --number "$PR_NUMBER"

  # (T995) THE REQUIRED CHECK for main's branch protection (scripts/ci_paths.py REQUIRED): it always runs, and passes
  # only when every job above passed or was skipped by its `if:` (a failed or cancelled one fails it)
  ok:
    name: docs ok
    if: always()
    needs: [changes, ledger, commits]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: scripts/ci_paths.py, sparse-checkout-cone-mode: false }
      - name: Every job passed or was skipped
        env: { NEEDS: "${{ toJSON(needs) }}" }
        run: python3 scripts/ci_paths.py verdict
