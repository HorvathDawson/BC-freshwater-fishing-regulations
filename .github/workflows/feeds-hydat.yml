name: feeds — HYDAT → climatology → R2

# T225 follow-up (owner 2026-10-28). MANUAL ONLY (workflow_dispatch): no schedule; a push of this file only registers it (skipped). The trigger is the
# app's / feed's "new HYDAT release" notice (T301, owner 2026-10-30). The run asks ECCC's listing first (a few KB) and
# stops there unless it names a newer HYDAT than the staging feed is on (force: true rebuilds anyway).
#
# What it does — the part of scripts/update-hydat.sh a hosted runner can do:
#   1. fetch that HYDAT (scripts/hydat-fetch.sh: ~280 MB, resumable, size + CRC + quick_check, sha256 recorded)
#   2. rebuild the percentile envelope: python -m pipeline.gauges.feed.climatology → clim.json, and (T274) the stored
#      daily means per station the staging feed publishes (pipeline.gauges.feed.hydat_daily --index) → hydat_daily/
#   3. (upload: true) put clim.json at <bucket>/feeds/live/clim.json — the input the feeds Worker
#      reads every gauge run (bc-fishing-feeds-staging; its next run re-measures every percentile and its HYDAT notice
#      clears: current == latest) — and the daily means at <bucket>/feeds/hydat/<station>.json (what dayFlow.ts reads).
# Gauge MATCHES are never touched (data/curated/gauges/matches.json is the one frozen file).

# What it does NOT do: steps 4–5 of update-hydat.sh (`pipeline build` + the release upload). The build needs the ~10 GB
# atlas (see pipeline-ci.yml's header) — the owner runs `scripts/update-hydat.sh --upload` on the Mac for the bundle.
#
# TARGET: staging by default and, for now, ONLY staging. Production is an explicit choice that is commented out
# below until the owner enables it (uncomment the option AND the prod secrets block).
#
# SECRETS (named here, NOT set — the owner adds them under Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID            the account id (R2's S3 endpoint is https://<id>.r2.cloudflarestorage.com)
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   the repo's existing R2 API token (already set by the owner); it must be
#                                             allowed Object Read & Write on bc-fishing-regulations-staging. It may be
#                                             account-wide: the bucket guard below is what keeps this staging-only.
#
# NOTE: GitHub only lists a workflow_dispatch workflow in the Actions tab once the file is on the default branch
# (main); until then run it with `gh workflow run feeds-hydat.yml --ref redesign/stream-sections -f upload=false`.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which R2 bucket"
        type: choice
        default: staging
        options:
          - staging
          # - production   # OWNER: uncomment to enable (and the prod secrets in the env block below)
      upload:
        description: "Upload clim.json + feeds/hydat/ to R2 (false = build them and attach as an artifact only)"
        type: boolean
        default: false
      force:
        description: "Rebuild the envelope even when HYDAT is unchanged"
        type: boolean
        default: false
  # (T412/T413) REGISTRATION ONLY: GitHub can dispatch a workflow that is not on the default branch (main stays
  # untouched) only once it has run there; a push of THIS file registers it. The job below is skipped for a push.
  push:
    paths: [".github/workflows/feeds-hydat.yml"]

concurrency:
  group: feeds-hydat
  cancel-in-progress: false

jobs:
  hydat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUCKET: ${{ inputs.target == 'production' && 'bc-fishing-regulations' || 'bc-fishing-regulations-staging' }}
      UPLOAD: ${{ inputs.upload }}
      FORCE: ${{ inputs.force }}
      DATA: https://data-staging.canifishthis.ca
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # OWNER (prod): the same token, if it reaches the prod bucket; widen the guard below on purpose, nowhere else
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Guard — staging only until the owner enables production
        run: |
          case "$BUCKET" in
            bc-fishing-regulations-staging) echo "target bucket: $BUCKET" ;;
            *) echo "::error::only bc-fishing-regulations-staging is allowed (got $BUCKET)"; exit 1 ;;
          esac
          # (T543) the key is checked FIRST, before any fetch or build, when this run will upload
          if [ "$UPLOAD" = "true" ]; then
            [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::R2 keys are not set (see the header)"; exit 1; }
          fi

      - name: What staging is on, and what ECCC lists (a few KB; no download)
        id: now
        run: |
          cur=$(curl -sSf "$DATA/feeds/live/index.json" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("hydat") or {}).get("release") or "")' || true)
          latest=$(curl -sSf -A "BC-FishRegs-DataFetch/1.0" https://collaboration.cmc.ec.gc.ca/cmc/hydrometrics/www/ \
            | grep -oE 'Hydat_sqlite3_[0-9]{8}\.zip' | grep -oE '[0-9]{8}' | sort -u | tail -1 || true)
          [ -n "$latest" ] || { echo "::error::could not read the HYDAT listing"; exit 1; }
          echo "HYDAT=$latest" >> "$GITHUB_ENV"
          echo "staging feed is on HYDAT ${cur:-unknown}; ECCC lists $latest"
          if [ "$cur" = "$latest" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Staging is already on HYDAT $latest — nothing to do (force: true rebuilds anyway)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.now.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.now.outputs.skip != 'true'
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "requirements.txt\nconstraints.txt" }
      - if: steps.now.outputs.skip != 'true'
        run: pip install -r requirements.txt -c constraints.txt

      - name: 1/3 fetch HYDAT (resumable, checked)
        if: steps.now.outputs.skip != 'true'
        run: |
          scripts/hydat-fetch.sh "$HYDAT" /tmp/hydat data/source/hydat.sqlite3
          echo "HYDAT $HYDAT zip sha256: $(cut -d' ' -f1 /tmp/hydat/Hydat_sqlite3_$HYDAT.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - name: 2/3 envelope + stored daily means
        if: steps.now.outputs.skip != 'true'
        run: |
          mkdir -p out
          python -m pipeline.gauges.feed.climatology --hydat data/source/hydat.sqlite3 --out out/clim.json
          curl -sSf "$DATA/feeds/live/index.json" -o out/index.json
          python -m pipeline.gauges.feed.hydat_daily --hydat data/source/hydat.sqlite3 --index out/index.json --out out/hydat_daily
          ls -la out/clim.json; ls out/hydat_daily | wc -l

      - uses: actions/upload-artifact@v4
        if: steps.now.outputs.skip != 'true'
        with: { name: "hydat-${{ env.HYDAT }}", path: "out/clim.json\nout/hydat_daily/", retention-days: 14 }

      - name: 3/3 upload to R2 (feeds/live/clim.json, feeds/hydat/)
        if: steps.now.outputs.skip != 'true' && env.UPLOAD == 'true'
        run: |
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::R2 keys are not set (see the header)"; exit 1; }
          aws s3 sync out/hydat_daily "s3://$BUCKET/feeds/hydat/" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=86400" --only-show-errors
          # the envelope LAST: the worker's next run clears the notice, so everything it names must already be up
          aws s3 cp out/clim.json "s3://$BUCKET/feeds/live/clim.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300" --only-show-errors
          {
            echo "Uploaded HYDAT $HYDAT: clim.json to $BUCKET/feeds/live/clim.json and $(ls out/hydat_daily | wc -l) station files to feeds/hydat/."
            echo "The feeds Worker reads clim.json on its next gauge run. The bundle (gauge_clim / section_panel) still needs"
            echo "\`scripts/update-hydat.sh\` on the owner's Mac (the build cannot run on a hosted runner); prod R2 stays human."
          } >> "$GITHUB_STEP_SUMMARY"
