name: Update Hydro (realtime)

# Frequent gauge realtime + forecast refresh. Stateless for the heavy readings —
# see pipeline/recurring/hydro/jobs.py. NOTE: GitHub-hosted cron drifts under load,
# so */15 is best-effort freshness, not a guarantee.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (best-effort; GHA may delay)
  workflow_dispatch: {}

# Overlapping runs would clobber each other's ~451 uploaded objects — serialize.
concurrency:
  group: hydro-realtime-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # hydro fetch/export is stdlib-only for HTTP; the job entrypoint needs only
      # boto3 (R2 S3 I/O) + pyyaml/python-dotenv (ProjectConfig). No geo stack.
      - name: Install dependencies
        run: pip install boto3 pyyaml python-dotenv

      - name: Run hydro realtime job
        run: python -m pipeline.recurring.hydro.jobs realtime
        env:
          DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
