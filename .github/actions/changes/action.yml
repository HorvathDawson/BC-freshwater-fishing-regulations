name: changes
description: >
  (T995) Does this run's change touch the workflow's area? `run` = "true" | "false", from scripts/ci_paths.py (the one
  list of every workflow's paths; `before_push.py --changed` reads it too). A pull request runs every workflow; this
  says which of its jobs apply (the others are skipped by their `if:`, which counts as a pass for the required `ok`
  job). (T1041) A merge queue group is filtered the same way, over its
  base_sha...head_sha. A push or a manual run: always "true" (the workflow's own `on: push: paths:` already chose it). Plain
  `git diff --name-only <base>...<head>`, no third-party action. Run it after `actions/checkout` with full history
  (`fetch-depth: 0`, `filter: blob:none`: the merge base must be there; no old file contents are read).
inputs:
  area:
    description: 'the area in scripts/ci_paths.py AREAS: docs | app | feeds-worker | pipeline'
    required: true
outputs:
  run:
    description: '"true" when the area changed (or the run is not a pull request)'
    value: ${{ steps.c.outputs.run }}
runs:
  using: composite
  steps:
    - id: c
      name: What changed in this area
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AREA: ${{ inputs.area }}
        EVENT_NAME: ${{ github.event_name }}
        # (T1041) a merge queue's group: the trunk's tip and the group's commit (empty on every other event)
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      run: python3 scripts/ci_paths.py github "$AREA"
