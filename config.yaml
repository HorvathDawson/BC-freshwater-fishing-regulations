# Where the data lives: paths only, relative to the repo. An unknown or missing key stops the load, naming it.
# Every other file's name, what it is and who owns it: pipeline/common/curated.py (each field's `At` and note).

roots:
  source: "data/source"
  curated: "data/curated"
  generated: "data/generated"
  release: "data/release"
  cache: "cache"
source:
  fwa_gpkg: "bc_fisheries_data.gpkg"   # the FWA GeoPackage, under roots.source
atlas_build: "full"                     # the atlas build the review app serves, and every reader's default
