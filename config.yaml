# BC Freshwater Fishing Regulations - Central Configuration

# ============================================================================
# Output Directory Structure
# ============================================================================
# ⚠️ THESE ARE OUTPUT DIRECTORIES ON DISK. They do NOT track the layout of pipeline/ — the
# code was regrouped into atlas/regs/gauges/deliver/common and these did not move with it.
# A rename that swept both broke every one of them, and nothing raised: a missing output
# directory is created on demand, so the build simply wrote somewhere new and the review app
# read the old place.
output:
  base: "output"

  # Graph builds from pipeline/atlas/build.py (--out): per-region (adams, kootenay, …) + full/.
  # Single source of truth for the build location — consumers read project_config.builds_dir.
  builds: "output/v2"

  # Which build under `builds` the review app SERVES, and the one its rebuild button WRITES.
  # These were two independent hard-codings of "output/v2/full" in reuse.py and rebuild.py: the app
  # could rebuild one directory and read another, and neither would say so. One name, read by both.
  review_build: "full"

  # Added-streams review artifacts (pipeline/hack/added_streams): mapcheck / verify_map html,
  # the demo gpkg, and OSM candidates. project_config.added_streams_dir.
  added_streams: "output/added_streams"

  # Pipeline Outputs
  pipeline:
    base: "output/pipeline"

    # Graph Builder Outputs
    graph:
      base: "output/pipeline/graph"
      graph: "output/pipeline/graph/fwa_bc_primal_full.gpickle"
      metadata: "output/pipeline/graph/fwa_metadata.pickle"
      temp: "output/pipeline/graph/temp"
    atlas: "output/pipeline/atlas/atlas.pkl"
    pmtiles: "output/pipeline/deploy/freshwater_atlas.pmtiles"
    match_table: "output/pipeline/matching/match_table.json"
    in_season: "output/pipeline/matching/in_season_changes.json"
    stocking: "output/pipeline/matching/stocking.json"
    # anglerinfo.db is the fetch+match artifact (built at data-fetch time);
    # anglerinfo_matches.json is derived from it by export.py during the build
    # and read by pipeline/enrichment/anglerinfo_accessor.py. Both are
    # regenerable build artifacts — not committed (output/ is gitignored).
    anglerinfo: "output/pipeline/anglerinfo/anglerinfo.db"
    anglerinfo_matches: "output/pipeline/anglerinfo/anglerinfo_matches.json"
    # Hydro (recurring gauge/hydrometric data — pipeline/recurring/hydro).
    # hydro_db is the heavy working DB (~1.3 GB, gitignored, local dev only) used
    # by match_fwa at build time to emit gauge_matches.json. The cron itself keeps
    # NO persisted DB — it uses an ephemeral /tmp scratch and stores state in the
    # JSON artifacts. Exported R2 artifacts land under the unified cron subtree in
    # deploy/ (output.pipeline.cron below).
    hydro: "output/pipeline/hydro/hydro.db"
    extraction: "output/pipeline/extraction"
    parsing: "output/pipeline/parsing"
    deploy: "output/pipeline/deploy"
    # Unified subtree for all recurring/cron artifacts (in-season, stocking, hydro).
    # This is the R2 upload layout going forward: deploy/cron/{in-season,stocking,hydro}/.
    cron: "output/pipeline/deploy/cron"
    shard_version: 2

# ============================================================================
# Input Data Directories
# ============================================================================
data:
  base: "data/source"

  # Data Fetch Settings (for downloading BC GIS data). Everything fetch_data.py writes lands
  # under data/source/ — a fetcher that wrote somewhere a reader does not look is how a
  # freshness gate goes quiet about a roster nobody is reading.
  fetch:
    output_gpkg: "data/source/bc_fisheries_data.gpkg"
    temp_dir: "data/source/temp_bc_data"


# Unified Data Accessor
data_accessor:
  gpkg_path: "data/source/bc_fisheries_data.gpkg"

# ============================================================================
# LLM Parsing Settings
# ============================================================================
llm:
  batch_size: 30
  max_retries: 3
  model: "gemini-2.5-flash"

  api_keys:
    # API keys are loaded from environment variables
    - id: "horvath.dawson"
      env_var: "GOOGLE_API_KEY"
    - id: "darcy.turin"
      env_var: "GOOGLE_API_KEY_2"
    - id: "key_3"
      env_var: "GOOGLE_API_KEY_3"
    - id: "key_4"
      env_var: "GOOGLE_API_KEY_4"
    - id: "key_5"
      env_var: "GOOGLE_API_KEY_5"

# ============================================================================
# Graph Builder Settings
# ============================================================================
graph_builder:
  enable_caching: true

# ============================================================================
# Data — three kinds, and the difference is what it costs to lose
# ============================================================================
#
#   source/     fetched from an authority. Re-downloadable; costs bandwidth.
#   generated/  computed from source + curated. Re-runnable; costs CPU.
#   curated/    human-owned. NOTHING here is regenerable — losing a file loses hours.
#
# The third splits again, and the split is invisible without this comment:
#
#   authored    a person typed it (splits, name_variants, added_lakes)
#   promoted    a machine produced it and a person APPROVED it (gauge matches,
#               added_streams). It LOOKS generated, which is the whole danger — someone
#               re-runs the generator to check something and destroys the review.
#
# Reach every one of these through `pipeline.common.curated` — never as a literal, never as
# `parents[N] / "..."`. A curated path is NEVER overridable by an environment variable:
# that is the `review_build` failure again, where the app rebuilt one directory and read
# another and neither said so.
data_tree:
  source: "data/source"
  generated: "data/generated"

curated:
  base: "data/curated"

  # --- the shape of the atlas itself ---------------------------------------------
  waters:
    splits: "data/curated/waters/splits.json"                      # authored
    name_variants: "data/curated/waters/name_variants.json"        # authored
    areas: "data/curated/waters/areas.json"                        # authored
    added_lakes: "data/curated/waters/added_lakes.geojson"         # authored — hand-drawn polygons
    # PROMOTED, not authored. 361 minted streams whose negative blk ids are a live ABI;
    # re-running build_dataset.py remints them and strands every split bound to the old.
    added_streams: "data/curated/waters/added_streams.json"
    # The worklist for minting MORE added lakes. Zero code references BY DESIGN — the
    # minting is a hand process. Do not delete it in a dead-file sweep.
    ungazetted: "data/curated/waters/ungazetted.json"

  # --- regulations ---------------------------------------------------------------
  regulations:
    overrides: "data/curated/regulations/overrides.json"
    entries:
      synopsis: "data/curated/regulations/entries/synopsis"
      dfo_salmon: "data/curated/regulations/entries/dfo_salmon"

  # --- matches: machine-produced, human-reviewed ---------------------------------
  #
  # One shape for three domains: an external id -> FWA keys + trust. `review` is an INPUT
  # to matching and is never written by a program; `matches` is regenerated wholesale.
  # Keeping them in separate files is what makes a regenerate physically unable to harm
  # the review.
  gauges:
    matches: "data/curated/gauges/matches.json"
    review: "data/curated/gauges/review.json"
    waterbody_type: "data/curated/gauges/waterbody_type.json"
  stocking:
    matches: null       # not built — needs the FIDQ fetch
    review: null
  bathymetry:
    matches: null       # not built — needs the sheet matcher
    review: null
