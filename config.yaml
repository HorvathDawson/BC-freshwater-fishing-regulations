# Where the data lives: paths only.
# What each file is, its kind and who owns it: pipeline/common/curated.py (the `#:` field notes).
# The roots are relative to the repo; every other path is relative to the root of its block (curated: roots.curated).

roots:
  source: "data/source"
  curated: "data/curated"
  generated: "data/generated"
  release: "data/release"
  cache: "cache"

source:
  fwa_gpkg: "bc_fisheries_data.gpkg"
  coast_gpkg: "fwa_coast.gpkg"
  synopsis_pdf: "fishing_synopsis.pdf"
  fetch_temp: "temp_bc_data"

