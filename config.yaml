# BC Freshwater Fishing Regulations - Central Configuration

# ============================================================================
# Output Directory Structure
# ============================================================================
output:
  base: "output"

  # Graph builds from pipeline/build.py (--out): per-region (adams, kootenay, …) + full/.
  # Single source of truth for the build location — consumers read project_config.builds_dir.
  builds: "output/v2"

  # Which build under `builds` the review app SERVES, and the one its rebuild button WRITES.
  # These were two independent hard-codings of "output/v2/full" in reuse.py and rebuild.py: the app
  # could rebuild one directory and read another, and neither would say so. One name, read by both.
  review_build: "full"

  # Added-streams review artifacts (pipeline/hack/added_streams): mapcheck / verify_map html,
  # the demo gpkg, and OSM candidates. project_config.added_streams_dir.
  added_streams: "output/added_streams"

  # Pipeline Outputs
  pipeline:
    base: "output/pipeline"

    # Graph Builder Outputs
    graph:
      base: "output/pipeline/graph"
      graph: "output/pipeline/graph/fwa_bc_primal_full.gpickle"
      metadata: "output/pipeline/graph/fwa_metadata.pickle"
      temp: "output/pipeline/graph/temp"
    atlas: "output/pipeline/atlas/atlas.pkl"
    pmtiles: "output/pipeline/deploy/freshwater_atlas.pmtiles"
    match_table: "output/pipeline/matching/match_table.json"
    in_season: "output/pipeline/matching/in_season_changes.json"
    stocking: "output/pipeline/matching/stocking.json"
    # anglerinfo.db is the fetch+match artifact (built at data-fetch time);
    # anglerinfo_matches.json is derived from it by export.py during the build
    # and read by pipeline/enrichment/anglerinfo_accessor.py. Both are
    # regenerable build artifacts — not committed (output/ is gitignored).
    anglerinfo: "output/pipeline/anglerinfo/anglerinfo.db"
    anglerinfo_matches: "output/pipeline/anglerinfo/anglerinfo_matches.json"
    # Hydro (recurring gauge/hydrometric data — pipeline/recurring/hydro).
    # hydro_db is the heavy working DB (~1.3 GB, gitignored, local dev only) used
    # by match_fwa at build time to emit gauge_matches.json. The cron itself keeps
    # NO persisted DB — it uses an ephemeral /tmp scratch and stores state in the
    # JSON artifacts. Exported R2 artifacts land under the unified cron subtree in
    # deploy/ (output.pipeline.cron below).
    hydro: "output/pipeline/hydro/hydro.db"
    extraction: "output/pipeline/extraction"
    parsing: "output/pipeline/parsing"
    deploy: "output/pipeline/deploy"
    # Unified subtree for all recurring/cron artifacts (in-season, stocking, hydro).
    # This is the R2 upload layout going forward: deploy/cron/{in-season,stocking,hydro}/.
    cron: "output/pipeline/deploy/cron"
    shard_version: 2

# ============================================================================
# Input Data Directories
# ============================================================================
data:
  base: "data"

  # Data Fetch Settings (for downloading BC GIS data)
  fetch:
    output_gpkg: "data/bc_fisheries_data.gpkg"
    temp_dir: "data/temp_bc_data"


# Unified Data Accessor
data_accessor:
  gpkg_path: "data/bc_fisheries_data.gpkg"

# ============================================================================
# LLM Parsing Settings
# ============================================================================
llm:
  batch_size: 30
  max_retries: 3
  model: "gemini-2.5-flash"

  api_keys:
    # API keys are loaded from environment variables
    - id: "horvath.dawson"
      env_var: "GOOGLE_API_KEY"
    - id: "darcy.turin"
      env_var: "GOOGLE_API_KEY_2"
    - id: "key_3"
      env_var: "GOOGLE_API_KEY_3"
    - id: "key_4"
      env_var: "GOOGLE_API_KEY_4"
    - id: "key_5"
      env_var: "GOOGLE_API_KEY_5"

# ============================================================================
# Graph Builder Settings
# ============================================================================
graph_builder:
  enable_caching: true

# ============================================================================
# Curated data — everything a human's time is embedded in
# ============================================================================
#
# NOTHING UNDER HERE IS REGENERABLE BY A REBUILD. Losing a file here loses curation that
# cost human hours; losing anything under output/ costs CPU. That is the whole distinction,
# and it is why these have their own tree rather than sitting next to the code that reads
# them.
#
# READ THROUGH `pipeline.curated`, never as a literal. Every path below is validated the
# moment the process starts — a typo fails at import with the key that is wrong, instead of
# at runtime with an empty list. This repo has paid for the alternative: a `--splits` flag
# with no default silently dropped all 376 curated cuts from three full builds and nothing
# looked wrong.
#
# ⚠️ These still point at the CURRENT locations. Step 1 of pipeline/docs/16 is to introduce
# the accessors WITHOUT moving anything, so the migration is reversible at every step; the
# `git mv` is the last commit, not the first.
curated:
  base: "pipeline"

  # --- authored by hand: a person typed every one of these -------------------------
  splits: "pipeline/splits.json"
  name_variants: "pipeline/name_variants.json"
  overrides: "pipeline/matching/overrides.json"
  areas: "pipeline/areas.json"
  added_lakes: "pipeline/added_lakes.geojson"
  added_streams: "pipeline/added_streams.build.json"

  entries:
    synopsis: "pipeline/parsing/entries"
    dfo_salmon: "pipeline/dfo_salmon/entries"

  # --- machine-produced, HUMAN-REVIEWED --------------------------------------------
  #
  # The third category, and the one doc 16 was missing. A slow pass produced these, a person
  # checked them, and everything downstream only reads them. Not curated (nobody typed it);
  # not generated (a rebuild must NEVER recreate it — that discards the review).
  #
  # Regenerate deliberately, review the diff, commit. `pipeline.tools.check_curated --ci`
  # fails the build when a roster has moved past one of these.
  # The hand review of gauge matches. An INPUT to matching, not output — `gauge_match.json`
  # is rewritten wholesale every run, so a decision recorded there would not survive.
  gauge_review: "pipeline/gauge_review.json"

  matches:
    gauge: "pipeline/gauge_match.json"
    waterbody_type: "data/bc_station_waterbody_type.json"
    stocking: null        # not built — needs the FIDQ fetch
    charts: null          # not built — needs the bathymetry fetch
