# BC Freshwater Fishing Regulations - Central Configuration

# ============================================================================
# Generated — everything a program writes
# ============================================================================
# There is no `output/` any more. It was a fourth tree beside source/generated/curated that
# meant the same thing as `generated` and drifted from reality: six of its declared
# directories (pipeline/graph, atlas, matching, anglerinfo, hydro, deploy) never existed on
# disk, and `default_registry_path()` handed seven parser tools a registry.json inside one
# of them. Nothing raised, because a missing output directory is created on demand.
#
# So: ONE generated tree, addressed through `pipeline.common.curated.GENERATED`, never as a
# literal and never as `parents[N] / "..."`. Readers of a build must use `require_build()`,
# which refuses a directory that is not there and names the command that makes it — a
# writer may create its own directory, a reader may not.
generated:
  base: "data/generated"

  atlas:
    # Graph builds from pipeline/atlas/build.py (--out): one subdirectory per region
    # (adams, kootenay, …) plus full/. Holds graph.pkl, registry.json,
    # geometries, item_points.json, splits.resolved.json.
    builds: "data/generated/atlas"
    # Which build under `builds` the review app SERVES, and the one its rebuild button
    # WRITES. These were two independent hard-codings: the app could rebuild one directory
    # and read another, and neither would say so. One name, read by both.
    default_build: "full"

  # Reach binding (pipeline/atlas/reach): rule -> sections, per build.
  reaches: "data/generated/reaches"

  # Deliverables.
  bundle: "data/generated/bundle"
  tiles: "data/generated/tiles"

  # Added-streams review artifacts (pipeline/atlas/waters/added_streams): mapcheck /
  # verify_map html, the demo gpkg, and OSM candidates.
  added_streams: "data/generated/added_streams"

  # Ad-hoc candidate dumps from one-off audits. Nothing downstream reads these; they are
  # eyeballed once and thrown away. Kept out of the domain folders on purpose.
  scratch: "data/generated/scratch"

  regs:
    extraction: "data/generated/regs/extraction"       # synopsis_raw_data.json, row_images/
    parse: "data/generated/regs/parse"                 # LLM work dir: batches/responses/reviews
    dfo_salmon: "data/generated/regs/dfo_salmon"       # scrape: locations/, rules/, untangled/
    entries_backup: "data/generated/regs/entries_backup"

  gauges:
    feeds: "data/generated/gauges/feeds"               # per-station published JSON
    match: "data/generated/gauges/match.json"          # the matcher's raw output; `promote` reads it (T94)
    # T324: the REVIEW QUEUE `promote` writes beside the curated matches.json (matches it did not promote, with their
    # evidence); committed (data/.gitignore) so `check_curated --ci` sees the queue in CI
    candidates: "data/generated/gauges/candidates.json"

  # Run timing: the CU polygons `pipeline.runtiming.parse` stitches from the cached Explorer
  # tiles (cu_polygons.geojson, read by `pipeline.deliver runs`). Re-runnable from data/source/runtiming/.
  runtiming: "data/generated/runtiming"

  # T226: the in-season matches compiled for the app (`pipeline.regs.inseason.publish`); the local tile server serves
  # `feed/` as /feeds/inseason/ (R2 `feeds/inseason/` in production, beside the T225 worker's index.json).
  inseason: "data/generated/inseason"
  # T330: the curation review's MACHINE-WRITTEN inputs (tidal candidates / pre-verify / edits / web / OSM landmarks,
  # tidal pass 2, DFO suggestions / pre-verify / split hunt, entry split suggestions, T89 awaiting-water, the Q154
  # sample, the mined name candidates, the T185 proposals). Moved here from handoff/PLAN/curation-review/; committed
  # (data/.gitignore) because the review app reads them. Nothing human-made lives here.
  review: "data/generated/review"
  # T435: the slough finder's output (automark + candidates), read by the slough review (regs/review/slough.py)
  sloughs: "data/generated/sloughs"
  # THE SHIPPED SET (MINIMAL-PACKAGING §1; P08/P18), apart from every build artifact: data/release/<data_release>/,
  # data/release/tiles/<tile_version>/ (geometry-only atlas, the outside-BC mask, map assets), data/release/basemap/.
  release: "data/release"

# ============================================================================
# Input Data Directories
# ============================================================================
data:
  base: "data/source"

  # Data Fetch Settings (for downloading BC GIS data). Everything fetch_data.py writes lands
  # under data/source/ — a fetcher that wrote somewhere a reader does not look is how a
  # freshness gate goes quiet about a roster nobody is reading.
  fetch:
    output_gpkg: "data/source/bc_fisheries_data.gpkg"
    temp_dir: "data/source/temp_bc_data"


# Unified Data Accessor
data_accessor:
  gpkg_path: "data/source/bc_fisheries_data.gpkg"
  # T678: the FWA river polygons + land mass for the atlas's coast-crossing tidal cut (`fetch_data.py` fwa_rivers,
  # fwa_land). Its own file so the main gpkg's stamp (an input of every shipped atlas) never moves for it.
  coast_gpkg_path: "data/source/fwa_coast.gpkg"

# ============================================================================
# Data — three kinds, and the difference is what it costs to lose
# ============================================================================
#
#   source/     fetched from an authority. Re-downloadable; costs bandwidth.
#   generated/  computed from source + curated. Re-runnable; costs CPU.
#   curated/    human-owned. NOTHING here is regenerable — losing a file loses hours.
#
# The third splits again, and the split is invisible without this comment:
#
#   authored    a person typed it (splits, name_variants, added_lakes)
#   promoted    a machine produced it and a person APPROVED it (gauge matches,
#               added_streams). It LOOKS generated, which is the whole danger — someone
#               re-runs the generator to check something and destroys the review.
#
# Reach every one of these through `pipeline.common.curated` — never as a literal, never as
# `parents[N] / "..."`. A curated path is NEVER overridable by an environment variable:
# that is the `review_build` failure again, where the app rebuilt one directory and read
# another and neither said so. The one exception moves the WHOLE tree: `CURATED_ROOT=<a copy>`
# (tests, side apps; `pipeline.common.curated.make_root`, T422) — per-file overrides are refused.
data_tree:
  source: "data/source"
  generated: "data/generated"

curated:
  base: "data/curated"
  # T324 naming (owner 2026-11-05): `*_calls.json` = the owner's per-item decisions, `*_waters.json` = a list of
  # waters, `*_stations.json` = a list of gauges. Every folder has a README; every dict-shaped JSON an `_about`.

  # --- waters: the shape of the atlas itself, and lists of waters ------------------
  waters:
    # KEY NAMES `tidal` and `areas` are the pre-T324 names on purpose: the tiles stage keys on its code's bytes
    # (pipeline/atlas/splits, pipeline/deliver/tiles) and that code reads these two, so renaming the attributes would
    # rebuild and re-ship the tiles for nothing. Rename them the next time that code changes anyway.
    cuts: "data/curated/waters/cuts.json"                          # authored — every curated cut on a water
    name_variants: "data/curated/waters/name_variants.json"        # authored
    found_names: "data/curated/waters/found_names.json"            # promoted (T224: names from city / OSM / ECCC sources, accepted; written by tools.mined_names)
    found_name_calls: "data/curated/waters/found_name_calls.json"  # authored (T327: the owner's calls on single found-name candidates; read by tools.mined_names)
    areas: "data/curated/waters/area_closures.json"                # authored — blanket area closures (cut every stream crossing the polygon)
    continuations: "data/curated/waters/continuations.json"        # authored (owner-reviewed / refused water_continue links)
    tidal: "data/curated/waters/tidal_limits.json"                 # T326: THE tidal limit of every ocean water (mouth | split | cut | whole); written by pipeline.tools.tidal_limits, read by the atlas only
    slough_calls: "data/curated/waters/slough_calls.json"          # applied (T322: owner-confirmed slough calls, from the slough marks)
    # the retired slough review page's verdicts + free-text notes (2026-10-28), read by `pipeline.regs.review.slough`
    slough_page_calls: "data/curated/waters/slough_page_calls.json"
    steelhead_waters: "data/curated/waters/steelhead_waters.json"  # authored — the known-steelhead list (accepted with pipeline.regs.steelhead.accept)
    # Hand-drawn ADMIN polygons: closure zones a regulation states as an area, not a reach.
    # An area_closures.json def names this file in `file` instead of naming a fetched gpkg `layer`.
    added_areas: "data/curated/waters/added_areas.geojson"         # authored — hand-drawn polygons
    added_lakes: "data/curated/waters/added_lakes.geojson"         # authored — hand-drawn polygons
    # PROMOTED, not authored. 361 minted streams whose negative blk ids are a live ABI;
    # re-running build_dataset.py remints them and strands every split bound to the old.
    added_streams: "data/curated/waters/added_streams.json"
    # The worklist for minting MORE added lakes. Zero code readers BY DESIGN (the minting is a hand process) beyond
    # the fast check (`check_curated --waters`). Do not delete it in a dead-file sweep.
    unmapped_waters: "data/curated/waters/unmapped_waters.json"
    # T632 (owner 2026-11-11): the unplaced reach pieces the owner accepted; any other one stops the reach run
    unplaced_piece_calls: "data/curated/waters/unplaced_piece_calls.json"

  # --- DFO salmon: the places DFO's rules bind to, and the limits wording (T321) ----
  dfo_salmon:
    # the curated DFO locations per region (item ids, extents); synced to the feeds worker
    # (private/feeds/dfo/entries/, `pipeline.deliver.sync_inputs`)
    places: "data/curated/dfo_salmon/places"
    # AUTHORED (templates reviewed by hand): `pipeline.regs.dfo_salmon.wording`; synced to the feeds worker
    # (private/feeds/dfo/wording.json, `pipeline.deliver.sync_inputs`) — the worker's ONLY copy
    wording: "data/curated/dfo_salmon/wording.json"
    # AUTHORED (T632, owner 2026-11-11): the DFO places that keep their tidal water, each with a stated reason
    tidal_calls: "data/curated/dfo_salmon/tidal_calls.json"
    # AUTHORED (T679 #2): the places DFO's page defaults and cascade scopes bind (was code in
    # `pipeline.regs.dfo_salmon.entries`); read there and by the atlas promote guards (`curated_boundary_ids`)
    scope_places: "data/curated/dfo_salmon/scope_places.json"

  # --- regulations: the synopsis corpus and the book ---------------------------------
  regulations:
    synopsis: "data/curated/regulations/synopsis"     # the parsed synopsis rows, one file per region
    book_name_links: "data/curated/regulations/book_name_links.json"   # authored — a book water name -> the FWA water(s)
    reference: "data/curated/regulations/reference"   # the book's text, verbatim (definitions, legend, licensing)

  # --- review: the review app's state ----------------------------------------------
  review:
    marks: "data/curated/review/marks.jsonl"   # reviewed — the reviewers' marks, append-only (T97)
    proposal_overrides: "data/curated/review/proposal_overrides.json"  # owner calls on proposed splits (confidence), beside the never-edited marks (T185); folded by T326
    # T325: the review domains that are CLOSED (locked) — the apply and the review app skip them; marks.jsonl is
    # never edited. Reopen = remove the entry.
    closed: "data/curated/review/closed.json"

  # --- run timing: authored gaps and labels --------------------------------------
  #
  # AUTHORED, and short by design. 100 of 463 CU names state their own run, so the labels
  # that separate a summer run from a winter one are mostly derived. What cannot be derived
  # is a water an angler will look up and find nothing for — see `coverage_gaps`.
  runtiming:
    run_calls: "data/curated/runtiming/run_calls.json"
    # (T331) the PARSED timings (`python -m pipeline.runtiming.parse`) are source data now:
    # data/source/runtiming/timing.json, tracked because the fetched pages are not.

  # --- in-season changes bound to waters (T226) -------------------------------------
  # AUTHORED: feed row id -> extent; written by the review app's In-season tab (its one non-mark write) or by hand.
  inseason:
    notice_waters: "data/curated/inseason/notice_waters.json"

  # --- matches: machine-produced, human-reviewed ---------------------------------
  #
  # One shape for three domains: an external id -> FWA keys + trust. `match_calls` is an INPUT
  # to matching and is never written by a program; `matches` is regenerated wholesale.
  # Keeping them in separate files is what makes a regenerate physically unable to harm
  # the review. (T324: the gauge review QUEUE, candidates.json, is machine output —
  # `generated.gauges.candidates`.)
  gauges:
    matches: "data/curated/gauges/matches.json"
    match_calls: "data/curated/gauges/match_calls.json"
    # (T331) ECCC's water-body type per station is SCRAPED source data: data/source/bc_station_waterbody_type.json
    tidal_stations: "data/curated/gauges/tidal_stations.json"         # authored: level gauges the tide moves (T78)
    backwater_stations: "data/curated/gauges/backwater_stations.json" # authored: level gauges a lake below backs up (T160)
  stocking:
    matches: null       # not built — needs the FIDQ fetch
    match_calls: null
  bathymetry:
    matches: null       # not built — needs the sheet matcher
    match_calls: null
