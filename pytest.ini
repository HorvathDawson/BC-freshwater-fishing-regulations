[pytest]
pythonpath = .
testpaths = pipeline/tests pipeline/atlas/waters/added_streams/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# A test that reads generated or fetched data carries a needs_* marker and FAILS when the data is
# missing (pipeline/tests/conftest.py `need`); the no-data tier deselects by marker. No silent skips.
markers =
    slow: marks tests as slow (deselected by default, run with -m slow)
    needs_bundle: reads data/generated/bundle (bundle, verdicts, status index) or the regs export/answers
    needs_atlas: reads data/generated/atlas (graph, registry, section handles)
    needs_reach_run: reads a reach run under data/generated/reaches
    needs_tiles: reads data/generated/tiles
    needs_source: reads fetched source data not in git (the FWA gpkg, synopsis rows)
    needs_cache: reads cache/ (the DFO history)
addopts = -m "not slow" --strict-markers
