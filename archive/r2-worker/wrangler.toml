name = "bc-fishing-r2"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bc-fishing-regulations"

# Worker-side source of truth for shard version.
# Keep in sync with config.yaml → output.pipeline.shard_version
[vars]
SHARD_VERSION = "v2"

[observability]
[observability.logs]
enabled = false
invocation_logs = true

# ── Staging ──────────────────────────────────────────────────────────
# Deploy via Cloudflare git integration: branch=staging, --env staging

[env.staging]
name = "bc-fishing-r2-staging"
workers_dev = true
preview_urls = false

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "bc-fishing-regulations-staging"

# Keep in sync with [vars].SHARD_VERSION above
[env.staging.vars]
SHARD_VERSION = "v2"

[[env.staging.routes]]
pattern = "data-staging.canifishthis.ca"
custom_domain = true

# ── Production ───────────────────────────────────────────────────────
# Deploy via Cloudflare git integration: branch=main, --env production
# Mirrors staging exactly — same config, different bucket.

[env.production]
name = "bc-fishing-r2"
workers_dev = false
preview_urls = false

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "bc-fishing-regulations"

# Keep in sync with [vars].SHARD_VERSION above
[env.production.vars]
SHARD_VERSION = "v2"
# Sender address on the onboarded domain (public — safe to commit).
FEEDBACK_FROM = "feedback@canifishthis.ca"
# NOTE: FEEDBACK_TO (your private inbox) is intentionally NOT stored here.
# It lives as a Cloudflare secret so it never appears in git:
#   npx wrangler secret put FEEDBACK_TO --env production
# (enter your inbox address when prompted).

[[env.production.routes]]
pattern = "data.canifishthis.ca"
custom_domain = true

# Sends feedback emails.  No destination restriction → the binding may send to
# any verified destination in the account; the actual recipient is supplied at
# runtime from the FEEDBACK_TO secret, so your personal address stays out of git.
[[env.production.send_email]]
name = "SEND_EMAIL"

# ── Feedback email ──────────────────────────────────────────
# POST /api/feedback ALWAYS stores reports in R2 (under feedback/…).  It ALSO
# emails them when the Cloudflare Email send binding + FEEDBACK_FROM/FEEDBACK_TO
# are configured, and sends the submitter a confirmation when they leave an
# email.  Two different delivery paths, two different requirements:
#
#   1. Maintainer notification → FEEDBACK_TO (your inbox).
#      • The RECIPIENT must be a VERIFIED destination address in your account.
#        Works with Email Routing alone (free).  Keep it private as a secret:
#            npx wrangler secret put FEEDBACK_TO --env production
#
#   2. Submitter confirmation → the address the reporter typed (arbitrary).
#      • Sending to arbitrary recipients requires Email Sending (Beta) to be
#        onboarded on the domain (Compute → Email Service → Email Sending;
#        Workers Paid plan).  With only Email Routing this send is rejected —
#        it's best-effort, so the report is still stored + you're still notified.
#
#   • FEEDBACK_FROM is any address on the onboarded domain (public, set above).
#     It's the From for both emails; the confirmation is worded as no-reply.
#
# Prefer routing the maintainer copy through the domain instead of your raw
# inbox?  Add feedback@canifishthis.ca as a Destination Address and verify it
# (the link is forwarded to your inbox by your existing catch-all), then set the
# FEEDBACK_TO secret to feedback@canifishthis.ca.
#
# To also send from the staging worker, mirror FEEDBACK_FROM under
# [env.staging.vars], set the FEEDBACK_TO secret with --env staging, and add a
# matching [[env.staging.send_email]] block.
