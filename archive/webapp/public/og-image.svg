<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3a8f"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint contour / river lines (map motif) -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" fill="none">
    <path d="M-40 120 C 220 60, 380 210, 640 150 S 1060 60, 1260 170"/>
    <path d="M-40 250 C 240 190, 420 330, 700 270 S 1080 200, 1260 300"/>
    <path d="M-40 400 C 260 340, 440 470, 720 410 S 1100 350, 1260 440"/>
    <path d="M-40 540 C 260 500, 460 600, 740 540 S 1100 500, 1260 580"/>
  </g>

  <!-- stylized water body with a location pin -->
  <g filter="url(#soft)">
    <path d="M840 250
             C 930 220, 1030 250, 1060 330
             C 1085 400, 1020 470, 930 480
             C 850 488, 770 470, 748 400
             C 728 336, 770 274, 840 250 Z"
          fill="url(#water)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <!-- pin -->
    <g transform="translate(902,300)">
      <path d="M0 0 C 40 0, 62 30, 62 62 C 62 108, 0 150, 0 150 C 0 150, -62 108, -62 62 C -62 30, -40 0, 0 0 Z" fill="#ffffff"/>
      <circle cx="0" cy="60" r="26" fill="#1d4ed8"/>
    </g>
  </g>

  <!-- small fish glyph near brand -->
  <g transform="translate(96,86)" fill="#ffffff" fill-opacity="0.95">
    <path d="M0 20 C 22 -2, 66 -2, 92 20 C 66 42, 22 42, 0 20 Z"/>
    <path d="M92 20 L 116 6 L 112 20 L 116 34 Z"/>
    <circle cx="26" cy="16" r="4.2" fill="#1d4ed8"/>
  </g>
  <text x="230" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.5">Can I Fish This?</text>

  <!-- headline -->
  <text x="96" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-1.5">BC Fishing</text>
  <text x="96" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Regulations Map</text>

  <!-- subhead -->
  <text x="98" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#dbeafe">Search any lake, river or stream — rules, closures,</text>
  <text x="98" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#dbeafe">limits, stocking &amp; live water levels.</text>

  <!-- url pill -->
  <g transform="translate(96,536)">
    <rect width="316" height="56" rx="28" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="30" y="37" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff">canifishthis.ca</text>
  </g>

  <!-- free badge -->
  <g transform="translate(980,536)">
    <rect width="124" height="56" rx="28" fill="#22c55e"/>
    <text x="62" y="37" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#06280f">FREE</text>
  </g>
</svg>
