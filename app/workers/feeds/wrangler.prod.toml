# T404 PRODUCTION feeds worker — THE OWNER deploys it (deploy/prod/feeds.sh, CONFIRM_PROD=bc-fishing-feeds); agents never.
# The twin of wrangler.toml (staging): the same code, bindings, crons and vars, with production's names. It deploys OVER the
# placeholder (deploy/prod/feeds-placeholder.sh), whose secrets stay: GITHUB_DISPATCH_TOKEN, RUN_TOKEN, REPORT_SALT,
# NOTIFY_EMAIL_TO. test/config.test.ts holds this file to wrangler.toml (same crons, bindings, vars; only names differ).
name = "bc-fishing-feeds"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# the app's report + crash endpoint is https://feeds.canifishthis.ca/report (apps/mobile/src/env.ts
# REPORT_URLS.production; owner 2026-11-08, Q171: the custom domain, workers.dev OFF). The deploy attaches the domain
# (canifishthis.ca is a zone on this account) and fails out loud if it cannot.
workers_dev = false
routes = [{ pattern = "feeds.canifishthis.ca", custom_domain = true }]
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bc-fishing-regulations"

# (T237) 1 report per 10 s per IP. Namespace ids are account-wide counters: production's are its own (staging 2370/2491/2492).
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "3370"
simple = { limit = 1, period = 10 }

# (T246) the backup bucket — the OWNER creates it with the same lifecycle rules as staging's (daily/ 30 d, monthly/ 400 d,
# curated/ 365 d, restore-test/ 1 d): owner question Q172 (default name bc-fishing-regulations-backup).
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "bc-fishing-regulations-backup"

[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "3491"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "3492"
simple = { limit = 10, period = 60 }

[[send_email]]
name = "EMAIL"

[vars]
NOTIFY_EMAIL_FROM = "status@canifishthis.ca"
NOTIFY_DIGEST = "daily"
FEEDS_ENV = "production"         # the [production] subject tag + footer; test reports/crashes are refused (src/reports.ts)
STATUS_URL = "https://feeds.canifishthis.ca/status"
WORKER_NAME = "bc-fishing-feeds"
BUCKET_NAME = "bc-fishing-regulations"
BACKUP_BUCKET_NAME = "bc-fishing-regulations-backup"
# (T487) the site whose gauge pages the share cards are drawn for (src/gauges/card/card.ts reads <SITE_ORIGIN>/gauge/stations.json)
SITE_ORIGIN = "https://canifishthis.ca"

# The same schedule as staging (wrangler.toml explains each minute).
[triggers]
crons = [
  "35 0 * * *",
  "5,35 1-5,13-23 * * *",
  "5 6-12 * * *",
  "15 */6 * 6-10 *",
  "15 14 * 1-5,11-12 *",
  "45 */6 * 6-10 *",
  "45 14 * 1-5,11-12 *",
  "25 9 * * *",
  "55 10 1 * *",
  "40 10 * * 1",
]
