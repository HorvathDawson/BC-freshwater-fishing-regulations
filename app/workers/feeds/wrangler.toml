# T225 STAGING ONLY, MEASURING ONLY. Deploy: npx --prefix app wrangler deploy -c app/workers/feeds/wrangler.toml
# No [triggers] on purpose: nothing runs unattended until the owner switches it on. No production env in this file.
name = "bc-fishing-feeds-staging"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bc-fishing-regulations-staging"

# T225 follow-up: owner notifications by email (src/events.ts). Cloudflare Email Workers: the destination is a VERIFIED
# Email Routing address (horvath.dawson@gmail.com: verified), the sender an address on an Email Routing domain
# (canifishthis.ca: routing enabled, status ready — checked 2026-10-28). NOTIFY_EMAIL_TO is a secret (set by wrangler
# secret put); the rest are plain vars. FEED_NOTIFY_URL (webhook fallback) is unset.
[[send_email]]
name = "EMAIL"

[vars]
NOTIFY_EMAIL_FROM = "status@canifishthis.ca"
NOTIFY_DIGEST = "daily"          # DFO + in-season are urgent (at once); the rest one digest a day, only on a day with an issue
REVIEW_APP_URL = "http://localhost:5183"
