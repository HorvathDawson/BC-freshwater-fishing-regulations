# On a spot being made or edited: "Add from photos" → the system photo picker → the newest photo.
appId: ca.canifishthis.app
---
- scrollUntilVisible:
    element: { text: "Add from photos" }
    timeout: 15000
- tapOn: { text: "Add from photos" }
- extendedWaitUntil:
    visible: { text: "Recent" }
    timeout: 10000
# the picker's Google Photos card, when it shows, pushes the grid down: dismissed first
- tapOn: { text: "Dismiss", optional: true }
- waitForAnimationToEnd: { timeout: 3000 }
# the newest photo: the first tile under "Recent" (tiles carry no text; "Photos" is the picker's tab)
- tapOn:
    below: { text: "Recent" }
    index: 0
- waitForAnimationToEnd: { timeout: 5000 }
- tapOn: { text: "(Done|Add|Select)", optional: true }
