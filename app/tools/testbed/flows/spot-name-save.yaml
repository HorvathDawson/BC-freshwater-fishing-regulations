# On a new spot's last step: its name (the field starts with the water's name: cleared first), then "Save spot".
appId: ca.canifishthis.app
---
- scrollUntilVisible:
    element: { text: "(Name this spot|Add a title)" }
    direction: UP
    timeout: 15000
- tapOn: { text: "(Name this spot|Add a title)", index: 0 }
- eraseText: 60
- inputText: "${TITLE}"
- hideKeyboard
- scrollUntilVisible:
    element: { text: "Save spot" }
    timeout: 15000
- tapOn: { text: "Save spot" }
