# Map → long-press the © credits chip → Developer card → Updates log (development / staging builds only; T476 moved it
# out of More → About).
appId: ca.canifishthis.app
---
- tapOn: { text: "MAP|Map", index: 0 }
- extendedWaitUntil:
    visible: { id: "map-credits-chip" }
    timeout: 15000
- longPressOn: { id: "map-credits-chip" }
- extendedWaitUntil:
    visible: { id: "developer-card" }
    timeout: 15000
- tapOn: { id: "developer-tab-updates" }
- extendedWaitUntil:
    visible: { id: "updates-log-status" }
    timeout: 15000
