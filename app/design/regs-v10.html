<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regs v10</title>
<!-- v10. Every fact on this page is page v36's own words. regs-v10/v36snap.js is a script-made snapshot of the
     regenerated page (its HTML fragments, row groups, sheets, glossary). Fish pictures come from the app's
     manifest (regs-v10/fish.js). Data still missing (answers 2.6) is shown as a visible "pending data" placeholder.
     Hash: #w=vedder&d=1010&p=0&sec=keep|gear&sheet=…&map=1&age=u16&theme=dark&ts=2&scroll=… -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* app tokens (app/packages/map/style/themes) */
:root{--page:#EFEFEC;--card:#FFFFFF;--wash:#F7F7F5;--tint:#EEEFEB;--line:#E5E6E1;--line2:#D3D5CF;--ink:#15181C;--sub:#5F666C;--faint:#6E757B;
  --open:#1D7741;--restricted:#8f5c00;--closed:#940018;--accent:#5F26E0;--on-accent:#FFFFFF;--water:#4A90E2;--lake:#64B5F6;--land:#F8F8F2;
  --shadow:rgba(21,24,28,.9);--scrim:rgba(21,24,28,.28);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0A0B0D;--card:#15181B;--wash:#101215;--tint:#1E2227;--line:#252A2F;--line2:#343B42;--ink:#F0F2F0;--sub:#A3ABB2;--faint:#8A939A;
  --open:#48b07a;--restricted:#e8a733;--closed:#FC4164;--accent:#A97CFF;--on-accent:#100A22;--water:#38B6DE;--lake:#205579;--land:#0A0B0D;--shadow:rgba(0,0,0,.85);--scrim:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--page:#0A0B0D;--card:#15181B;--wash:#101215;--tint:#1E2227;--line:#252A2F;--line2:#343B42;--ink:#F0F2F0;--sub:#A3ABB2;--faint:#8A939A;
  --open:#48b07a;--restricted:#e8a733;--closed:#FC4164;--accent:#A97CFF;--on-accent:#100A22;--water:#38B6DE;--lake:#205579;--land:#0A0B0D;--shadow:rgba(0,0,0,.85);--scrim:rgba(0,0,0,.4);color-scheme:dark}
/* FOUR type sizes only: --t1 26 (answer, numerals) · --t2 17 (section heads, lead) · --t3 15 (body) · --t4 12.5 (meta, labels) */
html{font-size:16px} html.ts2{font-size:32px}
:root{--t1:1.625rem;--t2:1.0625rem;--t3:.9375rem;--t4:.78rem}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:var(--t3)/1.42 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;border-radius:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab{font:700 var(--t4)/1.3 Archivo,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.wrap{max-width:1180px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:392px minmax(0,1fr);gap:72px;align-items:start}
.app{position:relative;width:392px;height:846px;border:1.5px solid var(--ink);background:var(--card);overflow:hidden;position:sticky;top:32px;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--shadow)}
@media (max-width:520px){.wrap{display:block;padding:0}.app{width:100vw;height:100svh;border:0;box-shadow:none;position:relative}.poster{display:none}}
.shot .wrap{display:block;padding:0}.shot .app{width:390px!important;height:844px!important;border:0;box-shadow:none;position:relative;top:0}.shot .poster{display:none}
.tall .app{height:auto!important;overflow:visible}.tall .body{overflow:visible}.tall #reg{position:relative}.tall .scroller{position:relative;overflow:visible}.tall .hdr{position:relative}
.sb{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font:700 15px Archivo,sans-serif;background:var(--card)}
.sb i{font-style:normal;font-size:11px;letter-spacing:.1em}
.body{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* water tabs (TabBar.tsx look) */
.tabs{flex:0 0 auto;display:flex;border-top:1.5px solid var(--ink);background:var(--card);padding:8px 0 12px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--sub);min-height:48px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor}
.tabs em{font:normal 700 9.5px/12px Archivo,sans-serif;letter-spacing:1.1px;text-transform:uppercase}
.tabs u{display:block;width:22px;height:2.5px}
.tabs button[aria-selected="true"]{color:var(--ink)}.tabs button[aria-selected="true"] u{background:var(--ink)}
/* regulations surface */
#reg{position:absolute;inset:0}
.scroller{position:absolute;inset:0;overflow:auto;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.hdr{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1.5px solid var(--ink)}
.r1{display:flex;align-items:center;gap:8px;padding:2px 12px 2px 4px;min-height:52px}
.back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font:700 22px Archivo,sans-serif;color:var(--accent)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font:800 var(--t2)/1.2 "Bricolage Grotesque",Archivo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:var(--t4);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border:1px solid var(--line2);background:var(--card);font:600 var(--t4) Archivo,sans-serif;white-space:nowrap}
.pill .dot{width:8px;height:8px}
.pill em{display:block;font:normal 700 9px/1.2 Archivo,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent)}
.r2{display:flex;gap:8px;padding:0 12px 8px;align-items:stretch}
.segm{flex:1;display:flex;border:1.5px solid var(--ink)}
.segm button{flex:1;min-height:44px;font:700 var(--t4) Archivo,sans-serif;text-align:center;color:var(--sub);padding:0 4px}
.segm button+button{border-left:1.5px solid var(--ink)}
.segm button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.mapbtn{min-height:44px;min-width:44px;padding:0 10px;border:1.5px solid var(--ink);font:700 var(--t4) Archivo,sans-serif;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.parts{display:flex;gap:0;margin:0 12px 8px;border:1.5px solid var(--ink)}
.parts button{flex:1 1 0;min-width:0;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font:700 var(--t4) Archivo,sans-serif;border-left:1.5px solid var(--ink);position:relative;padding:4px 6px 2px}
.parts button:first-child{border-left:0}
.parts button i{position:absolute;left:0;right:0;top:0;height:4px}
.parts button span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.parts button[aria-current="true"]{flex:5 1 0;background:var(--ink);color:var(--card)}
.hdr.mini .parts,.hdr.mini .r2 .mapbtn span{display:none}
/* section titles: one header style for every section */
.sec{padding:18px 16px 4px}
.sec + .sec{border-top:1.5px solid var(--ink)}
.sech{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.sech h2{margin:0;font:800 var(--t2) "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.2px}
.sech .lab{margin-left:auto}
/* v36 fragments, restyled: verdict + strip */
.wstrip{padding:10px 16px 2px}
.wsline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wsstat{font:800 var(--t1)/1 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.5px}
.wsstat.open::before{content:"✓ "}.wsstat.closed::before{content:"✕ "}
.wsstat.open{color:var(--open)}.wsstat.closed{color:var(--closed)}
.wsoon{margin-left:auto;align-self:center;border:1.5px solid currentColor;padding:2px 8px;font:700 var(--t4) Archivo,sans-serif}
.wsoon.open{color:var(--open)}.wsoon.closed{color:var(--closed)}
.muted{color:var(--sub)}.small{font-size:var(--t4)}
.sbar{position:relative;display:flex;height:10px;gap:2px;margin-top:10px}
.sbar i{display:block;height:100%}
.s-keep{background:var(--open)}.s-closed{background:repeating-linear-gradient(135deg,var(--closed) 0 3px,color-mix(in srgb,var(--closed) 30%,var(--card)) 3px 6px)}
.s-release{background:repeating-linear-gradient(90deg,var(--restricted) 0 2px,transparent 2px 5px)}
.sbar .today{position:absolute;top:-4px;width:4px;height:18px;background:var(--card);box-shadow:0 0 0 1.5px var(--ink)}
.sbar .today em{display:none}
.smonths{display:flex;justify-content:space-between;margin-top:5px;font:500 .625rem/1 "JetBrains Mono",monospace;color:var(--faint)}
.slegend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:var(--t4);color:var(--sub)}
.slegend span{display:inline-flex;align-items:center;gap:5px}.slegend i{width:12px;height:10px;display:inline-block}
.slegend span:has(.s-keep)::before{content:"✓"}.slegend span:has(.s-closed)::before{content:"✕"}
.pend{border:1px dashed var(--faint);padding:0 5px;color:var(--sub)}
.pending{margin-top:6px;padding:4px 8px;border:1px dashed var(--faint);font-size:var(--t4);color:var(--sub)}
.pending b{color:var(--ink)}
.caveats{margin:8px 16px 0;padding:6px 0 6px 10px;border-left:3px solid var(--restricted)}
.caveats .lbl{font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--restricted)}
.caveats ul{margin:2px 0 0;padding:0;list-style:none}
.caveats .factbtn{min-height:44px;display:block;width:100%}
.caveats .factbtn b{display:block}.caveats .where{font-size:var(--t4);color:var(--sub)}
.banner{margin:8px 16px 0;padding:10px 0 4px;border-top:1.5px solid var(--closed)}
.banner .big{font:800 var(--t2) "Bricolage Grotesque",Archivo,sans-serif;color:var(--closed)}
.banner p{margin:4px 0}.closechain{margin:4px 0;padding-left:18px}.closechain li{margin:4px 0}
.golink,.linkrow,.linkbtn{color:var(--accent);font-weight:700;min-height:44px;display:inline-flex;align-items:center}
/* groups: separated by a rule + header, no boxes */
.row.ledger{display:block;padding:14px 16px 6px;border-top:1.5px solid var(--ink)}
.rhead{display:flex;align-items:flex-start;gap:10px}
.rtitle{flex:1;font:800 var(--t2)/1.2 "Bricolage Grotesque",Archivo,sans-serif}
.scope{display:block;margin-top:3px;font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.rhead .num{font:800 var(--t1)/1 "Bricolage Grotesque",Archivo,sans-serif;text-align:right;white-space:nowrap}
.rhead .num small{display:block;font:600 var(--t4) Archivo,sans-serif;color:var(--sub);margin-top:3px}
.rhead .pill{border:0;padding:0;min-height:0;font:700 var(--t3) Archivo,sans-serif}
.pill.release{color:var(--restricted)}.pill.closed{color:var(--closed)}
.lead{margin:8px 0 0;font:700 var(--t3)/1.35 Archivo,sans-serif}
.caps{margin:4px 0 0;padding:0;list-style:none}
.caps li{position:relative;padding:3px 0 3px 16px;font-size:var(--t3)}
.caps li::before{content:"";position:absolute;left:3px;top:.75em;width:6px;height:2px;background:var(--ink)}
.els{margin:8px 0 0;font-size:var(--t4);color:var(--sub)}
.exs{margin:4px 0 0;padding:0;list-style:none;font-size:var(--t4)}
.exs li{display:flex;flex-wrap:wrap;gap:0 6px;padding:3px 0}.exs li span{color:var(--sub)}
.gfor{margin-top:8px}.gfor > .lbl{display:none}
.gconds{margin:0;padding:0;list-style:none}
.gconds li{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.gconds .ck{font-style:normal;color:var(--open);font-weight:800}
.gconds li > div{flex:1}
.gquiet{margin:4px 0 0;font-size:var(--t4);color:var(--sub)}
.gl{display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px;margin:-6px -4px -6px 0;color:var(--accent);font-size:var(--t3);vertical-align:middle}
.srcbtn{display:inline-flex;align-items:center;min-height:28px;padding:0 6px;margin:2px 0;border:1px solid var(--line2);font:700 var(--t4) Archivo,sans-serif;color:var(--sub)}
/* species guide: the group's fish as a row of pictures */
.spg{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 2px;padding:0 16px 4px;scrollbar-width:none}
.spg::-webkit-scrollbar{display:none}
.spg button{flex:0 0 104px;display:flex;flex-direction:column;gap:3px;min-height:44px}
.spg .im{width:104px;height:52px;background:var(--wash);border:1px solid var(--line2)}
.spg img{width:100%;height:100%;object-fit:contain;display:block}
.spg span{font-size:var(--t4);line-height:1.2}
/* kinds: one row component */
.sblock{margin-top:10px}.sblock > .lbl{display:block;font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint);padding:6px 0 0;border-top:1px solid var(--line2)}
.sblock .lbl2{text-transform:none;letter-spacing:0;font-weight:600}
.krow{display:flex;gap:10px;width:100%;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.sblock > .lbl + .rail .krow:first-child{border-top:0}
.krow .kb{flex:1;min-width:0}
.krow .nm{display:block;font:700 var(--t3) Archivo,sans-serif}
.krow .sl{font-size:var(--t4);margin-top:2px}
.krow .sl .n{font:800 var(--t2) "Bricolage Grotesque",Archivo,sans-serif;color:var(--open)}
.krow .sl .k,.krow .sl .of{color:var(--sub)}
.krow .s2{margin:2px 0 0;font-size:var(--t4);color:var(--sub)}
.krow ul{margin:3px 0 0;padding-left:16px;font-size:var(--t4);font-weight:700}
.chev{width:14px;height:14px;flex:0 0 14px;margin-top:4px;fill:none;stroke:var(--sub);stroke-width:2}
.krel{color:var(--restricted);font-weight:700}
/* other fish: one compact list */
.olist{display:block}
.orow{display:flex;gap:10px;align-items:baseline;width:100%;padding:9px 0;border-top:1px solid var(--line);min-height:44px}
.orow .on{flex:1}.orow b{white-space:nowrap}
.k-release{color:var(--restricted)}.k-closed{color:var(--closed)}.k-keep,.k-nolimit{color:var(--ink)}
.foot{padding:10px 16px 20px;font-size:var(--t4);color:var(--sub)}
.foot .lbl{font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.foot p{margin:4px 0}
/* gear: one page. Summary tiles (jump links) then each topic inline */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line2);border-left:1px solid var(--line2);margin:4px 0 6px}
.ktile{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-height:72px}
.ktile.on{background:transparent}
.ktile .kl{font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.ktile .kv{font:800 var(--t3)/1.2 "Bricolage Grotesque",Archivo,sans-serif}
.ktile .ks{font-size:var(--t4);color:var(--sub);line-height:1.3}
.ktile:last-child:nth-child(odd){grid-column:1 / -1}
.gtopic{padding:14px 0 6px;border-top:1px solid var(--line2)}
.gtopic > h3{margin:0 0 6px;font:800 var(--t2) "Bricolage Grotesque",Archivo,sans-serif}
.gtopic .khead,.gtopic .knav,.gtopic .profile{display:none}
.grow{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:var(--t3)}
.glabel{flex:0 0 40%;font-size:var(--t4);color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.gval{flex:1;font-weight:600}
.gsub,.gsrc{display:block;font-size:var(--t4);color:var(--sub);font-weight:400}
.gtopic ul{padding-left:18px;margin:4px 0}
.gtopic .lbl{font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:8px}
.gtopic .doc{padding:8px 0;border-top:1px solid var(--line)}
.gtopic .price{font:500 var(--t4) "JetBrains Mono",monospace}
.gtopic details{border-top:1px solid var(--line);margin-top:6px}
.gtopic summary{min-height:44px;display:flex;align-items:center;font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--sub);cursor:pointer}
.gtopic .paper,.gtopic .kitnote{background:var(--wash);padding:8px 10px;margin:6px 0;font-size:var(--t4)}
.who{margin:6px 0 8px}
.u16h{margin:12px 0 2px;font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
/* sheets (Sheet.tsx) */
.scrim{position:absolute;inset:44px 0 0 0;background:var(--scrim);display:none;z-index:20}.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:1.5px solid var(--ink);max-height:88%;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .2s}
.sheet.on{transform:none}
.shead{padding:10px 8px 0 16px;border-bottom:1.5px solid var(--ink)}
.grab{width:38px;height:3px;background:var(--line2);margin:0 auto 8px}
.shead .r{display:flex;align-items:center;gap:8px}
.shead h2{margin:0;flex:1;font:800 var(--t2) "Bricolage Grotesque",Archivo,sans-serif}
.done{min-width:44px;min-height:44px;padding:0 8px;color:var(--accent);font:700 var(--t4) Archivo,sans-serif;letter-spacing:1.2px;text-transform:uppercase}
.shead p{margin:0 0 10px;font-size:var(--t4);color:var(--sub)}
.sbody{overflow:auto;padding:8px 16px 24px}
.sbody .lbl{font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:10px}
.sbody blockquote{margin:6px 0;padding:8px 10px;border-left:3px solid var(--ink);background:var(--wash);font-size:var(--t3)}
.sbody .lres{font-weight:700;margin:4px 0}
.ladder2{margin:4px 0;padding:0;list-style:none}
.ladder2 .lvl{display:block;font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:8px}
.ladder2 ul{margin:0;padding:0;list-style:none}
.pline{display:flex;flex-wrap:wrap;gap:2px 8px;width:100%;padding:8px 0;border-top:1px solid var(--line);min-height:44px;align-items:baseline}
.pline span{flex:1 1 200px}.pline em{font-style:normal;font-size:var(--t4);color:var(--sub)}
.pline .scp{flex-basis:100%;font-size:var(--t4);color:var(--faint)}
.lost .pline{opacity:.65}
.sbody .pic{margin:0 -16px;background:var(--wash);aspect-ratio:2/1}.sbody .pic img{width:100%;height:100%;object-fit:contain}
.cred{font-size:11px;color:var(--faint);margin-top:4px}
.sbody ul.tips{padding-left:18px}
.fraw,.gjson,.mono{display:none}
.needs ul,.gtopic ul.plain{list-style:none;padding:0;margin:4px 0}
.needs li{padding:8px 0;border-top:1px solid var(--line)}
.needs li > b{display:block;font-weight:700}.needs li > span{display:block;color:var(--sub);font-size:var(--t4)}
.needs li > .price{color:var(--ink);font:500 var(--t4) "JetBrains Mono",monospace}
.gval b{font-weight:700}.gval > span:not(.price){display:block;color:var(--sub);font-size:var(--t4);font-weight:400}
.src.gsrc{display:inline-flex;align-items:center;min-height:24px;padding:0 6px;margin-top:2px;border:1px solid var(--line2);font:700 var(--t4) Archivo,sans-serif;color:var(--sub)}
.sc{padding:8px 0;border-top:1px solid var(--line)}
.badge{display:inline-block;padding:1px 6px;background:var(--ink)!important;color:var(--card);font:700 var(--t4) Archivo,sans-serif;letter-spacing:.8px;text-transform:uppercase}
.scq{font-weight:600;margin-top:3px}.scrole{font-size:var(--t4);color:var(--sub)}.scrole.won{color:var(--open)}
.krow .sl .n{margin:0 4px}.krow .sl .segs{margin-left:6px}.krow .sl .of{margin-right:6px}
.gconds li{align-items:baseline}
.sl .rl{color:var(--restricted);font-weight:700}
.wlist,.baitgrid{display:block}
.wrow,.bait{display:flex;gap:8px;align-items:baseline;width:100%;padding:7px 0;border-top:1px solid var(--line);min-height:44px}
.wrow span{flex:1} .wrow b,.bait b{font-weight:700} .wrow small{display:block;font-size:var(--t4);color:var(--sub)}
.bait span{margin-left:auto;font-size:var(--t4);color:var(--sub)}
.wrow i,.bait i,.nochip i{font-style:normal;font-weight:800;width:16px}
.wrow .ok,.bait.ok i{color:var(--open)} .bait.no i,.nochip i{color:var(--closed)}
.wno{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.nochip{display:inline-flex;align-items:center;min-height:36px;padding:0 8px;border:1px solid var(--line2);font-size:var(--t4)}
.hcards{display:block}.hcard{padding:6px 0;border-top:1px solid var(--line)}
.hh{font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.hcard ul{list-style:none;padding:0;margin:2px 0}.hcard .factbtn{display:block;width:100%;padding:4px 0;min-height:32px}
.hcard:first-child .factbtn{font-weight:700}
.ts2 .hdr{position:static}
[data-gearsrc]{display:none}
.fishart{margin:8px 0;border:1px solid var(--line2);background:var(--wash);padding:6px}.fishart svg{width:100%;height:auto;display:block}.fishart figcaption{font-size:var(--t4)}
/* v10 review fixes */
.lvh{margin:12px 0 2px;font:700 var(--t4) Archivo,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.srow{display:flex;flex-direction:column;padding:7px 0;border-top:1px solid var(--line)}
.srow span{font-size:var(--t3)} .srow small,.srow b{font-size:var(--t4);color:var(--sub)} .srow b{color:var(--ink);font-weight:700}
.pline em{display:block;flex-basis:100%;font-style:normal;color:var(--sub)}
.sbody .lres{color:var(--ink)}
.fe{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;margin-top:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:600 var(--t3) Archivo,sans-serif}
.words{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;margin-top:4px;font-size:var(--t4);color:var(--sub)}
.glk{min-height:44px;padding:0 6px;color:var(--accent);font:600 var(--t4) Archivo,sans-serif;text-decoration:underline;text-underline-offset:2px}
.gl{min-width:44px;min-height:44px;margin:-14px -8px}
.closechain{list-style:none;padding:0}.closechain li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);min-height:44px;margin:0}
.closechain li .cd{flex:1}.closechain .srcbtn{min-height:32px}
.sbar{margin-top:22px}
.sbar .today{top:-6px;width:2px;height:22px;background:var(--ink);box-shadow:none;transform:translateX(-1px)}
.sbar .today em{display:block;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 var(--t4)/1 Archivo,sans-serif;font-style:normal;color:var(--ink);white-space:nowrap;margin-bottom:2px}
.r1 .pill{border:0;padding:0 4px;color:var(--accent)}
.r1 .pill em{display:none}
.r1 .pill > span:last-child::after{content:" ▾";font-size:10px}
.mapbtn svg{width:18px;height:18px}
.hdr.mini .r2 .mapbtn span{display:inline}
.kgrid{border:0;gap:12px 16px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.ktile{border:0;padding:0;min-height:0}
.needs li > .price,.gtopic .price{font:600 var(--t4) Archivo,sans-serif;font-variant-numeric:tabular-nums}
.bk{margin-right:10px;white-space:nowrap}.bk i{font-style:normal}.bk.ok i{color:var(--open)}.bk.no i{color:var(--closed)}
.gtopic summary,details.lostlist summary{min-height:48px;display:flex;align-items:center;list-style:none}
.gtopic summary::-webkit-details-marker{display:none}
.gtopic summary::after{content:"";width:8px;height:8px;margin-left:auto;margin-right:4px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:transform .15s}
.gtopic details[open] summary::after{transform:rotate(-135deg)}
.classbox b{display:block;font:700 var(--t3) Archivo,sans-serif}.classbox span{display:block;font-size:var(--t3)}
.gconds.oth li::before{content:"✓";color:var(--open);font-weight:800}
.spg button{flex:0 0 calc((100% - 24px) / 3.5)}
.spg .im{width:100%;height:auto;aspect-ratio:2/1;border:0;background:var(--wash)}
.spg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-licsrc]{display:none}
.kgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spg img{filter:brightness(.82)}}
:root[data-theme="dark"] .spg img,:root[data-theme="dark"] .sbody .pic img{filter:brightness(.82)}
/* water map overlay */
.wmap{position:absolute;inset:0;z-index:10;background:var(--card);transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.wmap.on{transform:none}
.wmap .mh{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 4px;min-height:52px;border-bottom:1.5px solid var(--ink)}
.wmap .mbody{position:relative;flex:1}
.wmap svg{position:absolute;inset:0;width:100%;height:100%}
.wmap .legend{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);padding:8px 10px;font-size:var(--t4)}
.toast{position:absolute;left:16px;right:16px;bottom:16px;z-index:30;background:var(--ink);color:var(--card);padding:10px 14px;font-size:var(--t4);display:none}.toast.on{display:block}
.poster h1{font:800 56px/.95 "Bricolage Grotesque",Archivo,sans-serif;margin:0 0 14px}
.poster p{font-size:17px;line-height:1.5;color:var(--sub);max-width:48ch}
.ctl{border-top:1.5px solid var(--ink);padding:12px 0}.ctl .cs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ctl .pill{min-height:36px}.ctl .pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="app"><div class="sb"><span>9:41</span><i>●●● ▮</i></div>
    <div class="body" id="body">
      <div id="reg"><div class="scroller" id="sc"></div></div>
      <div class="wmap" id="wmap"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div><div class="toast" id="toast"></div></div>
  <div class="poster"><h1>Regs v10</h1>
    <p>One Regulations surface with two parts, <b>What you can keep</b> and <b>Gear &amp; licence</b>, under one header. Every fact is page v36’s, from a script-made snapshot. Data still to come is marked “pending data”.</p>
    <div class="ctl"><span class="lab">Water and day</span><div class="cs" id="c-w"></div></div>
    <div class="ctl"><span class="lab">Theme and text</span><div class="cs" id="c-t"></div></div></div>
</div>
<script src="regs-mock/maps.js"></script>
<script src="regs-v10/v36snap.js"></script>
<script src="regs-v10/fish.js"></script>
<script src="regs-v10/fishart.js"></script>
<script>
"use strict";
/* which snapshot states exist (the prototype can only show days the snapshot holds) */
const WATERS = {
  vedder:{snap:{1010:'vedder_1010', 515:'vedder_515', 615:'vedder_615'}, map:'vedder', mapKey:[0]},
  klwa:{snap:{1010:'klwa_1010', 1012:'klwa_1012'}, map:'klwa', mapKey:[0]},
  cowichan:{snap:{1010:['cow0_1010','cow2_1010','cow3_1010','cow4_1010','cow1_1010']}, map:'cowichan', mapKey:[0,2,3,4,1]},
};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt = md => MON[Math.floor(md/100)-1] + ' ' + (md%100), wday = md => WD[new Date(2026, Math.floor(md/100)-1, md%100).getDay()];
const S = {w:'vedder', d:1010, p:0, sec:'keep', sheet:'', map:0, age:'adult', theme:'', ts:0, scroll:0};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const sid = () => { const x = WATERS[S.w].snap[S.d]; return Array.isArray(x) ? x[S.p] : x; };
const ST = () => SNAP.states[sid()];
const CHEVI = '<svg viewBox="0 0 16 16" class="chev" aria-hidden="true" style="margin:0"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';
const CHEV = '<svg viewBox="0 0 16 16" class="chev" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';
const FISHPIC = code => (FISHMANIFEST.images || []).filter(i => i.code === code);

/* ---------- header: back · water · date, then [What you can keep | Gear & licence] + View on map, then parts ---------- */
function statusOf(st){ const h = st.cardHTML; return /wsstat closed/.test(h) ? 'closed' : /wsstat open/.test(h) ? 'open' : 'unknown'; }
function hdr(){
  const st = ST(), w = WATERS[S.w], parts = st.parts.length > 1 ? (Array.isArray(w.snap[S.d]) ? w.snap[S.d] : null) : null;
  const k = statusOf(st), col = k === 'closed' ? '--closed' : k === 'open' ? '--open' : '--faint';
  return `<div class="hdr" id="hdr"><div class="r1"><button class="back" aria-label="Back to search" data-toast="Back to the app’s Search">‹</button>
      <div class="ttl"><b>${esc(st.name)}</b><small>${esc(st.sub)}</small></div>
      <button class="pill" data-open="date" aria-label="Change date, now ${fmt(S.d)}"><span class="dot" style="background:var(${col})"></span><span><em>Change date</em>${S.d === 1010 ? 'Today' : wday(S.d)} · ${fmt(S.d)}</span></button></div>
    <div class="r2"><div class="segm" role="tablist" aria-label="Section"><button aria-pressed="${S.sec==='keep'}" data-sec="keep">What you can keep</button><button aria-pressed="${S.sec==='gear'}" data-sec="gear">Gear &amp; licence</button></div>
      <button class="mapbtn" data-map="1" aria-label="View this water on a map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3.5H21V20.5H3Z" stroke-width="1.8"/><path d="M8 3.5V9L12.5 13.5V20.5M17.5 3.5V7L12.5 13.5" stroke-width="2.2"/></svg><span>Map</span></button></div>
    ${parts ? `<div class="parts" role="group" aria-label="Parts, from the mouth">${parts.map((id, i) => { const s2 = SNAP.states[id], k2 = statusOf(s2), on = i === S.p;
      return `<button aria-current="${on}" data-part="${i}" aria-label="Part ${i+1}: ${esc(st.parts.find(o => o.v === s2.part)?.t || '')}, ${k2}"><i class="${k2==='closed'?'s-closed':'s-keep'}"></i>${i+1}${on ? `<span>${esc((st.parts.find(o => o.v === s2.part)?.t || '').replace(/ · \d+ sections?$/,''))}</span>` : ''}</button>`; }).join('')}</div>` : ''}</div>`;
}

/* ---------- transform v36's card fragment into v10's layout ---------- */
function speciesRow(codes){
  const cs = codes.filter(c => SNAP.fish[c] && FISHPIC(c).length);
  if (!cs.length) return '';
  return `<div class="spg" role="list" aria-label="What they look like">${cs.map(c => `<button role="listitem" data-open="sp:${c}"><span class="im"><img src="../apps/mobile/assets/fish/${FISHPIC(c)[0].file}" alt="" loading="lazy"></span><span>${esc(SNAP.fish[c].name)}</span></button>`).join('')}</div>`;
}
function buildKeep(){
  const st = ST(), doc = new DOMParser().parseFromString(`<div id="root">${st.cardHTML}</div>`, 'text/html'), root = doc.getElementById('root');
  // pending data: fly-only / bait-ban days on the strip (answers 2.6)
  const leg = root.querySelector('.slegend') || root.querySelector('.wstrip');
  if (leg) leg.insertAdjacentHTML('beforeend', `<span class="pend" title="Arrives with answers 2.6">Fly-only / bait-ban days: pending data</span>`);
  root.querySelectorAll('.looks, .lthumb').forEach(e => e.remove());
  root.querySelectorAll('.closechain li').forEach(li => { const t = li.firstChild; if (t && t.nodeType === 3) t.textContent = t.textContent.replace(/^No fishing for any game fish,?\s*/, '').replace(/^from streams,\s*/, 'From streams, ');
    const sc = li.querySelector('.muted'), b = li.querySelector('.srcbtn'); li.innerHTML = `<span class="cd">${esc(li.firstChild.textContent.trim())}${sc ? ` <span class="muted small">${esc(sc.textContent)}</span>` : ''}</span>${b ? b.outerHTML : ''}`; });
  root.querySelectorAll('article.row.ledger').forEach(art => {
    const ri = +(art.dataset.row || 'r0').slice(1), raw = st.rows[ri] || {}, g = raw.group;
    // header numeral: the group's total from the data, not the stream sub-cap
    const num = art.querySelector('.rhead .num'); if (g && num && typeof g.total === 'number') num.innerHTML = `${g.total}<small>a day</small>`;
    // the group sentence as a lead line + a short list (answers 2.5 group.says; answers 2.6 will word it)
    const gl = art.querySelector('.gline');
    if (gl && g && g.says) {
      const [first, ...rest] = g.says.replace(/\.$/,'').split('; ');
      const tips = [...gl.querySelectorAll('.gl')].map(b => b.outerHTML).join(' ');
      const words = [...gl.querySelectorAll('.gl')].map(b => { const id = b.dataset.gl, t = (SNAP.gloss[id]?.title || '').replace(/ \(.*\)$/,'').replace(/ – .*$/,''); return `<button class="glk" data-gl="${id}">${esc(t)}</button>`; }).join('');
      gl.outerHTML = `<p class="lead">${esc(first)}.</p>${rest.length ? `<ul class="caps">${rest.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}${raw.elsewhere ? `<p class="els">${esc(raw.elsewhere.says)}</p>` : ''}`
        + (raw.elsewhere && raw.elsewhere.ask.length ? `<button class="fe" data-open="else:${sid()}|${ri}">Fished elsewhere today? ${CHEVI}</button>` : '')
        + (words ? `<div class="words"><span>What these words mean:</span>${words}</div>` : '');
      art.querySelectorAll('ul.exs').forEach(e => e.remove());
    }
    // the species guide sits right under the group's header
    const codes = (g && g.kinds) || raw.members || [];
    const rh = art.querySelector('.rhead'); if (rh && art.querySelector('.sblock')) rh.insertAdjacentHTML('afterend', speciesRow(codes));
    // kinds: rows that open one clean sheet (the "how this was decided" lives there)
    art.querySelectorAll('details.sp2').forEach((d, ki) => {
      const sum = d.querySelector('summary'), dec = d.querySelector('.minidec');
      const id = `${sid()}|${art.dataset.row}|${ki}`; KINDS[id] = {head: sum.innerHTML, dec: dec ? dec.innerHTML : '', codes: [], title: sum.querySelector('.nm')?.textContent || ''};
      const b = doc.createElement('button'); b.className = 'krow'; b.dataset.open = 'kind:' + id;
      b.innerHTML = `<span class="kb">${sum.innerHTML}</span>${CHEV}`; d.replaceWith(b);
    });
  });
  // other fish: the compact list; each line opens its full row (with how it was decided) as a sheet
  root.querySelectorAll('details.others').forEach(o => {
    const arts = [...o.querySelectorAll(':scope > article.row')], list = o.querySelector('.olist');
    const rows = [...list.querySelectorAll('.orow')].map((r, i) => { const id = `${sid()}|o${i}`; OTHERS_[id] = arts[i] ? arts[i].outerHTML : '';
      return `<button class="orow" data-open="other:${id}">${r.innerHTML}${CHEV}</button>`; }).join('');
    o.outerHTML = `<section class="sec" style="padding-top:14px;border-top:1.5px solid var(--ink)"><div class="sech"><h2>Other fish</h2></div><div class="olist">${rows}</div></section>`;
  });
  // closed "Other fish"-less waters keep their banner; the char row etc. stay as they are
  return root.innerHTML.replace(/ open=""/g, '');
}
const KINDS = {}, OTHERS_ = {};
function buildGear(){
  const st = ST();
  if (!st.kitTiles) return `<p class="foot">No gear may go in the water and no licence is needed while fishing is closed.</p>`;
  const labelFix = h => h;
  const tiles = st.kitTiles.replace(/<span class="bk (ok|no)">([^<]+?)&nbsp;<i>([✓✕])<\/i><\/span>/g, '<span class="bk $1"><i>$3</i>&nbsp;$2</span>').replace(/<button class="ktile([^"]*)" role="tab" aria-selected="[^"]*" type="button" data-kit="(\w+)"/g, '<button class="ktile$1" type="button" data-jump="g-$2"');
  const TITLES = {licence:'Licence', line:'Line & hooks', bait:'Bait', ways:'Ways to fish', boats:'Boats', always:'Always'};
  let h = `<div class="kgrid">${tiles}</div>`;
  for (const [k, t] of Object.entries(TITLES)) {
    if (!st.panes[k]) continue;
    let body = st.panes[k];
    if (k === 'licence') {
      const u16 = S.age === 'u16';
      body = `<div class="segm who" role="group" aria-label="Who is fishing"><button aria-pressed="${!u16}" data-age="adult">16 or older</button><button aria-pressed="${u16}" data-age="u16">Under 16</button></div>` +
        (u16 ? `<p class="u16h">B.C. resident</p>${st.licence.u16_res}<p class="u16h">Canadian, other province</p>${st.licence.u16_non}${st.licence.u16_alien !== st.licence.u16_non ? `<p class="u16h">From outside Canada</p>${st.licence.u16_alien}` : ''}` : st.licence.adult);
    }
    h += `<section class="gtopic" id="g-${k}"><h3>${t}</h3>${labelFix(body).replace(/ open=""/g, '')}</section>`;
  }
  return h;
}

/* ---------- render ---------- */
function render(keep){
  const de = document.documentElement; if (S.theme) de.dataset.theme = S.theme; else delete de.dataset.theme; de.classList.toggle('ts2', +S.ts === 2);
  const sc = $('sc'), prev = sc.scrollTop;
  sc.innerHTML = hdr() + `<div id="keep">${buildKeep()}</div><section class="sec" id="gear"><div class="sech"><span class="lab" style="margin-left:0">Gear &amp; licence · for this water ${S.d === 1010 ? 'today' : 'on ' + fmt(S.d)}</span></div>${buildGear()}</section><div style="height:24px"></div>`;
  $('tabs').innerHTML = [['regs','Regulations','M5 3.5H19V20.5H5Z','M8.5 8.5H15.5 M8.5 12.5H15.5 M8.5 16.5H12.5'],['cond','Conditions','M3.5 19.5H21 M3.5 19.5V5','M3.5 15L8 10.5L12 14L16 6.5L21 11 M16 6.5V19.5']]
    .map(([k,t,f,m]) => `<button role="tab" aria-selected="${k==='regs'}" data-tab="${k}"><svg viewBox="0 0 24 24"><path d="${f}" stroke-width="1.8"/><path d="${m}" stroke-width="2.2"/></svg><em>${t}</em><u></u></button>`).join('');
  const sh = S.sheet ? sheetHtml(S.sheet) : ''; $('sheet').innerHTML = sh; $('sheet').classList.toggle('on', !!sh); $('scrim').classList.toggle('on', !!sh);
  $('wmap').innerHTML = S.map ? mapHtml() : ''; $('wmap').classList.toggle('on', !!+S.map);
  sc.scrollTop = keep ? prev : S.scroll; mini();
  poster();
}
function mini(){ const h = $('hdr'); if (h) h.classList.toggle('mini', $('sc').scrollTop > 60);
  const g = $('gear'), sc = $('sc'), hh = h ? h.offsetHeight : 0;
  if (g) { const atEnd = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2 && sc.scrollTop > 0;
    const inGear = g.offsetTop - sc.scrollTop <= hh + 12 || atEnd;
    document.querySelectorAll('.segm[role=tablist] button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.sec === 'gear') === inGear)); } }
$('sc').addEventListener('scroll', mini, {passive:true});

/* ---------- sheets: one sheet component ---------- */
const head = (t, sub) => `<div class="shead"><div class="grab"></div><div class="r"><h2>${t}</h2><button class="done" data-close>Done</button></div>${sub ? `<p>${sub}</p>` : ''}</div>`;
const pendingBook = `<div class="pending"><b>Book page: pending data.</b> A link to this rule’s page in the official Synopsis PDF arrives with answers 2.6.</div>`;
function scopeLines(html){ // rules open their own sheet; the level heading above them already says where they apply
  return html.replace(/<button class="pline pl2" type="button" data-rule="([^"]+)">([\s\S]*?)<\/button>/g, (m, key, inner) => `<button class="pline pl2" type="button" data-open="rule:${key}">${inner}</button>`);
}
/* the row-sources sheet: one small heading per level, then plain rows (the rule, its effect) */
function groupedSources(html){
  const doc = new DOMParser().parseFromString(`<div id="r">${html}</div>`, 'text/html'), r = doc.getElementById('r'); let out = '', cur = null, buf = [];
  const flush = () => { if (!buf.length) return; const by = {}; buf.forEach(x => (by[x.where] = by[x.where] || []).push(x));
    out += Object.entries(by).map(([w, xs]) => `<p class="lvh">${esc(w)}</p>${xs.map(x => `<div class="srow"><span>${esc(x.q)}</span><small>${esc(x.role)}</small></div>`).join('')}`).join(''); buf = []; };
  [...r.children].forEach(el => {
    if (el.classList.contains('lbl')) { flush(); out += `<div class="lbl">${esc(el.textContent)}</div>`; }
    else if (el.classList.contains('sc')) buf.push({where: el.querySelector('.muted')?.textContent.trim() || '', q: (el.querySelector('.scq')?.textContent || '').trim().replace(/^[“"]|[”"]$/g, ''), role: el.querySelector('.scrole')?.textContent.trim() || ''});
    else { flush(); el.querySelectorAll('.badge,.fraw').forEach(x => x.remove()); out += el.outerHTML; }
  }); flush(); return out;
}
function sheetHtml(k){
  const st = ST();
  if (k === 'date') { const days = Object.keys(WATERS[S.w].snap).map(Number).sort((a,b) => a-b);
    return head('Which day?', '') + `<div class="sbody"><div class="lab">Days in this prototype’s snapshot</div>${days.map(d => `<button class="orow" data-day="${d}"><span class="on">${wday(d)} ${fmt(d)}${d === 1010 ? ' · today' : ''}</span>${d === S.d ? '<b>✓</b>' : ''}</button>`).join('')}
      <div class="pending"><b>Other days:</b> the app reads any day from the bundle; this prototype only holds the days above.</div></div>`; }
  if (k.startsWith('kind:')) { const x = KINDS[k.slice(5)]; if (!x) return '';
    return head(esc(x.title), '') + `<div class="sbody"><div class="krow" style="border:0;padding-top:4px"><span class="kb">${x.head.replace(/<b class="nm">[\s\S]*?<\/b>/, '')}</span></div><div class="lbl">How this was decided</div>${scopeLines(x.dec.replace(/<div class="lbl">How this was decided<\/div>/,''))}</div>`; }
  if (k.startsWith('other:')) { const x = OTHERS_[k.slice(6)]; if (!x) return '';
    const t = (x.match(/<span class="rtitle">([^<]+)/) || [])[1] || 'Other fish';
    return head(esc(t), '') + `<div class="sbody">${scopeLines(x.replace(/<span class="rtitle">[^<]+<\/span>/,'').replace(/<details class="decide"[^>]*>/g,'<div>').replace(/<\/details>/g,'</div>').replace(/<summary>How this was decided<\/summary>/g,'<div class="lbl">How this was decided</div>'))}</div>`; }
  if (k.startsWith('rule:')) { const r = SNAP.rules[k.slice(5)]; if (!r) return '';
    return head(esc(r.title), esc(r.sub)) + `<div class="sbody">${r.body}${pendingBook}</div>`; }
  if (k.startsWith('gl:')) { const g = SNAP.gloss[k.slice(3)]; if (!g) return ''; return head(esc(g.title), esc(g.sub)) + `<div class="sbody">${g.body}</div>`; }
  if (k.startsWith('src:')) { const s2 = SNAP.sources[k.slice(4)]; if (!s2) return ''; return head(esc(s2.title), esc(s2.sub)) + `<div class="sbody">${groupedSources(s2.body)}${pendingBook}</div>`; }
  if (k.startsWith('else:')) { const [id, ri] = k.slice(5).split('|'), e = SNAP.states[id].rows[+ri].elsewhere;
    return head('Fished elsewhere today?', esc(e.says)) + `<div class="sbody">${e.ask.map(([q, a]) => `<div class="srow"><span>${esc(q)}</span><b>${esc(a)}</b></div>`).join('')}</div>`; }
  if (k === 'hatch') { const h = SNAP.howtell; let i = 0; const body = h.body.replace(/<figure class="fishart">/g, () => `<figure class="fishart">${window.FISHART ? FISHART.draw('RB', {marks:false, adiMark:true, clipped: i++ === 1}) : ''}`); return head(esc(h.title), esc(h.sub)) + `<div class="sbody">${body}</div>`; }
  if (k.startsWith('sp:')) { const c = k.slice(3), f = SNAP.fish[c], pics = FISHPIC(c); if (!f) return '';
    return head(esc(f.name), '') + `<div class="sbody">${pics.map(p => `<div class="pic"><img src="../apps/mobile/assets/fish/${p.file}" alt="${esc(p.caption)}"></div><div class="cred">${esc(p.caption)}${p.phase ? ' · ' + esc(p.phase) : ''} · ${esc(p.credit)} (${esc(p.source)})</div>`).join('')}
      <div class="lbl">What to look for</div><ul class="tips">${f.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`; }
  return '';
}

/* ---------- the water's own map (overlay; back returns to the same scroll) ---------- */
function mapHtml(){
  const st = ST(), w = WATERS[S.w], g = (window.MAPS||{})[w.map].big, lake = st.kind === 'lake', ns = 'vector-effect="non-scaling-stroke"';
  const parts = Array.isArray(w.snap[S.d]) ? w.snap[S.d] : [sid()];
  const nums = d => (d.match(/-?\d+(\.\d+)?/g)||[]).map(Number);
  const mid = d => { const n = nums(d); const k = Math.floor(n.length/4)*2; return [n[k], n[k+1]]; };
  const k0 = statusOf(st), col = k0 === 'closed' ? 'var(--closed)' : 'var(--open)';
  let s = `<svg viewBox="0 0 390 740" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Map of ${esc(st.name)}"><rect x="-3000" y="-3000" width="7000" height="7000" fill="var(--land)"/><path d="${g.lakes}" fill="var(--lake)" fill-opacity=".45" fill-rule="evenodd"/>`;
  for (const [o,d] of Object.entries(g.streams)) s += `<path d="${d}" fill="none" stroke="var(--water)" stroke-opacity=".5" ${ns} stroke-width="${0.4+o*0.3}"/>`;
  s += lake ? `<path d="${g.target}" fill="${col}" fill-opacity=".4" stroke="${col}" ${ns} stroke-width="2"/>` : `<path d="${g.target}" fill="none" stroke="var(--ink)" stroke-opacity=".4" ${ns} stroke-width="3"/>`;
  const pd = (g.parts||{})[String(w.mapKey[S.p] ?? 0)]; if (pd && !lake) s += `<path d="${pd}" fill="none" stroke="${col}" ${ns} stroke-width="5"/>`;
  if (parts.length > 1) parts.forEach((id, i) => { const d = (g.parts||{})[String(w.mapKey[i])]; if (!d) return; const [x,y] = mid(d), on = i === S.p;
    s += `<g data-part="${i}" style="cursor:pointer"><rect x="${x-22}" y="${y-22}" width="44" height="44" fill="transparent"/><rect x="${x-14}" y="${y-14}" width="28" height="28" fill="${on?'var(--ink)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x}" y="${y+4.6}" text-anchor="middle" font-size="13" font-weight="700" font-family="Archivo" fill="${on?'var(--card)':'var(--ink)'}">${i+1}</text></g>`; });
  s += '</svg>';
  return `<div class="mh"><button class="back" data-unmap aria-label="Back to regulations">‹</button><div class="ttl"><b>${esc(st.name)}</b><small>Back to the regulations</small></div></div>
    <div class="mbody" id="mbody">${s}<div class="legend"><b style="color:${col}">${k0 === 'closed' ? '✕ Closed' : '✓ Open'}</b> ${parts.length > 1 ? `· part ${S.p+1} of ${parts.length}. Tap a number to switch.` : '· the whole water'}</div></div>`;
}
/* swipe back from the left edge closes the water map */
(() => { let x0 = null; $('wmap').addEventListener('pointerdown', e => { if (e.clientX - $('wmap').getBoundingClientRect().left < 24) x0 = e.clientX; });
  $('wmap').addEventListener('pointermove', e => { if (x0 != null) $('wmap').style.transform = `translateX(${Math.max(0, e.clientX - x0)}px)`; });
  $('wmap').addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; $('wmap').style.transform = ''; if (dx > 80) go({map:0}, true); }); })();

/* ---------- events ---------- */
function go(o, keep){ Object.assign(S, o); if (!keep && !('scroll' in o)) S.scroll = 0; render(keep); }
function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 1800); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-close],[data-sec],[data-map],[data-unmap],[data-part],[data-day],[data-age],[data-jump],[data-gl],[data-src],[data-rule],[data-howtell],[data-fish],[data-tab],[data-toast],[data-cw],[data-ct],[data-md]');
  if (!t) { if (e.target === $('scrim')) go({sheet:''}, true); return; }
  const d = t.dataset;
  if (d.open) return go({sheet:d.open}, true);
  if (d.close != null) return go({sheet:''}, true);
  if (d.gl) return go({sheet:'gl:' + d.gl}, true);
  if (d.src) return go({sheet:'src:' + sid() + '|' + d.src}, true);
  if (d.rule) return go({sheet:'rule:' + d.rule}, true);
  if (d.howtell) return go({sheet:'hatch'}, true);
  if (d.fish) return go({sheet:'sp:' + d.fish}, true);
  if (d.sec) { const el = d.sec === 'gear' ? $('gear') : $('keep'); $('sc').scrollTo({top: d.sec === 'gear' ? el.offsetTop - $('hdr').offsetHeight + 2 : 0, behavior:'smooth'});
    document.querySelectorAll('.segm[role=tablist] button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === d.sec)); return; }
  if (d.jump) { const el = $(d.jump); if (el) $('sc').scrollTo({top: el.offsetTop - $('hdr').offsetHeight - 4, behavior:'smooth'}); return; }
  if (d.map) return go({map:1, sheet:''}, true);
  if (d.unmap != null) return go({map:0}, true);
  if (d.part != null) return go({p:+d.part, sheet:''}, !!+S.map);
  if (d.day) return go({d:+d.day, p:0, sheet:''});
  if (d.md) return toast('This prototype holds only the snapshot’s days');
  if (d.age) return go({age:d.age}, true);
  if (d.tab) return d.tab === 'cond' ? toast('Conditions: the app’s existing water conditions') : null;
  if (d.toast) return toast(d.toast);
  if (d.cw) { const [w, dd, p] = d.cw.split('|'); return go({w, d:+dd, p:+(p||0), sheet:'', map:0}); }
  if (d.ct != null) { const [th, ts] = d.ct.split('|'); return go({theme:th, ts:+ts||0}, true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.sheet) go({sheet:''}, true); else if (+S.map) go({map:0}, true); } });
function poster(){
  $('c-w').innerHTML = [['vedder|1010','Vedder · Oct 10'],['vedder|515','Vedder · May 15'],['vedder|615','Vedder · Jun 15'],['klwa|1010','Kootenay LWA · Sat'],['klwa|1012','Kootenay LWA · Mon'],['cowichan|1010|0','Cowichan · mouth'],['cowichan|1010|1','Cowichan · part 2']]
    .map(([k,t]) => `<button class="pill ${`${S.w}|${S.d}${S.w==='cowichan'?'|'+S.p:''}`===k?'on':''}" data-cw="${k}">${t}</button>`).join('');
  $('c-t').innerHTML = [['','Auto'],['light','Light'],['dark','Dark'],['|2','200% text']].map(([k,t]) => `<button class="pill" data-ct="${k}">${t}</button>`).join('');
}
(function(){ const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('shot')) document.documentElement.classList.add('shot'); if (h.get('tall')) document.documentElement.classList.add('tall');
  for (const [k,v] of h) if (k in S) S[k] = ['d','p','map','ts','scroll'].includes(k) ? +v : v;
  const sec = S.sec; render();
  if (sec === 'gear' && !S.scroll) requestAnimationFrame(() => { $('sc').scrollTop = $('gear').offsetTop - $('hdr').offsetHeight + 2; mini(); });
})();
</script>
