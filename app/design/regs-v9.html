<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regs v9</title>
<!-- v9: page v36's Today's card and Gear & licence (structure and density), drawn in the app's own style
     (app/packages/ui-native: square corners, 1.5 px ink rules, uppercase tracked labels, the TabBar and Sheet).
     Words: page v36 (regs-v9/data.js + regs-v9/v36plus.js). Corrections the answer key requires carry
     data-src="design" and data-cite="p.NN". Fish drawings: v36's FISHART (regs-v9/fishart.js).
     Hash: #w=vedder&v=regs&part=0&d=1010&sheet=…&age=u16&theme=dark&scroll=600&open=look -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --page:#EFEFEC; --card:#FFFFFF; --wash:#F7F7F5; --tint:#EEEFEB; --line:#E5E6E1; --line2:#D3D5CF;
  --ink:#15181C; --sub:#6C737A; --faint:#6E757B;
  --open:#1D7741; --restricted:#8f5c00; --closed:#940018; --accent:#5F26E0; --on-accent:#FFFFFF;
  --water:#4A90E2; --lake:#64B5F6; --land:#F8F8F2; --shadow:rgba(21,24,28,.9); --scrim:rgba(21,24,28,.28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0A0B0D; --card:#15181B; --wash:#101215; --tint:#1E2227; --line:#252A2F; --line2:#343B42;
  --ink:#F0F2F0; --sub:#98A0A7; --faint:#7C858C;
  --open:#48b07a; --restricted:#e8a733; --closed:#FC4164; --accent:#A97CFF; --on-accent:#100A22;
  --water:#38B6DE; --lake:#205579; --land:#0A0B0D; --shadow:rgba(0,0,0,.85); --scrim:rgba(0,0,0,.28); color-scheme:dark; } }
:root[data-theme="dark"]{
  --page:#0A0B0D; --card:#15181B; --wash:#101215; --tint:#1E2227; --line:#252A2F; --line2:#343B42;
  --ink:#F0F2F0; --sub:#98A0A7; --faint:#7C858C;
  --open:#48b07a; --restricted:#e8a733; --closed:#FC4164; --accent:#A97CFF; --on-accent:#100A22;
  --water:#38B6DE; --lake:#205579; --land:#0A0B0D; --shadow:rgba(0,0,0,.85); --scrim:rgba(0,0,0,.28); color-scheme:dark; }
/* app type (type.ts): display Bricolage, text Archivo, figures JetBrains Mono; section = 11 uppercase 1.4 tracked */
html{font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:.9375rem/1.4 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;border-radius:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sect{font:700 .6875rem/1.3 Archivo,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin:0}
.ok{color:var(--open)} .no{color:var(--closed)} .rel{color:var(--restricted)}
.wrap{max-width:1180px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:392px minmax(0,1fr);gap:72px;align-items:start}
.app{width:392px;height:846px;border:1.5px solid var(--ink);background:var(--card);overflow:hidden;position:sticky;top:32px;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--shadow)}
@media (max-width:520px){.wrap{display:block;padding:0}.app{width:100vw;height:100svh;border:0;box-shadow:none;position:relative}.poster{display:none}}
.shot .wrap{display:block;padding:0} .shot .app{width:390px!important;height:844px!important;border:0;box-shadow:none;position:relative;top:0} .shot .poster{display:none}
.tall .app{height:auto!important;overflow:visible} .tall .body{overflow:visible} .tall .pane.on{position:relative} .tall .scroller{position:relative;overflow:visible} .tall .hdr{position:relative}
.sb{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font:700 15px Archivo,sans-serif;background:var(--card)}
.sb i{font-style:normal;font-size:11px;letter-spacing:.1em}
.body{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.pane{position:absolute;inset:0;display:none;background:var(--card)} .pane.on{display:block}
.tabs{flex:0 0 auto;display:flex;border-top:1.5px solid var(--ink);background:var(--card);padding:9px 0 12px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;color:var(--sub);min-height:44px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor}
.tabs em{font:normal 700 9.5px/12px Archivo,sans-serif;letter-spacing:1.1px;text-transform:uppercase}
.tabs u{display:block;width:22px;height:2.5px;margin-top:1px}
.tabs button[aria-selected="true"]{color:var(--ink)} .tabs button[aria-selected="true"] u{background:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;background:var(--card);border:1px solid var(--line2);font:600 .8125rem Archivo,sans-serif;white-space:nowrap;flex:0 0 auto}
.pill .dot{width:8px;height:8px;flex:0 0 8px}
.pill.float{box-shadow:3px 3px 0 var(--shadow);border-color:var(--ink)}
.pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pill.dp > span:last-child{display:flex;flex-direction:column;line-height:1.15}
.pill.dp em{font:normal 700 9px/1.2 Archivo,sans-serif;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 7px;background:var(--wash);font:700 .66rem Archivo,sans-serif;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
.gh .chip{white-space:normal}
/* map */
.mapsvg{position:absolute;inset:0} .mapsvg svg{width:100%;height:100%;display:block}
.m-tl{position:absolute;left:14px;top:12px}
.m-tr{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;border:1.5px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--shadow)}
.m-tr span{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font:700 18px Archivo,sans-serif}
.m-tr span+span{border-top:1px solid var(--line2)}
.mk-hit{cursor:pointer}
.place{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--ink);padding:10px 18px 12px}
.grab{width:38px;height:3px;background:var(--line2);margin:0 auto 10px}
.place .nm{display:flex;align-items:flex-start;gap:10px}
.place h2{margin:0;font:800 1.75rem/1.1 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.7px;flex:1}
.x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 44px;margin:-6px -10px 0 0;color:var(--sub);font-size:16px}
.place .say{display:block;width:100%;font:600 .9375rem/1.4 Archivo,sans-serif;margin-top:6px}
.place .hint{font-size:.8125rem;color:var(--sub);margin-top:4px}
/* reader */
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.hdr{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1.5px solid var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 16px;min-height:52px}
.where{flex:1 1 150px;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.where b{font:700 1.0625rem/1.15 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{font-size:.8125rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon{display:flex;align-items:stretch;padding:0 14px 6px}
.ribbon .nav{width:36px;flex:0 0 36px;min-height:40px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);font:700 17px Archivo,sans-serif}
.ribbon .nav[disabled]{color:var(--line2);border-color:var(--line2);cursor:default}
.ribbon .segs{flex:1;display:flex;min-width:0;margin:0 6px;border:1.5px solid var(--ink)}
.seg{flex:1 1 0;min-width:0;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;font:700 .8125rem Archivo,sans-serif;padding:5px 6px 3px;border-left:1.5px solid var(--ink)}
.seg:first-child{border-left:0}
.seg i{position:absolute;left:0;right:0;top:0;height:4px}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.seg[aria-current="true"]{flex:var(--cur,3) 1 0;background:var(--ink);color:var(--card)}
.hdr.mini .ribbon{display:none}
/* split water hero */
.split{margin:12px 16px 0;border:1.5px solid var(--ink)}
.split .sect{padding:7px 10px 6px;border-bottom:1px solid var(--line2);color:var(--sub)}
.split .two{display:grid;grid-template-columns:1fr 1fr}
.half{display:flex;gap:8px;align-items:flex-start;min-height:52px;padding:8px 10px;font-size:.8125rem;line-height:1.3}
.half+.half{border-left:1.5px solid var(--ink)}
.half b{display:block;font:700 .875rem Archivo,sans-serif;color:var(--ink)}
.half .hg{font:800 1.1rem/1 Archivo,sans-serif}
.half.hc{color:var(--closed);background:color-mix(in srgb,var(--closed) 7%,var(--card))}
.half.ho{color:var(--open);background:color-mix(in srgb,var(--open) 7%,var(--card))}
.half[aria-current="true"]{box-shadow:inset 0 -4px 0 var(--ink)}
/* verdict (compact, v36 .wstrip) */
.verd{padding:12px 16px 4px}
.vl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vl .w{font:800 1.6rem/1 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.6px}
.vl .d{font-size:.8125rem;color:var(--sub)}
.vl .soon{margin-left:auto;align-self:center;border:1.5px solid currentColor;padding:2px 8px;font:700 .75rem Archivo,sans-serif}
.strip{display:block;width:100%;margin-top:10px}
.strip .tw{position:relative}
.strip .bars{display:flex;height:10px;gap:2px}
.strip .bars span{display:block;height:100%}
.strip .tick{position:absolute;top:-4px;width:4px;height:18px;background:var(--card);box-shadow:0 0 0 1.5px var(--ink);transform:translateX(-2px)}
.strip .mo{display:flex;justify-content:space-between;margin-top:5px;font:500 .625rem/1 "JetBrains Mono",monospace;color:var(--faint)}
.strip .mo b{color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:.72rem;color:var(--sub)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:10px;height:10px;flex:0 0 10px}
.closedbox{margin:10px 16px 0;padding:10px 12px;border:1.5px solid var(--closed);background:color-mix(in srgb,var(--closed) 6%,var(--card))}
.closedbox h3{margin:0 0 4px;font:800 1.15rem/1.15 "Bricolage Grotesque",Archivo,sans-serif;color:var(--closed)}
.closedbox ul{margin:6px 0 0;padding-left:16px;font-size:.875rem}
.closedbox li{margin:3px 0} .closedbox li small{color:var(--sub)}
.times{margin:8px 16px 0;padding:6px 10px;border-left:3px solid var(--restricted);font-size:.8125rem}
/* group */
.grp{margin:12px 16px 0;border:1.5px solid var(--ink)}
.gh{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 8px}
.gh h3{margin:0;font:800 1.3rem/1.1 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.4px}
.num{flex:0 0 auto;min-width:52px;text-align:right;line-height:1}
.num b{display:block;font:800 1.6rem/1 "Bricolage Grotesque",Archivo,sans-serif;font-variant-numeric:tabular-nums}
.gh .num b{font-size:2.1rem}
.num em{display:block;font-style:normal;font:600 .72rem/1.2 Archivo,sans-serif;color:var(--sub);margin-top:3px}
.num .w{font:700 .875rem Archivo,sans-serif}
.gb{padding:0 12px 10px;font-size:.875rem}
.gb p{margin:0 0 6px}
.cap1{margin:0 0 6px;font-size:.9375rem} .cap1 span{color:var(--sub)}
.caps{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px} .caps .chip{white-space:normal;text-transform:none;letter-spacing:0;font-weight:600;font-size:.75rem}
.els{margin:0 0 4px;font-size:.8125rem;color:var(--sub)}
.qa{background:var(--wash);padding:6px 10px;margin:6px 0;font-size:.8125rem}
.qa div{padding:2px 0} .qa b{font-weight:700}
.ln{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:.875rem}
.ln svg{width:14px;height:14px;flex:0 0 14px;margin-top:3px;fill:none;stroke:var(--open);stroke-width:2.6}
.ln .more{color:var(--accent);font-weight:700;white-space:nowrap;margin-left:auto}
.ln.sub{color:var(--sub);font-size:.8125rem}
.kh{padding:8px 12px 0;border-top:1px solid var(--line2)}
.krow{display:flex;gap:10px;width:100%;padding:9px 12px;border-top:1px solid var(--line)}
.kh + .krow{border-top:0}
.krow .tx{flex:1;min-width:0}
.krow .tx b{display:block;font:700 .9375rem/1.25 Archivo,sans-serif}
.krow .tx .m{display:block;font-size:.8125rem;margin-top:2px}
.krow .tx b.kn,.kn{display:inline;font:800 1.15rem/1 "Bricolage Grotesque",Archivo,sans-serif;color:var(--open)}
.lookbox{margin:12px 16px 0;border:1.5px solid var(--ink)} .lookbox details.look{border-top:0}
.krow .tx small{display:block;font-size:.78rem;color:var(--sub);margin-top:2px;line-height:1.35}
.krow .tx .ex{display:block;font:700 .78rem/1.35 Archivo,sans-serif;margin-top:3px}
.chev{width:14px;height:14px;flex:0 0 14px;margin-top:4px;fill:none;stroke:var(--sub);stroke-width:2}
details.look{border-top:1px solid var(--line2)}
details.look summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;font:700 .6875rem Archivo,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub)}
details.look summary::-webkit-details-marker{display:none}
details.look summary::after{content:"+";margin-left:auto;font-size:16px;color:var(--ink)}
details.look[open] summary::after{content:"−"}
.adi{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 8px}
.adi figure{margin:0;border:1px solid var(--line2);background:var(--wash);padding:3px}
.adi svg{width:100%;height:auto;display:block}
.adi figcaption{font-size:.75rem;color:var(--sub);line-height:1.25;padding:0 2px 2px}
.adi figcaption b{color:var(--ink);display:block;font-size:.8125rem}
.adi + p{margin:0 12px 8px;font-size:.78rem;color:var(--sub)}
.sp{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.sp .im{aspect-ratio:2/1;background:var(--wash)} .sp img{width:100%;height:100%;object-fit:contain;display:block}
.sp b{display:block;font:700 .875rem Archivo,sans-serif}
.sp ul{margin:2px 0 0;padding-left:14px;font-size:.78rem;line-height:1.35}
.sp .cr{font-size:.66rem;color:var(--faint);margin-top:2px}
.sp .si{font:700 .66rem Archivo,sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--restricted)}
.glink{display:flex;align-items:center;min-height:40px;padding:0 12px;border-top:1px solid var(--line2);color:var(--accent);font:700 .6875rem Archivo,sans-serif;letter-spacing:1.4px;text-transform:uppercase;width:100%}
.oth{margin:12px 16px 0;border:1.5px solid var(--ink)}
.oth h3{margin:0;padding:10px 12px 6px;font:800 1.15rem/1.1 "Bricolage Grotesque",Archivo,sans-serif}
.orow{display:flex;gap:10px;align-items:baseline;width:100%;padding:7px 12px;border-top:1px solid var(--line);font-size:.875rem;min-height:36px}
.orow .v{margin-left:auto;font-weight:700;white-space:nowrap}
.fine{padding:12px 16px 24px;font-size:.75rem;color:var(--sub);line-height:1.45}
.fine p{margin:4px 0}
/* gear tiles (v36 kgrid) */
.gstat{padding:10px 16px 0;font-size:.875rem;display:flex;gap:8px;align-items:baseline}
.gstat b{font:800 1.15rem "Bricolage Grotesque",Archivo,sans-serif}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.kt{border:1.5px solid var(--ink);padding:9px 10px 10px;min-height:86px;display:flex;flex-direction:column;gap:2px}
.kt.wide{grid-column:1 / -1;min-height:0}
.kt .l{font:700 .625rem Archivo,sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint)}
.kt b{font:800 1rem/1.2 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.2px}
.kt span{font-size:.75rem;color:var(--sub);line-height:1.3}
.kt .bk{display:inline-block;margin-right:6px;white-space:nowrap}
.kt .bk.n{color:var(--closed)}
.kt.duty{border-color:var(--closed)}
/* sheets (Sheet.tsx) */
.scrim{position:absolute;inset:0;background:var(--scrim);display:none;z-index:10} .scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-top:1.5px solid var(--ink);max-height:90%;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .22s}
.sheet.on{transform:none}
.shead{flex:0 0 auto;padding:10px 8px 0 18px;border-bottom:1.5px solid var(--ink)}
.shead .r{display:flex;align-items:center;gap:8px}
.shead h2{margin:0;font:800 1.1875rem/1.2 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-.4px;flex:1}
.done{min-width:44px;min-height:44px;padding:0 10px;color:var(--accent);font:700 .6875rem Archivo,sans-serif;letter-spacing:1.4px;text-transform:uppercase;text-align:center}
.shead p{margin:0 12px 10px 0;font-size:.8125rem;color:var(--sub)}
.sbody{flex:1 1 auto;overflow:auto;padding:4px 18px 24px}
.ssec{padding-top:14px} .ssec > .sect{margin-bottom:6px}
.gl .r{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:.875rem}
.gl .r:first-child{border-top:0}
.gl .r .k{flex:0 0 42%;font-size:.78rem;color:var(--sub)}
.gl .r .v{flex:1;font-weight:600} .gl .r .v small{display:block;font-weight:400;color:var(--sub);font-size:.78rem}
.mk{display:inline-flex;width:18px;flex:0 0 18px;font-weight:800}
.docs .d{padding:9px 0;border-top:1px solid var(--line)} .docs .d:first-child{border-top:0}
.docs .d b{display:block;font-weight:700} .docs .d span{display:block;font-size:.8125rem;color:var(--sub)}
.docs .d em{display:block;font:500 .75rem/1.5 "JetBrains Mono",monospace;font-style:normal}
.note{margin-top:8px;padding:8px 10px;background:var(--wash);font-size:.8125rem}
.segc{display:flex;border:1.5px solid var(--ink);margin-top:6px}
.segc button{flex:1;min-height:44px;font:700 .6875rem Archivo,sans-serif;letter-spacing:1.1px;text-transform:uppercase;text-align:center;color:var(--sub)}
.segc button+button{border-left:1.5px solid var(--ink)}
.segc button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
details.fold{border-top:1px solid var(--line);margin-top:8px}
details.fold summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;font:700 .6875rem Archivo,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";margin-left:auto;font-size:16px;color:var(--ink)}
.src p{font-size:.8125rem;margin:6px 0} .src p small{display:block;color:var(--sub)}
.src h5{margin:10px 0 0;font:700 .6875rem Archivo,sans-serif;letter-spacing:1.4px;color:var(--faint)}
.tips{margin:0;padding:0 0 0 16px;font-size:.875rem} .tips li{margin:4px 0}
.lad .lv{padding:8px 0;border-top:1px solid var(--line)}
.lad .who{display:block;font:700 .6875rem Archivo,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.lad .lv div{font-size:.875rem} .lad .lv div small{display:block;font-size:.78rem;color:var(--sub)}
.pic{margin:12px -18px 0;background:var(--wash);aspect-ratio:2/1} .pic img{width:100%;height:100%;object-fit:contain}
.cred{margin-top:6px;font-size:11px;color:var(--faint)}
.big2 figure{margin:10px 0 0;border:1.5px solid var(--ink);background:var(--wash);padding:8px} .big2 svg{width:100%;height:auto;display:block}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.mgrid button{border:1px solid var(--line2);min-height:44px;font:700 .6875rem Archivo,sans-serif;letter-spacing:1.1px;text-transform:uppercase;text-align:center}
.mgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.days{display:flex;align-items:center;gap:12px;margin-top:8px;border:1.5px solid var(--ink)}
.days button{min-width:48px;min-height:48px;font:700 20px Archivo,sans-serif;text-align:center}
.days .d{flex:1;text-align:center;font:800 1.3rem "Bricolage Grotesque",Archivo,sans-serif}
.prow{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:8px 0;border-top:1px solid var(--line2)}
.nb{width:28px;height:28px;flex:0 0 28px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 13px Archivo,sans-serif}
.prow[aria-current="true"] .nb{background:var(--ink);color:var(--card)}
.prow .tx{flex:1} .prow small{display:block;font-size:.78rem;color:var(--sub)}
.poster h1{font:800 56px/.95 "Bricolage Grotesque",Archivo,sans-serif;letter-spacing:-1.5px;margin:0 0 14px}
.poster p{font-size:17px;line-height:1.5;color:var(--sub);max-width:46ch}
.ctl{border-top:1.5px solid var(--ink);padding:12px 0} .ctl .cs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px} .ctl .pill{min-height:36px}
</style>
</head>
<body>
<div class="wrap">
  <div class="app"><div class="sb"><span>9:41</span><i>●●● ▮</i></div>
    <div class="body"><div class="pane" id="p-map"></div>
      <div class="pane" id="p-regs"><div class="scroller" id="s-regs"></div></div>
      <div class="pane" id="p-gear"><div class="scroller" id="s-gear"></div></div>
      <div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <nav class="tabs" id="tabs" role="tablist"></nav></div>
  <div class="poster"><h1>Regs v9</h1>
    <p>Page v36’s card and tiles, at v36’s density, in the app’s style. Steelhead sits inside its trout and char group.
      Each fish in “What they look like” has its own picture. Lines marked data-src="design" are the answer key’s corrections.</p>
    <div class="ctl"><span class="sect">Water</span><div class="cs" id="c-w"></div></div>
    <div class="ctl"><span class="sect">Date</span><div class="cs" id="c-d"></div></div>
    <div class="ctl"><span class="sect">Theme</span><div class="cs" id="c-t"></div></div></div>
</div>
<script src="regs-mock/maps.js"></script>
<script src="regs-v9/data.js"></script>
<script src="regs-v9/fishart.js"></script>
<script src="regs-v9/v36plus.js"></script>
<script>
"use strict";
const SHORT = {vedder:['Mouth → Vedder Crossing','Above Vedder Crossing'], klwa:['Whole lake']};
const KCODES = Object.assign({'Brook, brown and cutthroat trout':['EB','GB','CT'],'Dolly Varden, bull trout and lake trout':['DV','LT'],
  'Rainbow trout':['RB'],'Steelhead':['ST'],'Cutthroat and rainbow trout':['CT','RB'],'Dolly Varden, bull trout':['DV'],'Brook, brown and lake trout':['EB','GB','LT']}, window.KCODES_EXTRA||{});
const TODAY = 1010, YEAR = 2026;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DIM = [31,28,31,30,31,30,31,31,30,31,30,31];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const S = {w:'vedder', v:'regs', part:0, d:TODAY, age:'adult', sheet:'', theme:'', scroll:0, pic:0, open:''};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmt = md => MON[Math.floor(md/100)-1] + ' ' + (md%100);
const wday = md => WD[new Date(YEAR, Math.floor(md/100)-1, md%100).getDay()];
const doy = md => DIM.slice(0, Math.floor(md/100)-1).reduce((a,b)=>a+b,0) + md%100;
const mdOf = n => { let m=0; while (n > DIM[m]) { n -= DIM[m]; m++; } return (m+1)*100+n; };
const W = () => WATERS[S.w];
const P = () => W().parts[S.part] || W().parts[0];
const dayWord = md => md === TODAY ? 'today' : 'on ' + fmt(md);
const dateLabel = md => (md === TODAY ? 'Today' : wday(md)) + ' · ' + fmt(md);
const SC = {k:'--open', c:'--closed', f:'--open'};
const DS = o => o && o.src === 'design' ? ` data-src="design" data-cite="${esc(o.cite||'')}"` : '';
const mk = i => (W().mapKey||[])[i] ?? i;
const shortOf = i => (W().short||SHORT[S.w]||[])[i] || W().parts[i].t;
function stripAt(part, md){ if (!part.strip) return null; let x = doy(md); for (const [s,n] of part.strip){ if (x <= n) return s; x -= n; } return null; }
function frame(){ return W().frames.find(f => f.p === S.part && S.d >= f.a && S.d <= f.b) || null; }
/* next open day: fly-only days count as open (round-3 fix) */
function nextOpen(part, md){ if (!part.strip) return null; for (let i=1;i<=365;i++){ const m = mdOf(((doy(md)-1+i)%365)+1); const s = stripAt(part,m); if (s === 'k' || s === 'f') return m; } return null; }
function closedRanges(part){ if (!part.strip) return []; let x=0; const out=[]; for (const [s,n] of part.strip){ if (s==='c') out.push([mdOf(x+1), mdOf(x+n)]); x+=n; } return out; }
const $ = id => document.getElementById(id);
function status(part = P(), md = S.d){
  const f = part === P() ? frame() : null, st = stripAt(part, md);
  if ((f && f.closed) || st === 'c') { const n = nextOpen(part, md); return {k:'closed', col:'--closed', word:'Closed', soon: n ? 'Opens ' + fmt(n) : ''}; }
  if (!st && !f) return {k:'unknown', col:'--sub', word:'No answer yet'};
  const c = closedRanges(part).map(([a]) => a).find(a => doy(a) > doy(md) && doy(a) - doy(md) <= 31);
  return {k:'open', col:'--open', word:'Open', fly: st === 'f', soon: c ? 'Closed from ' + fmt(c) : ''};
}
/* icons: icons.tsx */
const IC = {map:{f:['M3 3.5H21V20.5H3Z'], m:['M8 3.5V9L12.5 13.5V20.5','M17.5 3.5V7L12.5 13.5']}, search:{f:['M4 4.5H16V16.5H4Z'], m:['M16.5 17L21 21.5']},
  conditions:{f:['M3.5 19.5H21','M3.5 19.5V5'], m:['M3.5 15L8 10.5L12 14L16 6.5L21 11','M16 6.5V19.5']}, spots:{f:['M7 3.5H17V12.5H7Z'], m:['M12 12.5V20.5','M7.5 20.5H16.5']},
  regs:{f:['M5 3.5H19V20.5H5Z'], m:['M8.5 8.5H15.5','M8.5 12.5H15.5','M8.5 16.5H12.5']}, gear:{f:['M15 3.5H18.5'], m:['M15 3.5V15L11 19L7 15V11.5']}};
const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k].f.map(d => `<path d="${d}" stroke-width="1.8"/>`).join('')}${IC[k].m.map(d => `<path d="${d}" stroke-width="2.2"/>`).join('')}</svg>`;
const CHK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6.3 12.2 13.5 4.2"/></svg>';
const CHEV = '<svg viewBox="0 0 16 16" class="chev" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';

/* map */
function nums(d){ return (d.match(/-?\d+(\.\d+)?/g)||[]).map(Number); }
function midOf(d){ const n = nums(d), pts = []; for (let i=0;i+1<n.length;i+=2) pts.push([n[i],n[i+1]]); if (pts.length < 2) return pts[0];
  let L = 0; const seg = pts.slice(1).map((p,i) => { const l = Math.hypot(p[0]-pts[i][0], p[1]-pts[i][1]); L += l; return l; });
  let h = L/2; for (let i=0;i<seg.length;i++){ if (h <= seg[i]) { const t = seg[i] ? h/seg[i] : 0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t]; } h -= seg[i]; } return pts[pts.length-1]; }
function mapSvg(opts={}){
  const w = W(), g = (window.MAPS||{})[w.map].big, lake = w.kind === 'lake', ns = 'vector-effect="non-scaling-stroke"';
  let s = `<svg viewBox="0 0 390 740" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Map of ${esc(w.name)}"><rect x="-3000" y="-3000" width="7000" height="7000" fill="var(--land)"/><path d="${g.lakes}" fill="var(--lake)" fill-opacity=".45" fill-rule="evenodd"/>`;
  for (const [o,d] of Object.entries(g.streams)) s += `<path d="${d}" fill="none" stroke="var(--water)" stroke-opacity=".55" ${ns} stroke-width="${0.4+o*0.3}"/>`;
  s += lake ? `<path d="${g.target}" fill="var(--lake)" fill-opacity=".6" stroke="var(--ink)" ${ns} stroke-width="1"/>` : `<path d="${g.target}" fill="none" stroke="var(--ink)" stroke-opacity="${opts.dim?.25:.45}" ${ns} stroke-width="3"/>`;
  const pd = (g.parts||{})[String(mk(S.part))];
  if (pd && !opts.dim) { const st = status(); const col = `var(${st.col})`; s += lake ? `<path d="${pd}" fill="${col}" fill-opacity=".45" stroke="${col}" ${ns} stroke-width="2"/>` : `<path d="${pd}" fill="none" stroke="${col}" ${ns} stroke-width="5"/>`; }
  (g.marks||[]).forEach(m => { const r = m.xy[0] > 280; s += `<text x="${m.xy[0]+(r?-20:20)}" y="${m.xy[1]-18}" text-anchor="${r?'end':'start'}" font-size="12" font-weight="700" fill="var(--sub)" font-family="Archivo,sans-serif" paint-order="stroke" stroke="var(--land)" stroke-width="3">${esc(m.t)}</text>`; });
  const placed = [];
  if (w.parts.length > 1 && !opts.dim) w.parts.forEach((p,i) => { const d = (g.parts||{})[String(mk(i))]; if (!d) return; let [x,y] = midOf(d); const on = i === S.part;
    for (let n=0; n<6 && placed.some(([a,b]) => Math.hypot(a-x,b-y) < 30); n++) y -= 32; placed.push([x,y]);
    s += `<g class="mk-hit" data-part="${i}"><rect x="${x-22}" y="${y-22}" width="44" height="44" fill="transparent"/><rect x="${x-14}" y="${y-14}" width="28" height="28" fill="${on?'var(--ink)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x}" y="${y+4.6}" text-anchor="middle" font-size="13" font-weight="700" font-family="Archivo,sans-serif" fill="${on?'var(--card)':'var(--ink)'}">${i+1}</text></g>`; });
  return s + '</svg>';
}

/* shared header: water · part · date, then the compact numbered part strip */
function datePill(cls=''){ const a = status(); return `<button class="pill dp ${cls}" data-open="date" aria-label="Change date. Now ${dateLabel(S.d)}"><span class="dot" style="background:var(${a.col})"></span><span><em>Change date</em>${dateLabel(S.d)}</span></button>`; }
function hdrHtml(){
  const w = W(), n = w.parts.length;
  const rib = n < 2 ? '' : `<div class="ribbon"><button class="nav" ${S.part===0?'disabled':`data-part="${S.part-1}"`} aria-label="Downstream part">‹</button>
    <div class="segs" style="--cur:${n>3?6:3}">${w.parts.map((p,i) => { const st = stripAt(p, S.d), on = i === S.part;
      return `<button class="seg" aria-current="${on}" data-part="${i}" aria-label="Part ${i+1}: ${esc(shortOf(i))}"><i style="background:${st?`var(${SC[st]})`:'var(--line2)'}"></i>${i+1}${on?`<span>${esc(shortOf(i))}</span>`:''}</button>`; }).join('')}</div>
    <button class="nav" ${S.part===n-1?'disabled':`data-part="${S.part+1}"`} aria-label="Upstream part">›</button></div>`;
  return `<div class="hdr" id="hdr"><div class="bar"><button class="where" ${n>1?'data-open="part"':''}><b>${esc(w.short2||w.name)}</b>
    <small>${w.kind}${P().n?` · ${P().n} section${P().n>1?'s':''}`:''}${n>1?` · part ${S.part+1} of ${n}`:''}</small></button>${datePill()}</div>${rib}</div>`;
}
const PAT = {k:'var(--open)', c:'repeating-linear-gradient(135deg, var(--closed) 0 3px, color-mix(in srgb, var(--closed) 35%, var(--card)) 3px 6px)',
  f:'repeating-linear-gradient(90deg, var(--open) 0 4px, var(--card) 4px 6px)'};
function stripHtml(part){
  if (!part.strip) return '';
  const t = (doy(S.d)-0.5)/365*100, cur = Math.floor(S.d/100)-1, cl = closedRanges(part);
  let x = 0; const fw = []; part.strip.forEach(([s,n]) => { if (s === 'f') fw.push([mdOf(x+1), mdOf(x+n)]); x += n; });
  return `<button class="strip" data-strip aria-label="Open days this year"><div class="tw"><div class="bars">${part.strip.map(([s,n]) => `<span style="flex:${n};background:${PAT[s]}"></span>`).join('')}</div><i class="tick" style="left:${t}%"></i></div>
    <div class="mo">${MON.map((m,i) => i===cur?`<b>${m[0]}</b>`:`<span>${m[0]}</span>`).join('')}</div></button>
    <div class="key"><span><i style="background:${PAT.k}"></i>✓ open</span>${fw.length?`<span${DS(part.fwin)}><i style="background:${PAT.f};outline:1px solid var(--open)"></i>${esc(part.fwin.t)}</span>`:''}${cl.length?`<span><i style="background:${PAT.c}"></i>✕ closed: no fishing for any game fish</span>`:''}</div>`;
}
function verdictHtml(strip = true){
  const a = status();
  return `<div class="verd"><div class="vl"><span class="w" style="color:var(${a.col})">${a.k==='closed'?'✕ ':a.k==='open'?'✓ ':''}${a.word}</span><span class="d">${dayWord(S.d)}${a.fly?' · fly fishing only':''}</span>
    ${a.soon?`<span class="soon" style="color:var(${a.k==='closed'?'--open':'--closed'})">${esc(a.soon)}</span>`:''}</div>${strip?stripHtml(P()):''}</div>`;
}
function splitHtml(){
  const w = W(); if (!w.split) return '';
  const cell = (i, lbl) => { const a = status(w.parts[i]), txt = a.k === 'closed' ? 'closed' + (a.soon ? ', ' + a.soon.replace('Opens','opens') : '') : 'open' + (a.fly ? ', fly fishing only' : '');
    return `<button class="half ${a.k==='closed'?'hc':'ho'}" data-part="${i}" aria-current="${S.part===i}"><span class="hg">${a.k==='closed'?'✕':'✓'}</span><span><b>${lbl}</b>${esc(txt)}</span></button>`; };
  return `<div class="split"><p class="sect">This river is split at the ${esc(w.split.at)}${w.split.atNote?` <span${DS(w.split.atNote)}>(${esc(w.split.atNote.t)})</span>`:''}</p><div class="two">${cell(w.split.below,'Below it')}${cell(w.split.above,'Above it')}</div></div>`;
}

/* ===== Regulations: v36's card ===== */
function lookHtml(g, other){
  const codes = [...new Set(g.kinds.flatMap(k => KCODES[k.n] || []).concat(other.flatMap(([,o]) => o.which ? [] : (o.fish||[]))))].filter(c => PICS[c]);
  const art = o => window.FISHART ? FISHART.draw('RB', Object.assign({marks:false, adiMark:true}, o)) : '';
  const hatch = g.every.some(e => e.tell);
  return `<details class="look" ${S.open==='look'?'open':''}><summary>What they look like <span style="letter-spacing:0;text-transform:none;font-weight:600">· ${codes.length} fish</span></summary>
    ${hatch?`<div class="adi" id="adi"><figure>${art({})}<figcaption><b>Wild</b>adipose fin there</figcaption></figure><figure>${art({clipped:true})}<figcaption><b>Hatchery</b>fin clipped, a healed scar</figcaption></figure></div>
      <p>Look on the back, just in front of the tail. A small fin there means wild. If you can’t tell, treat it as wild.</p>`:''}
    ${codes.map(c => { const p = PICS[c][0], f = FISH[c] || {n:p.c, tips:[]};
      return `<div class="sp"><div class="im"><img src="${FISHDIR+p.f}" alt="${esc(p.c)}" loading="lazy"></div><div><b>${esc(f.n)}</b>${p.si?`<div class="si">Stand-in: ${esc(p.c)}</div>`:''}
        <ul>${f.tips.slice(0,3).map(t => `<li>${esc(t)}</li>`).join('')}</ul><div class="cr">${esc(p.cr)}</div></div></div>`; }).join('')}</details>`;
}
/* the group's one sentence (answers 2.5 group.says), shown compactly: "Up to N a day" + its sub-caps as chips */
function capsHtml(g){
  if (!g.says) return '';
  const [first, ...rest] = g.says.replace(/\.$/,'').split('; ');
  const m = /^Up to (\d+) (.+?) a day(?:, (.+))?$/.exec(first);
  const chips = [m && m[3], ...rest].filter(Boolean);
  return `<p class="cap1"><b>Up to ${m ? m[1] + ' ' + esc(m[2]) : g.total} a day</b></p>${chips.length?`<div class="caps">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}`;
}
function groupHtml(g, gi, other){
  let h = `<section class="grp"><div class="gh"><div style="flex:1;min-width:0"><h3>${esc(g.t)}</h3><span class="chip" style="margin-top:4px">${esc(g.scope)}</span></div>
    <div class="num"><b>${esc(String(g.total ?? g.big))}</b><em>${esc(g.unit)}</em></div></div><div class="gb">${capsHtml(g)}
    ${g.elsewhere?`<p class="els">${esc(g.elsewhere.says)}</p>${g.elsewhere.ask.length?`<div class="qa">${g.elsewhere.ask.map(([q,a]) => `<div>${esc(q)} <b>${esc(a)}</b></div>`).join('')}</div>`:''}`:(g.lead?`<p>${g.lead}</p>`:'')}
    ${g.every.map(e => `<div class="ln">${CHK}<span>${e.h}</span>${e.tell?`<button class="more" data-open="hatch">How to tell ›</button>`:''}</div>`).join('')}
    ${g.note?`<div class="ln sub"><span>${esc(g.note)}</span></div>`:''}</div>
    <div class="kh"><p class="sect">${esc(g.kindsHead||'Each kind')}</p></div>
    ${g.kinds.map((k,ki) => { const rel = k.v === 0;
      return `<button class="krow" data-open="fish:${gi}:${ki}"><span class="tx"><b>${esc(k.n)}</b>
        <span class="m"${DS(k.ofSrc)}>${rel?`<b class="rel" style="display:inline">${esc(k.rel)}</b>`:`${esc(k.verb||'Keep up to')} <b class="kn">${k.v}</b> ${esc(k.of==='a day'?'a day':k.of||'')}${(k.chips||[]).length?' · ':''}${esc((k.chips||[]).join(' · '))}`}</span>
        ${k.note?`<small>${esc(k.note)}</small>`:''}${k.extras?`<span class="ex">${esc(k.extras.join(' · '))}</span>`:''}</span>
        </span>${CHEV}</button>`; }).join('')}
    ${g.src && g.src.on ? `<button class="glink" data-open="src">See every regulation line ›</button>` : ''}</section>`;
  return h;
}
function renderRegs(){
  const f = frame(), a = status();
  let h = hdrHtml() + splitHtml() + verdictHtml();
  if (f && f.closed) h += `<div class="closedbox"><h3>Closed · opens again ${esc(f.closed.soon.replace('Opens ',''))}</h3><b>${esc(f.closed.d.replace(/ Together.*$/,''))}</b> Together these closures cover it:
      <ul>${f.closed.list.map(([t,s]) => `<li>${esc(t)} <small>${esc(s)}</small></li>`).join('')}</ul></div>`;
  else if (a.k === 'closed') h += `<div class="closedbox"><h3>Closed · ${esc(a.soon.replace('Opens','opens again'))}</h3>No fishing for any game fish.</div>`;
  else if (f && f.regs) {
    if (f.regs.times) h += f.regs.times.map(([t,now]) => `<div class="times"><b>${esc(t)}</b> · ${esc(now)}</div>`).join('');
    f.regs.groups.forEach((g, gi) => { h += groupHtml(g, gi, f.regs.other); });
    h += `<section class="oth"><h3>Other fish</h3>${f.regs.other.map(([n,o],oi) => `<button class="orow" data-open="${o.which?'prot':'other:'+oi}"><span>${esc(n)}</span>
      <span class="v ${o.cls==='closed'?'no':o.cls==='rel'?'rel':''}">${esc(o.word)}</span></button>`).join('')}</section>
      <section class="lookbox">${lookHtml({kinds:f.regs.groups.flatMap(g => g.kinds), every:f.regs.groups.flatMap(g => g.every)}, f.regs.other)}</section>
      <div class="fine"><p class="sect">Anywhere in B.C.</p>${ANYWHERE.map(t => `<p>${esc(t)}</p>`).join('')}<p>${esc(POSS[0])}</p></div>`;
  }
  $('s-regs').innerHTML = h + '<div style="height:16px"></div>';
}

/* ===== Gear & licence: v36's tiles; tap a tile for its sheet ===== */
function renderGear(){
  const f = frame(), a = status();
  let h = hdrHtml() + splitHtml() + verdictHtml(false);
  if (!f || !f.gear) { if (a.k === 'closed') h += `<p class="fine">No gear may go in the water and no licence is needed while fishing is closed.</p>`; $('s-gear').innerHTML = h; return; }
  const T = f.gear.tiles, u16 = S.age === 'u16';
  const tile = (k, l, v, s, cls='') => `<button class="kt ${cls}" data-open="tile:${k}"><span class="l">${l}</span><b>${v}</b><span>${s}</span></button>`;
  const bait = T.bait.items ? T.bait.items.map(([n,y]) => `<span class="bk ${y?'':'n'}">${esc(n)} ${y?'✓':'✕'}</span>`).join('') : esc(T.bait.s||'');
  h += `<div class="kgrid">${tile('licence','Licence', esc(u16?U16.tile.v:T.licence.v), esc(u16?U16.tile.s + ' · tap for residents and non-residents':T.licence.s))}
    ${tile('line','Line & hooks', esc(T.line.v), esc(T.line.s))}${tile('bait','Bait', esc(T.bait.v), bait)}${tile('ways','Ways to fish', esc(T.ways.v), esc(T.ways.s))}
    ${T.boats?tile('boats','Boats', esc(T.boats.v), esc(T.boats.s||'')):''}
    ${tile('always','Always', esc(T.always.v), 'Any fish snagged — even by accident — must be released. ' + esc(T.always.s), 'wide')}</div>`;
  $('s-gear').innerHTML = h;
}

/* ===== Map ===== */
function renderMap(){
  const w = W(), a = status(), open = S.v !== 'map0';
  let h = `<div class="mapsvg">${mapSvg({dim:!open})}</div><div class="m-tl">${datePill('float')}</div><div class="m-tr"><span>+</span><span>−</span></div>`;
  if (open) h += `<div class="place"><div class="grab"></div><div class="nm"><h2>${esc(w.name)}</h2><button class="x" data-close-water aria-label="Close">✕</button></div>
    ${w.split ? `<div style="margin:6px -16px 0">${splitHtml()}</div>` : `<button class="say" data-tab="regs"><span style="color:var(${a.col})">${a.k==='closed'?'✕':'✓'} ${a.word} ${dayWord(S.d)}</span>${w.parts.length>1?` · part ${S.part+1} of ${w.parts.length}: ${esc(shortOf(S.part))}`:''}</button>`}
    ${w.parts.length>1?`<div class="hint">Tap a numbered square to switch part.</div>`:''}</div>`;
  $('p-map').innerHTML = h;
}

/* ===== Sheets ===== */
function head(t, sub){ return `<div class="shead"><div class="grab"></div><div class="r"><h2>${t}</h2><button class="done" data-close>Done</button></div>${sub?`<p>${sub}</p>`:''}</div>`; }
const fold = (t, inner) => `<details class="fold"><summary>${esc(t)}</summary>${inner}</details>`;
const srcBlock = gs => `<div class="src">${gs.map(([hd, items]) => `<h5>${esc(hd)}</h5>${items.map(([t,tier,doc]) => `<p>${esc(t)}<small>${[tier,doc].filter(Boolean).map(esc).join(' · ')}</small></p>`).join('')}`).join('')}</div>`;
const marks = items => `<div class="gl">${items.map(([m,t,s]) => `<div class="r"><span class="v"><span class="mk ${m==='y'?'ok':'no'}">${m==='y'?'✓':'✕'}</span>${esc(t)}${s?`<small style="margin-left:18px">${esc(s)}</small>`:''}</span></div>`).join('')}</div>`;
function sheetHtml(k){
  const w = W(), f = frame();
  if (k === 'part') return head('Which part?', `Numbered from the mouth.`) + `<div class="sbody">${w.parts.map((p,i) => { const a = status(p);
    return `<button class="prow" aria-current="${i===S.part}" data-part="${i}"><span class="nb">${i+1}</span><span class="tx"><b>${esc(shortOf(i))}</b><small>${esc(p.t)}</small></span><span class="chip" style="color:var(${a.col})">${esc(a.word)}</span></button>`; }).join('')}</div>`;
  if (k === 'date') { const m = Math.floor(S.d/100);
    return head('Which day?', '') + `<div class="sbody"><div class="mgrid">${MON.map((x,i) => `<button aria-pressed="${i+1===m}" data-mon="${i+1}">${x}</button>`).join('')}</div>
      <div class="days"><button data-dd="-1">−</button><span class="d">${wday(S.d)} ${S.d%100}</span><button data-dd="1">+</button></div></div>`; }
  if (k === 'hatch') { const art = o => FISHART.draw('RB', Object.assign({marks:false, adiMark:true}, o));
    return head('Hatchery or wild?', 'The adipose fin') + `<div class="sbody big2"><figure>${art({})}<figcaption><b>Wild</b> · adipose fin there</figcaption></figure><figure>${art({clipped:true})}<figcaption><b>Hatchery</b> · clipped, a healed scar instead</figcaption></figure>
      <p>Look on the back, just in front of the tail. A small fin there means wild. Only a scar means hatchery. If you can’t tell, treat the fish as wild.</p></div>`; }
  if (k.startsWith('fish:') || k.startsWith('other:')) {
    let name, codes, lad, body;
    if (k.startsWith('fish:')) { const [, gi, ki] = k.split(':').map(Number), kd = f.regs.groups[gi].kinds[ki]; name = kd.n; codes = KCODES[kd.n]||[]; lad = kd.ladder;
      body = `<p style="font-weight:700;font-size:1.05rem;margin:0">${kd.v===0?esc(kd.rel):`${esc(kd.verb||'Keep up to')} ${kd.v} ${esc(kd.of||'a day')}`}</p><p style="margin:2px 0 0">${esc((kd.chips||[]).join(' · '))}</p>${kd.note?`<p class="ln sub">${esc(kd.note)}</p>`:''}${kd.extras?`<p style="font-weight:700">${esc(kd.extras.join(' · '))}</p>`:''}`; }
    else { const [n,o] = f.regs.other[+k.split(':')[1]]; name = n; codes = o.fish||[]; lad = o.ladder; body = `<p style="font-weight:700;font-size:1.05rem;margin:0" class="${o.cls==='closed'?'no':o.cls==='rel'?'rel':''}">${esc(cap(o.word))}</p>${o.say?`<p>${esc(o.say)}</p>`:''}${o.year&&o.year.say?`<p>${esc(o.year.say)}</p>`:''}`; }
    const pics = codes.flatMap(c => PICS[c]||[]), p = pics[Math.min(S.pic, pics.length-1)];
    return head(esc(name), '') + `<div class="sbody">${p?`<div class="pic"><img src="${FISHDIR+p.f}" alt=""></div>${pics.length>1?`<div class="segc">${pics.map((q,i) => `<button aria-pressed="${q===p}" data-pic="${i}">${esc(q.ph||q.c)}</button>`).join('')}</div>`:''}<div class="cred">${esc(p.cr)} · ${esc(p.s)}</div>`:''}
      <div class="ssec">${body}</div>
      ${lad?`<div class="ssec lad"><p class="sect">How this was decided</p><p style="font-weight:600">${esc(lad.ok.replace(/^✓\s*/,''))}</p>${lad.g.map(([who,items]) => `<div class="lv"><span class="who">${esc(who)}</span>${items.map(([t,l]) => `<div>${esc(t)}<small>${esc(l)}</small></div>`).join('')}</div>`).join('')}${lad.skip?`<div class="lv" style="opacity:.6"><span class="who">Not used here</span>${lad.skip.map(([t,l]) => `<div>${esc(t)}<small>${esc(l)}</small></div>`).join('')}</div>`:''}</div>`:''}</div>`;
  }
  if (k === 'prot') { const o = f.regs.other.find(([n]) => n === 'Protected species')[1];
    return head('Protected species', esc(o.say)) + `<div class="sbody"><ul class="tips">${o.which.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`; }
  if (k === 'src') { const src = f.regs.groups[0].src, li = arr => arr.map(([tier,t,where,eff]) => `<div class="lv"><span class="who">${esc(tier)}</span><div>${esc(t)}<small>${esc(where)} · ${esc(eff)}</small></div></div>`).join('');
    return head('Every regulation line', esc(src.sub)) + `<div class="sbody lad"><div class="ssec"><p class="sect">In force</p>${li(src.on)}</div><div class="ssec" style="opacity:.6"><p class="sect">Not used</p>${li(src.off)}</div></div>`; }
  if (k.startsWith('tile:')) { const t = k.slice(5), G = f.gear, u16 = S.age === 'u16';
    if (t === 'licence') return head('Licence', '') + `<div class="sbody"><div class="ssec" style="padding-top:8px"><p class="sect">Who is fishing?</p><div class="segc"><button aria-pressed="${!u16}" data-age="adult">16 or older</button><button aria-pressed="${u16}" data-age="u16">Under 16</button></div></div>
      ${u16 ? `<div class="ssec docs">${V9.u16.map(o => `<div class="d"${DS(o)}><span class="sect">${esc(o.who)}</span><b>${esc(o.head)}</b><span>${esc(o.body)}</span></div>`).join('')}</div>`
        : `<div class="ssec"><p class="sect">You need</p><div class="docs">${G.need.map(d => `<div class="d"><b>${esc(d.n)}</b><span>${esc(d.w)}</span><em>${esc(d.p)}</em></div>`).join('')}</div>
        <p style="font-size:.72rem;color:var(--faint)">Prices as printed for 2025–2027, before tax. Today’s prices: gov.bc.ca/fish-licence</p><div class="note">${G.record}</div></div>${fold('Where each one comes from', srcBlock(G.where))}`}
      ${fold('If you are guiding other anglers', `<div class="src"><p>${esc(GUIDING[0])}</p></div>`)}</div>`;
    if (t === 'line') return head('Line & hooks', '') + `<div class="sbody"><div class="gl">${G.lines.map(([l,v,s,tier]) => `<div class="r"><span class="k">${esc(cap(l.toLowerCase()))}</span><span class="v">${esc(v)}${s?`<small>${esc(s)}</small>`:''}</span></div>`).join('')}</div></div>`;
    if (t === 'bait') return head('Bait', G.baitNote ? esc(G.baitNote) : '') + `<div class="sbody">${marks(G.bait)}</div>`;
    if (t === 'ways') return head('Ways to fish', '') + `<div class="sbody"><div class="ssec"><p class="sect">Allowed</p>${marks(G.ways.yes.map(([a,b]) => ['y',a,b]))}</div><div class="ssec"><p class="sect">Not allowed</p>${marks(G.ways.no.map(a => ['n',a,'']))}</div></div>`;
    if (t === 'always') return head('Always', '') + `<div class="sbody"><div class="ssec"><p class="sect">When you catch a fish</p><p style="font-weight:700;margin:0">${esc(ALWAYS.duty)}</p></div>${ALWAYS.groups.map(([hd,items]) => `<div class="ssec"><p class="sect">${esc(hd)}</p><ul class="tips">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  }
  return '';
}

/* ===== render + events ===== */
function renderTabs(){
  const water = S.v !== 'map0';
  const tabs = water ? [['map','Map','map'],['regs','Regulations','regs'],['gear','Gear & licence','gear']] : [['map0','Map','map'],['search','Search','search'],['conditions','Conditions','conditions'],['pins','Spots','spots']];
  $('tabs').innerHTML = tabs.map(([k,t,ic]) => `<button role="tab" data-tab="${k}" aria-selected="${S.v===k}">${icon(ic)}<em>${esc(t)}</em><u></u></button>`).join('');
}
function mini(sc){ const h = sc && sc.querySelector('.hdr'); if (h) h.classList.toggle('mini', sc.scrollTop > 40); }
['s-regs','s-gear'].forEach(id => $(id).addEventListener('scroll', e => mini(e.target), {passive:true}));
function render(keep){
  const de = document.documentElement; if (S.theme) de.dataset.theme = S.theme; else delete de.dataset.theme;
  const pane = S.v === 'regs' ? 'regs' : S.v === 'gear' ? 'gear' : 'map';
  ['map','regs','gear'].forEach(p => $('p-'+p).classList.toggle('on', p === pane));
  const sc = $('s-'+pane), prev = sc ? sc.scrollTop : 0;
  ({regs:renderRegs, gear:renderGear, map:renderMap})[pane]();
  renderTabs();
  const sh = S.sheet ? sheetHtml(S.sheet) : ''; $('sheet').innerHTML = sh; $('sheet').classList.toggle('on', !!sh); $('scrim').classList.toggle('on', !!sh);
  if (sc) { sc.scrollTop = keep ? prev : S.scroll; mini(sc); }
  $('c-w').innerHTML = Object.entries(WATERS).map(([k,w]) => `<button class="pill ${S.w===k?'on':''}" data-cw="${k}">${esc(w.name)}</button>`).join('');
  $('c-d').innerHTML = [[1010,'Oct 10'],[1012,'Oct 12'],[515,'May 15'],[615,'Jun 15']].map(([d,l]) => `<button class="pill ${S.d===d?'on':''}" data-jump="${d}">${l}</button>`).join('');
  $('c-t').innerHTML = [['','Auto'],['light','Light'],['dark','Dark']].map(([k,t]) => `<button class="pill ${S.theme===k?'on':''}" data-ct="${k}">${t}</button>`).join('');
}
function go(o, keep){ Object.assign(S, o); if (!('scroll' in o)) S.scroll = 0; render(keep); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-open],[data-close],[data-part],[data-jump],[data-mon],[data-dd],[data-age],[data-pic],[data-close-water],[data-cw],[data-ct],[data-strip]');
  if (!t) { if (e.target === $('scrim')) go({sheet:''}, true); return; }
  const d = t.dataset;
  if (d.tab) return ['search','conditions','pins'].includes(d.tab) ? null : go({v:d.tab, sheet:''});
  if (d.open != null) return go({sheet:d.open, pic:0}, true);
  if (d.close != null) return go({sheet:''}, true);
  if (d.part != null) return go({part:+d.part, sheet:''}, true);
  if (d.jump) return go({d:+d.jump, sheet:''});
  if (d.mon) { const m = +d.mon; return go({d: m*100 + Math.min(S.d%100, DIM[m-1])}, true); }
  if (d.dd) return go({d: mdOf(((doy(S.d)-1 + +d.dd + 365) % 365) + 1)}, true);
  if (d.age) return go({age:d.age}, true);
  if (d.pic != null) return go({pic:+d.pic}, true);
  if (d.strip != null) { const r = t.querySelector('.bars').getBoundingClientRect(); return go({d: mdOf(Math.floor(Math.min(Math.max((e.clientX-r.left)/r.width,0),.999)*365)+1)}, true); }
  if (d.closeWater != null) return go({v:'map0'});
  if (d.cw) return go({w:d.cw, part:0, d:TODAY, sheet:''});
  if (d.ct != null) return go({theme:d.ct}, true);
});
(function(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('shot')) document.documentElement.classList.add('shot');
  if (h.get('tall')) document.documentElement.classList.add('tall');
  for (const [k,v] of h) if (k in S) S[k] = ['part','d','scroll','pic'].includes(k) ? +v : v;
  render();
})();
</script>
</body>
</html>
