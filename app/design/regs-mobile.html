<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regulations, Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* The app's own tokens — app/packages/ui-native/src/theme.ts, LIGHT. */
:root{
  --page:#EFEFEC; --card:#FFFFFF; --wash:#F7F7F5; --tint:#EEEFEB;
  --line:#E5E6E1; --line2:#D3D5CF; --ink:#15181C; --sub:#6C737A; --faint:#6E757B;
  --closed:#B33124; --restricted:#8f5c00; --open:#1D7741; --unknown:#74519C;
  --quiet:#8A9196; --accent:#5F26E0; --onAccent:#FFFFFF; --live:#04879B;
  --f-display:"Bricolage Grotesque",Georgia,serif;
  --f-text:"Archivo",-apple-system,Helvetica,Arial,sans-serif;
  --f-figure:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:var(--f-text);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.lab{max-width:1180px;margin:0 auto;padding:clamp(1rem,3vw,2.2rem)}
.lab h1{font-family:var(--f-display);font-size:clamp(1.7rem,4vw,2.4rem);margin:0;
  letter-spacing:-.02em;line-height:1.06}
.lab .eyebrow{font-family:var(--f-figure);font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .4rem}
.lab .lede{max-width:64ch;color:var(--sub);margin:.7rem 0 0;font-size:.98rem;line-height:1.55}
.rack{display:flex;gap:1.4rem;flex-wrap:wrap;align-items:flex-start;margin-top:1.6rem}
.col > h2{font-family:var(--f-display);font-size:1.05rem;margin:0 0 .2rem}
.col > p{font-size:.85rem;color:var(--sub);margin:0 0 .7rem;max-width:42ch;line-height:1.5}
/* ---------------- the phone ---------------- */
.phone{width:440px;max-width:100%;height:900px;background:var(--card);
  border:1px solid var(--line2);border-radius:10px;overflow:hidden;display:flex;
  flex-direction:column;box-shadow:3px 3px 0 rgba(21,24,28,.10)}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* header */
.back{font-family:var(--f-text);font-size:11px;font-weight:500;letter-spacing:.3px;
  color:var(--accent);padding:14px 18px 0;display:block}
.faces{display:flex;gap:8px;padding:8px 18px 0}
.face{font-family:var(--f-text);font-size:12.5px;font-weight:500;padding:7px 14px;
  border:1px solid var(--line2);background:var(--card);color:var(--sub);cursor:pointer}
.face[aria-selected=true]{border-color:var(--accent);background:var(--tint);color:var(--accent);
  font-weight:600}
.wtitle{font-family:var(--f-display);font-size:26px;line-height:29px;letter-spacing:-.6px;
  padding:8px 18px 0}
.wsub{font-family:var(--f-text);font-size:12.5px;line-height:18px;color:var(--sub);
  padding:4px 18px 0}
/* section heading — TYPE.section */
.sect{font-family:var(--f-text);font-weight:700;font-size:11px;line-height:14px;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);
  padding:14px 18px 3px;display:flex;justify-content:space-between;align-items:baseline}
.sect em{font-style:normal;font-family:var(--f-figure);letter-spacing:.5px;font-size:10px}
/* ---------------- the strip: position along the river ---------------- */
/* TWO CONTROLS, because they answer different questions.
   The strip is proportional and tells the truth about WHERE a stretch sits — on the Fraser
   that truth is a useless target, since one uniform stretch is 722 km and the shortest is
   1.1 km. So position is DRAWN proportionally and navigation is a separate row of equal
   boxes: a thumb is the same size whichever stretch it is reaching for. */
.strip{padding:9px 18px 0}
.strip .track{display:flex;height:13px;border:1px solid var(--line2)}
.strip .seg{min-width:1px}
.strip .ends{display:flex;justify-content:space-between;font-family:var(--f-figure);
  font-size:9.5px;color:var(--faint);padding-top:4px;letter-spacing:.4px}
.views{display:flex;gap:6px;padding:10px 18px 0}
.vw{flex:1;font-family:var(--f-text);font-size:12px;font-weight:500;padding:6px 8px;
  border:1px solid var(--line2);background:var(--card);color:var(--sub);cursor:pointer}
.vw[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--card);
  font-weight:600}
.picker{display:flex;gap:2px;padding:8px 18px 0;flex-wrap:wrap}
.pk{flex:1 1 0;min-width:16px;height:26px;border:1px solid var(--line2);background:var(--card);
  cursor:pointer;position:relative;padding:0;font-family:var(--f-figure);font-size:9.5px;
  color:var(--faint);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pk .fill{position:absolute;left:0;right:0;bottom:0;top:0}
.pk span{position:relative;z-index:1;padding-bottom:2px}
.pk[aria-pressed=true]{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:700}
.pkcap{font-family:var(--f-text);font-size:10.5px;line-height:14px;color:var(--faint);
  padding:5px 18px 0;margin:0}
/* ---------------- the map ---------------- */
.maprow{padding:10px 18px 0}
.mapbox{border:1px solid var(--line2);background:var(--wash);position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mapcap{font-family:var(--f-text);font-size:11px;color:var(--faint);padding-top:4px}
/* ---------------- stretch list ---------------- */
.stretch{display:flex;gap:9px;padding:10px 18px;border-top:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;
  cursor:pointer;font-family:inherit}
.stretch[aria-current=true]{background:var(--tint)}
.stretch .bar{width:4px;flex:none;align-self:stretch}
.stretch .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stretch .t{font-family:var(--f-text);font-weight:600;font-size:14.5px;line-height:21px}
.stretch .x{font-family:var(--f-text);font-size:12.5px;line-height:18px;color:var(--sub)}
/* status pill — StatusPill.tsx */
.pill{align-self:flex-start;display:inline-flex;align-items:center;padding:3px 10px}
.pill i{width:7px;height:7px;border-radius:2px;margin-right:6px;display:block}
.pill span{font-family:var(--f-text);font-size:11.5px;font-weight:700;letter-spacing:.5px}
/* ---------------- rules: ONE LINE each, detail on tap ----------------
   14 rules at 3 lines apiece is 900 px of scrolling for one stretch. Collapsed they are
   ~30 px each, so a whole regime fits on the screen and the eye can compare them. The
   things a reader scans — what it is, and whether it applies today — stay on the line;
   where and which species move behind the tap. */
.rule{display:block;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--line);padding:0;font-family:inherit;cursor:pointer}
.rule .hd{display:flex;gap:9px;align-items:baseline;padding:7px 18px}
.rule.off{opacity:.5}
.rule .ic{width:15px;flex:none;font-family:var(--f-text);font-size:13px;color:var(--sub);
  text-align:center}
.rule .rt{flex:1;min-width:0;font-family:var(--f-text);font-weight:600;font-size:13.5px;
  line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule .when{flex:none;font-family:var(--f-figure);font-size:9.5px;letter-spacing:.3px;
  color:var(--faint)}
.rule .when.now{color:var(--ink)}
.rule .more{padding:0 18px 9px 42px}
.rule .rl{font-family:var(--f-text);font-size:12.5px;line-height:18px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-family:var(--f-figure);font-size:10px;letter-spacing:.4px;padding:2px 6px;
  border:1px solid var(--line2);color:var(--faint);white-space:nowrap}
.tag.now{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tag.later{color:var(--restricted);border-color:var(--restricted)}
.tag.tr{color:var(--unknown);border-color:var(--unknown)}
/* toggle bar */
.toolbar{display:flex;align-items:center;gap:10px;padding:7px 18px;background:var(--wash);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:14px}
.toolbar label{display:flex;align-items:center;gap:8px;font-family:var(--f-text);
  font-size:12.5px;color:var(--sub);cursor:pointer}
.toolbar .n{margin-left:auto;font-family:var(--f-figure);font-size:10px;color:var(--faint);
  letter-spacing:.4px}
/* the from-another-water group */
.fromwater{border-top:1px solid var(--line);background:var(--wash)}
.fromwater .fh{display:flex;align-items:center;gap:8px;padding:10px 18px 0}
.fromwater .fh b{font-family:var(--f-text);font-weight:600;font-size:12.5px}
.fromwater .fh .via{font-family:var(--f-figure);font-size:10px;letter-spacing:.6px;
  color:var(--unknown);border:1px solid var(--unknown);padding:1px 5px}
.fromwater .why{font-family:var(--f-text);font-size:12.5px;line-height:18px;color:var(--sub);
  padding:8px 18px 12px}
.fromwater .rule{background:var(--card)}
/* verbatim */
.quote{margin:0 18px;border:1px solid var(--line2)}
.quote .qh{display:flex;justify-content:space-between;padding:6px 10px;background:var(--wash);
  border-bottom:1px solid var(--line);font-family:var(--f-figure);font-size:10px;
  letter-spacing:.5px;color:var(--faint)}
.quote pre{margin:0;padding:10px;font-family:var(--f-figure);font-size:11px;line-height:1.75;
  white-space:pre-wrap;color:var(--sub)}
.quote mark{background:#f7efe2;color:var(--ink)}
.cap{font-family:var(--f-text);font-size:12.5px;line-height:18px;color:var(--faint);
  padding:6px 18px 0}
/* tab bar */
.tabs{display:flex;border-top:1px solid var(--ink);background:var(--card)}
.tab{flex:1;text-align:center;padding:10px 0 12px;font-family:var(--f-text);font-size:10px;
  font-weight:500;letter-spacing:1.2px;color:var(--sub);position:relative}
.tab .g{display:block;font-size:16px;line-height:22px;color:var(--sub)}
.tab[aria-current=true]{color:var(--ink)}
.tab[aria-current=true] .g{color:var(--ink)}
.tab[aria-current=true]::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:6px;width:18px;height:2px;background:var(--ink)}
.empty{padding:14px 18px;color:var(--faint);font-size:12.5px}
</style></head><body>
<div class="lab">
  <p class="eyebrow">Prototype · mobile only · real bundle data</p>
  <h1>Regulations, in the app’s own clothes</h1>
  <p class="lede">440&nbsp;px, the app’s palette and type scale, its status pills and tab bar.
  Two navigations for the same river: a <b>position strip</b> you scrub, and a
  <b>map</b> you tap. Pick a river, tap anywhere on either.</p>

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("riverdata").textContent);
var TODAY={month:9,day:7};
var ICON={closure:"✕",harvest:"⚖",gear_restriction:"⚒",vessel_restriction:"⛵",
          licensing:"▣",note:"ⓘ"};
var MON=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var SEV={closure:3,vessel_restriction:2,gear_restriction:2,harvest:2,licensing:2,note:1};

function ord(w){return w.month*100+w.day;}
function inForce(ws){
  if(!ws||!ws.length) return true;
  var t=ord(TODAY);
  return ws.some(function(w){var a=ord(w.from),b=ord(w.to);
    return a<=b ? (t>=a&&t<=b) : (t>=a||t<=b);});
}
function winWord(ws){
  if(!ws||!ws.length) return "ALL YEAR";
  return ws.map(function(w){return MON[w.from.month]+" "+w.from.day+" – "+MON[w.to.month]+" "+w.to.day;})
    .join(", ").toUpperCase();
}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* outcome of a rule set, on the chosen day */
function outcome(rules){
  var live=rules.filter(function(r){return !r.uncertain && inForce(r.windows);});
  if(!live.length) return "open";
  var top=Math.max.apply(null,live.map(function(r){return SEV[r.kind]||1;}));
  return top===3?"closed":top===2?"restricted":"open";
}
var WORD={closed:"CLOSED",restricted:"RESTRICTED",open:"OPEN",unknown:"UNKNOWN"};

/*
 * RUNS ARE PER BLUE LINE, and adjacency means adjacency.
 *
 * Two things were wrong before. The section list is sorted by blue line then measure, and
 * the Fraser item spans 151 BLUE LINES — one mainstem of 87 sections carrying 84.6% of the
 * length, and 150 side channels and braids. So "next in the list" was not "next on the
 * water", and walking it produced 102 runs out of 16 rule sets, with the mainstem and its
 * side channels interleaved into nonsense.
 *
 * And a run must never join two stretches that are not touching. A rule set that appears at
 * km 40 and again at km 900 is TWO PLACES, however identical the rules; merging them into
 * "in 27 places along the river" describes a stretch that does not exist on the ground.
 *
 * Walking the mainstem alone, in measure order, the Fraser is 17 runs. That is a river you
 * can travel. The side channels are not a sequence at all and are not presented as one.
 */
function split(r){
  var km={};
  r.sections.forEach(function(s){ var b=s.id.split(":")[0]; km[b]=(km[b]||0)+(s.len||0); });
  var main=Object.keys(km).sort(function(a,b){ return km[b]-km[a]; })[0];
  var stem=r.sections.filter(function(s){ return s.id.split(":")[0]===main; })
    .sort(function(a,b){ return +a.id.split(":")[1] - +b.id.split(":")[1]; });
  var side=r.sections.filter(function(s){ return s.id.split(":")[0]!==main; });
  return {main:main, stem:stem, side:side};
}
function runsOf(r){
  var sp=split(r), out=[];
  sp.stem.forEach(function(s){
    if(out.length && out[out.length-1].set===s.set) out[out.length-1].secs.push(s);
    else out.push({set:s.set, secs:[s], side:false});
  });
  // Side channels: each blue line is its own piece, never merged with the mainstem and
  // never with each other.
  var byBlk={};
  sp.side.forEach(function(s){ var b=s.id.split(":")[0]; (byBlk[b]=byBlk[b]||[]).push(s); });
  Object.keys(byBlk).forEach(function(b){
    var g=byBlk[b].sort(function(a,c){ return +a.id.split(":")[1] - +c.id.split(":")[1]; });
    var cur=null;
    g.forEach(function(s){
      if(cur && cur.set===s.set) cur.secs.push(s);
      else { cur={set:s.set, secs:[s], side:true, blk:b}; out.push(cur); }
    });
  });
  out.forEach(function(run){
    run.km=run.secs.reduce(function(a,s){ return a+(s.len||0); },0)/1000;
    run.rules=(run.set==null?[]:r.rules[run.set])||[];
    run.out=run.set==null?"open":outcome(run.rules);
  });
  return out;
}
function coreOf(r){
  var ids=Object.keys(r.rules); if(!ids.length) return [];
  var key=function(x){return x.entry+"|"+x.details+"|"+x.kind;};
  var sets=ids.map(function(i){return new Set(r.rules[i].map(key));});
  return r.rules[ids[0]].filter(function(x){return sets.every(function(s){return s.has(key(x));});});
}

/* --------------------------------------------------------------- one phone */
function build(riverName, mount){
  var r=D[riverName];
  var runs=runsOf(r);
  var core=coreOf(r), ckey={}; core.forEach(function(x){ckey[x.entry+"|"+x.details+"|"+x.kind]=1;});
  // THE SELECTION IS A REGIME, NOT A RUN. A rule set can apply in several places along a
  // river — the Fraser's biggest covers 115 reaches in 27 separate runs — so highlighting
  // one run would hide the fact. Selecting a regime lights every run of it at once, which
  // is both the honest picture and the thing that makes the highlight readable.
  // A PLACE, not a rule set. Two stretches with the same rules in different parts of the
  // river are two answers to "where am I", and only one of them is where you are.
  var stem=runs.filter(function(x){ return !x.side; });
  var side=runs.filter(function(x){ return x.side; });
  var st={i:0, showOff:true, view:"river"};
  function cur(){ return runs[st.i]; }
  function idxOf(run){ return runs.indexOf(run); }
  var total=runs.reduce(function(a,x){return a+x.km;},0);

  var el=document.createElement("div"); el.className="phone";
  el.innerHTML='<div class="screen"></div>'
    +'<div class="tabs">'
    +'<div class="tab"><span class="g">▣</span>MAP</div>'
    +'<div class="tab" aria-current="true"><span class="g">◻</span>SEARCH</div>'
    +'<div class="tab"><span class="g">〰</span>CONDITIONS</div>'
    +'<div class="tab"><span class="g">⚑</span>SPOTS</div></div>';
  mount.appendChild(el);
  var screen=el.querySelector(".screen");

  /* ---- the map: OSM raster underneath, the river drawn on top ------------------
   *
   * WEB MERCATOR, not the equirectangular fudge the first version used. Raster tiles are
   * mercator, so anything else puts the river a few pixels off the water it is supposed to
   * be in — and at this size a few pixels is the whole channel.
   *
   * The line is SIMPLIFIED before drawing: at 404 px a 1,650 km river cannot show a meander,
   * and the extra vertices only make it look furry. Douglas-Peucker at a tolerance derived
   * from the pixel scale, so the simplification is of the DRAWING, not of the data.
   */
  var MW=404, MH=132, PAD=8;
  function merc(p, z){                       // lon/lat -> world pixels
    var s=256*Math.pow(2,z), la=p[1]*Math.PI/180;
    return [ (p[0]+180)/360*s,
             (1 - Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*s ];
  }
  /* SCOPED TO THE SELECTION, not the whole river.
   * A 1,650 km river in 404 px is 4 km per pixel, and the median run is 2.27 km — half a
   * pixel. There is no styling fix for that; the frame has to be smaller. Fitting the
   * chosen rule set instead puts it at a scale where it is a line you can see and tap, and
   * the rest of the river draws through it as grey context. */
  function fitPts(){
    // The CURRENT RUN, with a little of the river either side for context. Fitting the
    // whole rule set was wrong once selection became a place: set 234 appears at km 77 and
    // again at km 900, and framing both means framing the province.
    var sel=[];
    cur().secs.forEach(function(s){ s.pts.forEach(function(p){ sel.push(p); }); });
    if(sel.length<2) r.sections.forEach(function(s){ s.pts.forEach(function(p){ sel.push(p); }); });
    return sel;
  }
  /* View state: recomputed whenever the selection moves, because the frame follows it. */
  var allp, lo, hi, Z, c0, tiles;
  function recompute(){
    allp = fitPts();
    lo=[Math.min.apply(null,allp.map(function(p){return p[0];})),
        Math.min.apply(null,allp.map(function(p){return p[1];}))];
    hi=[Math.max.apply(null,allp.map(function(p){return p[0];})),
        Math.max.apply(null,allp.map(function(p){return p[1];}))];
    Z=1;
    for(var z=14; z>=1; z--){
      var q=merc(lo,z), w=merc(hi,z);
      if(Math.abs(w[0]-q[0])<=MW-2*PAD && Math.abs(w[1]-q[1])<=MH-2*PAD){ Z=z; break; }
    }
    c0=merc([(lo[0]+hi[0])/2,(lo[1]+hi[1])/2], Z);
    var sz=256, wx=c0[0]-MW/2, wy=c0[1]-MH/2, n=Math.pow(2,Z);
    tiles=[];
    for(var tx=Math.floor(wx/sz); tx<=Math.floor((wx+MW)/sz); tx++)
      for(var ty=Math.floor(wy/sz); ty<=Math.floor((wy+MH)/sz); ty++){
        if(ty<0||ty>=n) continue;
        tiles.push({x:((tx%n)+n)%n, y:ty, z:Z, px:tx*sz-wx, py:ty*sz-wy});
      }
  }
  function fx(p){ return MW/2 + (merc(p,Z)[0]-c0[0]); }
  function fy(p){ return MH/2 + (merc(p,Z)[1]-c0[1]); }
  recompute();
  /* Douglas-Peucker on SCREEN coordinates — the tolerance is in pixels, where it belongs. */
  function simplify(pts, tol){
    if(pts.length<3) return pts;
    var d2=function(p,a,b){
      var dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy;
      var t=L? ((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L : 0;
      t=Math.max(0,Math.min(1,t));
      var ex=a[0]+t*dx-p[0], ey=a[1]+t*dy-p[1];
      return ex*ex+ey*ey;
    };
    var keep=new Array(pts.length); keep[0]=keep[pts.length-1]=true;
    (function rec(i,j){
      var worst=-1, at=-1;
      for(var k=i+1;k<j;k++){ var d=d2(pts[k],pts[i],pts[j]); if(d>worst){worst=d;at=k;} }
      if(worst>tol*tol){ keep[at]=true; rec(i,at); rec(at,j); }
    })(0, pts.length-1);
    return pts.filter(function(_,i){ return keep[i]; });
  }

  function mapSvg(){
    recompute();
    var g=[], marker=null;
    tiles.forEach(function(t){
      g.push('<image href="https://tile.openstreetmap.org/'+t.z+'/'+t.x+'/'+t.y+'.png" '
        +'x="'+t.px.toFixed(1)+'" y="'+t.py.toFixed(1)+'" width="256" height="256" '
        +'opacity=".55"/>');
    });
    var here={}; cur().secs.forEach(function(s){ here[s.id]=1; });
    runs.forEach(function(run){
      run.secs.forEach(function(sec){
        var on=!!here[sec.id];
        if(sec.pts.length<2) return;
        var scr=simplify(sec.pts.map(function(p){return [fx(p),fy(p)];}), 0.8);
        if(scr.length<2) return;
        var d=scr.map(function(p,j){return (j?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join("");
        // A white casing under the coloured line, so the river reads against roads and
        // landcover instead of disappearing into them.
        if(on) g.push('<path d="'+d+'" fill="none" stroke="#fff" stroke-width="7" '
          +'stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>');
        g.push('<path d="'+d+'" fill="none" stroke="'+(on?"var(--"+run.out+")":"#5b6b74")+'"'
          +' stroke-width="'+(on?4:1.6)+'" stroke-opacity="'+(on?1:.55)+'"'
          +' stroke-linecap="round" stroke-linejoin="round" data-set="'+run.set+'"'
          +' style="cursor:pointer"/>');
        if(on && !marker){ var m=scr[Math.floor(scr.length/2)];
          marker='<circle cx="'+m[0].toFixed(1)+'" cy="'+m[1].toFixed(1)+'" r="6" '
            +'fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>'; }
      });
    });
    return '<svg viewBox="0 0 '+MW+' '+MH+'" role="img" aria-label="'+esc(r.name)
      +' on an OpenStreetMap background; the stretches under the chosen rule set are drawn '
      +'heavy and in colour, the rest thin and grey">'+g.join("")+(marker||"")+'</svg>';
  }

  /* ---- the position strip ---- */
  /* WHERE it is — proportional, honest, and not a target. */
  /* WHERE it is — proportional along the MAINSTEM only, and never a tap target. */
  function stripHtml(){
    var tot=stem.reduce(function(a,x){ return a+x.km; },0)||1, before=0, found=false;
    var h=stem.map(function(run){
      var on=run===cur();
      if(!found){ if(on) found=true; else before+=run.km; }
      return '<div class="seg" style="flex:'+Math.max(0.5,(run.km/tot)*100)
        +' 0 0;background:'+(on?"var(--ink)":"var(--line2)")+'"></div>';
    }).join("");
    var g=cur();
    return '<div class="track" role="img" aria-label="Where this stretch falls along the '
      +'mainstem">'+h+'</div>'
      +'<div class="ends"><span>▲ MOUTH</span><span>'
      +(g.side ? 'A SIDE CHANNEL'
               : 'KM '+before.toFixed(0)+'–'+(before+g.km).toFixed(0))
      +'</span><span>SOURCE ▲</span></div>';
  }

  /* WHICH one — equal targets. Stretch length runs 1.1 km to 722 km; a thumb does not. */
  function pickerHtml(){
    var h=stem.map(function(run,i){
      var on=run===cur();
      return '<button class="pk" data-i="'+idxOf(run)+'" aria-pressed="'+on+'"'
        +' title="'+run.km.toFixed(1)+' km, '+run.secs.length+' reaches">'
        +'<span class="fill" style="height:100%;background:var(--'+run.out+');'
        +'opacity:'+(on?.9:.28)+'"></span><span>'+(i+1)+'</span></button>';
    }).join("");
    return '<div class="picker" role="group" aria-label="Stretches, mouth to source">'
      +h+'</div>'
      +'<p class="pkcap">One box per stretch of the mainstem, mouth to source. Equal boxes, '
      +'because a 1 km stretch needs the same thumb as a 700 km one.</p>';
  }

  /* THE NON-SEQUENTIAL VIEW. Side channels leave the river and rejoin it — they are not a
     point on the walk upstream, and listing them in it is what made the Fraser unreadable. */
  function listHtml(){
    function row(run){
      var live=run.rules.filter(function(x){ return inForce(x.windows); }).length;
      return '<button class="stretch" data-i="'+idxOf(run)+'" aria-current="'+(run===cur())+'">'
        +'<span class="bar" style="background:var(--'+run.out+')"></span>'
        +'<span class="bd"><span class="t">'+(run.side
            ? 'Side channel · blue line '+esc(run.blk)
            : 'Stretch '+(stem.indexOf(run)+1)+' of '+stem.length)+'</span>'
        +'<span class="pill" style="background:var(--'+run.out+')22;color:var(--'+run.out+')">'
        +'<i style="background:var(--'+run.out+')"></i><span>'+WORD[run.out]+'</span></span>'
        +'<span class="x">'+run.km.toFixed(run.km<10?1:0)+' km · '+run.secs.length+' reach'
        +(run.secs.length>1?'es':'')+' · '+live+' of '+run.rules.length+' rules today</span>'
        +'</span></button>';
    }
    var blks={}; side.forEach(function(x){ blks[x.blk]=1; });
    var h='<div class="sect"><span>The mainstem</span><em>'+stem.length+' STRETCHES</em></div>'
      + stem.map(row).join("");
    if(side.length){
      h+='<div class="sect"><span>Side channels and braids</span><em>'+side.length
        +' PIECES</em></div>'
        +'<p class="pkcap">Not points on the walk upstream — they leave the river and rejoin '
        +'it, on '+Object.keys(blks).length+' separate blue lines.</p>'
        + side.slice(0,10).map(row).join("")
        + (side.length>10?'<p class="pkcap">…and '+(side.length-10)+' more.</p>':"");
    }
    return h;
  }

  var openRule={};
  function ruleRow(x, key){
    var on=inForce(x.windows);
    if(!on && !st.showOff) return "";
    var k=key+"|"+x.entry+"|"+x.details;
    var open=!!openRule[k];
    var extra=(x.location&&!/^Whole /.test(x.location)) || (x.species&&x.species.length);
    return '<button class="rule'+(on?"":" off")+'" data-rule="'+esc(k)+'">'
      +'<span class="hd"><span class="ic">'+(ICON[x.kind]||"ⓘ")+'</span>'
      +'<span class="rt">'+esc(x.details||x.kind)+'</span>'
      +'<span class="when'+(on?" now":"")+'">'+(on?winWord(x.windows):"NOT TODAY")+'</span>'
      +'</span>'
      +(open&&extra?'<span class="more">'
        +(x.location&&!/^Whole /.test(x.location)?'<span class="rl">'+esc(x.location)+'</span>':"")
        +'<span class="tags"><span class="tag'+(on?" now":" later")+'">'
        +(on?"IN FORCE TODAY":"NOT IN FORCE TODAY")+'</span>'
        +'<span class="tag">'+winWord(x.windows)+'</span>'
        +(x.species&&x.species.length?'<span class="tag">'+esc(x.species.join(", "))+'</span>':"")
        +'</span></span>':"")
      +'</button>';
  }

  function render(){
    var run=cur(), rules=run.rules;
    var here=rules.filter(function(x){return !ckey[x.entry+"|"+x.details+"|"+x.kind];});
    var reach=here.filter(function(x){return x.via==="reach";});
    var trib=here.filter(function(x){return x.via==="trib";});
    var byE={}; trib.forEach(function(x){(byE[x.entry]=byE[x.entry]||[]).push(x);});
    var live=rules.filter(function(x){return inForce(x.windows);}).length;
    var h=[];
    h.push('<a class="back">‹  Back</a>');
    h.push('<div class="faces"><button class="face">Conditions</button>'
      +'<button class="face" aria-selected="true">Regulations</button></div>');
    h.push('<div class="wtitle">'+esc(r.name)+'</div>');
    h.push('<div class="wsub">'+stem.length+' stretches on the mainstem · '+side.length
      +' side channels · '+total.toFixed(0)+' km</div>');

    h.push('<div class="views"><button class="vw" data-view="river" aria-pressed="'
      +(st.view==="river")+'">Along the river</button>'
      +'<button class="vw" data-view="list" aria-pressed="'+(st.view==="list")+'">'
      +'All stretches</button></div>');
    if(st.view==="list"){ h.push(listHtml()); screen.innerHTML=h.join(""); wire(); return; }
    h.push('<div class="sect"><span>Along the mainstem</span><em>MOUTH → SOURCE</em></div>');
    h.push('<div class="strip">'+stripHtml()+'</div>'+pickerHtml());
    h.push('<div class="maprow"><div class="mapbox">'+mapSvg()+'</div>'
      +'<div class="mapcap">Tap the river to jump. Map © OpenStreetMap contributors.</div></div>');

    h.push('<div class="sect"><span>'+(run.side?'A side channel'
      :'Stretch '+(stem.indexOf(run)+1)+' of '+stem.length)+'</span><em>'
      +run.secs.length+' REACH'+(run.secs.length>1?'ES':'')+' · '
      +run.km.toFixed(run.km<10?1:0)+' KM</em></div>');
    h.push('<div class="stretch" aria-current="true"><span class="bar" style="background:var(--'
      +run.out+')"></span><div class="bd">'
      +'<div class="t">'+(run.side?'A channel leaving and rejoining the river'
          :'One continuous stretch of the mainstem')+'</div>'
      +'<div class="pill" style="background:var(--'+run.out+')22;color:var(--'+run.out+')">'
      +'<i style="background:var(--'+run.out+')"></i><span>'+WORD[run.out]+'</span></div>'
      +'<div class="x">'+live+' of '+rules.length+' rules in force today</div></div></div>');

    h.push('<div class="toolbar"><label><input type="checkbox" id="tg-'+riverName.replace(/\W/g,"")
      +'"'+(st.showOff?" checked":"")+'> Show rules not in force today</label>'
      +'<span class="n">THU 7 SEP</span></div>');

    if(reach.length){
      h.push('<div class="sect"><span>Only on this stretch</span><em>'+reach.length+'</em></div>');
      h.push(reach.map(function(x){return ruleRow(x,"a");}).join("")||'<p class="empty">All hidden by the toggle.</p>');
    }
    Object.keys(byE).forEach(function(e){
      var en=r.entries[e]||{name:e};
      h.push('<div class="sect"><span>Reached from another water</span><em>'
        +byE[e].length+'</em></div>');
      h.push('<div class="fromwater"><div class="fh"><b>'+esc(en.name)
        +'</b><span class="via">VIA TRIBUTARY</span></div>'
        +byE[e].map(function(x){return ruleRow(x,"b");}).join("")
        +'<p class="why">Not written for '+esc(r.name)+'. This water joins <b>'+esc(en.name)
        +'</b>, whose entry is marked '
        +((en.symbols||[]).length?'“'+esc(en.symbols.join(", "))+'”':"as including tributaries")
        +', so its rules reach here.</p></div>');
    });
    /*
     * THE CORE SPLITS BY PROVENANCE TOO.
     *
     * First version put every rule common to all regimes under one "Everywhere on this
     * water" heading — and on the Chilliwack that is SIX RULES THAT ARE NOT WRITTEN FOR THE
     * CHILLIWACK. They arrive from the Chilliwack/Vedder entry by the tributary walk, and
     * folding them into a heading that says "this water" states the opposite of the truth.
     * Being common to every stretch and being written for this river are different facts.
     */
    var coreReach=core.filter(function(x){return x.via==="reach";});
    var coreTrib=core.filter(function(x){return x.via==="trib";});
    var coreByE={}; coreTrib.forEach(function(x){(coreByE[x.entry]=coreByE[x.entry]||[]).push(x);});
    if(coreReach.length){
      h.push('<div class="sect"><span>Everywhere on this water</span><em>'
        +coreReach.length+'</em></div>');
      h.push(coreReach.map(function(x){return ruleRow(x,"c");}).join("")||'<p class="empty">All hidden by the toggle.</p>');
    }
    Object.keys(coreByE).forEach(function(e){
      var en=r.entries[e]||{name:e};
      h.push('<div class="sect"><span>Everywhere here, from another water</span><em>'
        +coreByE[e].length+'</em></div>');
      // THE FULL CURATED NAME, not the display one. The entry behind the Chilliwack's six
      // trib rules is displayed as "Chilliwack River" and is actually "CHILLIWACK / VEDDER
      // RIVERS (does not include Sumas River)" — with the short name the sentence told the
      // river it joins itself.
      var who=(en.full||en.name||"").replace(/\s*\(see map[^)]*\)/i,"");
      h.push('<div class="fromwater"><div class="fh"><b>'+esc(en.name)
        +'</b><span class="via">VIA TRIBUTARY</span></div>'
        +coreByE[e].map(function(x){return ruleRow(x,"d");}).join("")
        +'<p class="why">None of these is written for '+esc(r.name)+' on its own. They belong '
        +'to the <b>'+esc(who)+'</b> entry, marked '
        +((en.symbols||[]).length?'“'+esc(en.symbols.join(", "))+'”':"as including tributaries")
        +', so all '+coreByE[e].length+' of its rules reach every part of this water.</p></div>');
    });
    if(!rules.length) h.push('<p class="empty">No rule is written for this stretch. '
      +'The regional and provincial rules still apply.</p>');

    var ent=r.entries[(rules[0]||{}).entry];
    if(ent&&ent.verbatim){
      var plain=String(ent.verbatim).replace(/\*\*/g,""), q=esc(plain);
      var first=(rules[0]||{}).text;
      if(first){
        var n=String(first).replace(/\*\*/g,"").trim().slice(0,64);
        var i=plain.indexOf(n);
        if(i>=0) q=esc(plain.slice(0,i))+"<mark>"+esc(plain.slice(i,i+n.length))+"</mark>"
          +esc(plain.slice(i+n.length));
      }
      h.push('<div class="sect"><span>The exact wording</span><em>2025–2027</em></div>');
      h.push('<div class="quote"><div class="qh"><span>'+esc((ent.name||"").slice(0,30).toUpperCase())
        +'</span><span>'+esc((ent.mus||[]).join(", "))+'</span></div><pre>'+q+'</pre></div>');
      h.push('<p class="cap">Quoted from the synopsis. The mark is the sentence the first rule '
        +'above was read from.</p>');
    }
    h.push('<div style="height:24px"></div>');
    screen.innerHTML=h.join("");
    wire();
  }

  function wire(){
    screen.querySelectorAll("[data-view]").forEach(function(n){
      n.addEventListener("click",function(){ st.view=n.getAttribute("data-view"); render(); });
    });
    screen.querySelectorAll("[data-i]").forEach(function(n){
      n.addEventListener("click",function(){ st.i=+n.getAttribute("data-i");
        st.view="river"; render(); });
    });
    screen.querySelectorAll("[data-rule]").forEach(function(n){
      n.addEventListener("click",function(ev){ ev.stopPropagation();
        var k=n.getAttribute("data-rule"); openRule[k]=!openRule[k]; render(); });
    });
    var t=screen.querySelector('input[type=checkbox]');
    if(t) t.addEventListener("change",function(){ st.showOff=t.checked; render(); });
  }
  render();
  return el;
}

var rack=document.getElementById("rack");
[["Fraser River","248 reaches, 16 rule sets — the navigation problem."],
 ["Chilliwack River","20 reaches, 3 rule sets — six of its seven rules arrive from another water."]]
 .forEach(function(pair){
  var col=document.createElement("div"); col.className="col";
  col.innerHTML='<h2>'+pair[0]+'</h2><p>'+pair[1]+'</p>';
  rack.appendChild(col);
  build(pair[0], col);
});
})();
</script>
</body></html>
