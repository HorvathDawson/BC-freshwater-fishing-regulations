<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regs v5</title>
<!-- v5 = v4b skeleton (answer first, slim bar, one sheet) + v4a's type, numbered parts, date pill and
     closed card. Words are page v36's (regs-v5/data.js). State in the hash:
     #w=vedder&v=regs&part=0&d=1010&sheet=part&age=u16&theme=dark&scroll=600&ts=2 (ts=2 → 200% text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* ---- riffle tokens, unchanged, plus one text token for limited/release words ---- */
:root{
  --page:#EFEFEC; --card:#FFFFFF; --wash:#F7F7F5; --tint:#EEEFEB;
  --line:#E5E6E1; --line-2:#D3D5CF;
  --ink:#15181C; --sub:#6C737A; --faint:#99A0A6;
  --land:#F3F0EA; --osm-water:#9CC2D6; --osm-lake:#AED3E2; --osm-label:#454B4E;
  --closed:#D81E1E; --limited:#C07200; --limited-text:#8F5500; --open:#0A8552; --unknown:#5F26E0; --quiet:#C3C8CD;
  --accent:#5F26E0; --on-accent:#FFFFFF;
  --lift:0 1px 2px rgba(21,24,28,.05), 0 10px 30px rgba(21,24,28,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0A0B0D; --card:#15181B; --wash:#101215; --tint:#1E2227;
    --line:#252A2F; --line-2:#343B42;
    --ink:#F0F2F0; --sub:#98A0A7; --faint:#6E767D;
    --land:#15181B; --osm-water:#35576B; --osm-lake:#24404F; --osm-label:#C7CDD1;
    --closed:#FF5340; --limited:#FFAE3D; --limited-text:#FFAE3D; --open:#2ADC8C; --unknown:#A97CFF; --quiet:#2F363D;
    --accent:#A97CFF; --on-accent:#100A22;
    --lift:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0A0B0D; --card:#15181B; --wash:#101215; --tint:#1E2227;
  --line:#252A2F; --line-2:#343B42;
  --ink:#F0F2F0; --sub:#98A0A7; --faint:#6E767D;
  --land:#15181B; --osm-water:#35576B; --osm-lake:#24404F; --osm-label:#C7CDD1;
  --closed:#FF5340; --limited:#FFAE3D; --limited-text:#FFAE3D; --open:#2ADC8C; --unknown:#A97CFF; --quiet:#2F363D;
  --accent:#A97CFF; --on-accent:#100A22;
  --lift:0 1px 2px rgba(0,0,0,.5), 0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
/* ---- one type ramp, rem on a 17 px base ----
   xl 32 verdict · l 20 group/sheet title · num 28 numeral · b 17 body/names · m 15 meta/subtitle
   s 13 units/footer · xs 12 eyebrow · xxs 11 credit                                              */
html{font-size:17px}
html.ts2{font-size:34px}
:root{--xl:1.882rem;--l:1.176rem;--num:1.647rem;--b:1rem;--m:.882rem;--s:.765rem;--xs:.706rem;--xxs:.647rem}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:var(--b)/1.45 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.bri{font-family:"Bricolage Grotesque",Archivo,sans-serif}
.eb{font-size:var(--xs);font-weight:600;color:var(--sub);margin:0 0 4px}
.rel{color:var(--limited-text)} .no{color:var(--closed)} .ok{color:var(--open)}

/* ---- frame ---- */
.wrap{max-width:1180px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:392px minmax(0,1fr);gap:72px;align-items:start}
.app{width:392px;height:846px;border:1px solid var(--line-2);border-radius:44px;background:var(--card);overflow:hidden;
  position:sticky;top:32px;display:flex;flex-direction:column;box-shadow:var(--lift)}
@media (max-width:520px){.wrap{display:block;padding:0}.app{width:100vw;height:100svh;border:0;border-radius:0;box-shadow:none;position:relative}.poster{display:none}}
.shot .wrap{display:block;padding:0}
.shot .app{width:390px!important;height:844px!important;border:0;border-radius:0;box-shadow:none;position:relative;top:0}
.shot .poster{display:none}
.sb{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font:700 15px Archivo,sans-serif;background:var(--card)}
.sb i{font-style:normal;font-size:11px;letter-spacing:.1em}
.body{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.pane{position:absolute;inset:0;display:none;background:var(--card)}
.pane.on{display:block}

/* ---- riffle tabs (chrome, px) ---- */
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);padding:6px 6px 14px;background:var(--card)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 6px;color:var(--faint);border-radius:12px}
.tabs svg{width:23px;height:23px;stroke-width:1.6;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tabs em{font:normal 600 11px Archivo,sans-serif}
.tabs button[aria-selected="true"]{color:var(--accent)}

/* ---- the one chip: date pill (44) and its small status form ---- */
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:1px solid var(--line-2);border-radius:999px;
  background:var(--card);padding:0 13px;font-size:var(--m);font-weight:600;white-space:nowrap;flex:0 0 auto}
.pill .dot,.stp .dot{width:8px;height:8px;border-radius:3px;flex:0 0 8px}
.pill i{font-style:normal;font-size:9px;color:var(--faint)}
.pill.float{box-shadow:var(--lift)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--tint)}
.stp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;
  font-size:var(--s);font-weight:600;white-space:nowrap;flex:0 0 auto}

/* ---- map ---- */
.mapsvg{position:absolute;inset:0}
.mapsvg svg{width:100%;height:100%;display:block}
.m-tl{position:absolute;left:14px;top:12px}
.m-tr{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:var(--lift)}
.m-tr span{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:18px}
.m-tr span+span{border-top:1px solid var(--line)}
.mk-hit{cursor:pointer}
.place{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line-2);box-shadow:var(--lift);padding:8px 20px 16px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 8px}
.place .nm{display:flex;align-items:center;gap:10px}
.place h2{margin:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--l);font-size:1.45rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;flex:1}
.x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 44px;margin-right:-8px}
.x span{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:13px}
.partbtn{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;font-size:var(--m);color:var(--sub)}
.partbtn b{color:var(--ink);font-weight:600;white-space:nowrap}
.partbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.partbtn i{font-style:normal;font-size:9px;color:var(--faint)}
.place .say{display:block;width:100%;font-size:var(--b);font-weight:600;line-height:1.35;padding:6px 0 0}
.place .hint{font-size:var(--s);color:var(--faint);margin-top:8px}
.place .go{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:8px;border-top:1px solid var(--line);font-size:var(--m);font-weight:600;color:var(--accent);width:100%}

/* ---- reader ---- */
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.bar{position:sticky;top:0;z-index:3;min-height:56px;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;padding:0 12px 0 8px;background:var(--card);border-bottom:1px solid transparent}
.bar.lined{border-bottom-color:var(--line)}
.where{flex:1 1 170px;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;padding:4px 8px 4px 12px;border-radius:12px}
.where:active{background:var(--wash)}
.where b{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--b);font-weight:600;letter-spacing:-.015em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{display:flex;gap:6px;align-items:center;font-size:var(--m);line-height:1.25;color:var(--sub);white-space:nowrap;min-width:0}
.where b .pn{font-family:Archivo,sans-serif;font-size:var(--m);font-weight:600;color:var(--sub);letter-spacing:0}
.where small i{font-style:normal;font-size:8.5px;color:var(--faint);flex:0 0 auto}
.where small span{overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---- the one card: verdict ---- */
.card{margin:4px 16px 0;border:1px solid var(--line-2);border-radius:16px;overflow:hidden;background:var(--card)}
.card .band{padding:18px 18px 16px}
.card .foot{border-top:1px solid var(--line);padding:10px 18px;font-size:var(--s);color:var(--sub)}
.verd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verd .w{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;font-size:var(--xl);line-height:1;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.verd .w i{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.verd .d{font-size:var(--b);font-weight:600;color:var(--sub)}
.verd .r{margin-left:auto;font-size:var(--m);font-weight:700}
.lead{margin:10px 0 0;font-size:var(--b);line-height:1.42;font-weight:500}
.strip{display:block;width:100%;margin-top:16px;padding:4px 0}
.strip .tw{position:relative}
.strip .bars{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.strip .bars span{display:block;height:100%}
.strip .tick{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--card);box-shadow:0 0 0 1.6px var(--ink);transform:translateX(-2px)}
.strip .mo{display:flex;justify-content:space-between;margin-top:6px;font-size:var(--xxs);font-weight:600;color:var(--faint)}
.strip .mo b{color:var(--ink)}

/* ---- plain riffle lists ---- */
.block{padding:20px 20px 4px}
.block+.block,.sep{border-top:1px solid var(--line);margin-top:16px}
.ghd{display:flex;align-items:flex-start;gap:12px}
.ghd h3{margin:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--l);font-weight:700;letter-spacing:-.025em;line-height:1.2}
.ghd p{margin:4px 0 0;font-size:var(--m);color:var(--sub);line-height:1.45}
.ghd p b{color:var(--ink);font-weight:600}
.ghd p .shr{color:var(--sub);min-height:32px;text-align:left}
.ghd p .shr span{color:var(--accent);font-weight:600;white-space:nowrap}
.num{flex:0 0 auto;min-width:64px;text-align:right;line-height:1}
.num b{display:block;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--num);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num em{display:block;font-style:normal;font-size:var(--s);font-weight:600;color:var(--sub);margin-top:4px}
.num .w{font-family:Archivo,sans-serif;font-size:var(--b);font-weight:700;letter-spacing:0}
.rows{margin-top:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .th{width:60px;height:38px;flex:0 0 60px;border-radius:9px;background:var(--wash);overflow:hidden;display:flex;align-items:center;justify-content:center}
.row .th img{width:100%;height:100%;object-fit:contain}
.row .th svg{width:22px;height:22px;fill:none;stroke:var(--sub);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row .th.ic{width:40px;flex-basis:40px;background:var(--tint)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:var(--b);font-weight:600;line-height:1.25}
.row .tx small{display:block;font-size:var(--m);color:var(--sub);line-height:1.35;margin-top:2px}
.chev{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:var(--sub);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.line{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 0;font-size:var(--m);line-height:1.45}
.line svg.i{width:16px;height:16px;flex:0 0 16px;margin-top:3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.line .ck{stroke:var(--open);stroke-width:2.4}
.line b{font-weight:600}
.line{flex-wrap:wrap}
.line > span{flex:1 1 180px;min-width:0}
.line .more{color:var(--accent);font-weight:600;white-space:nowrap;margin-left:auto;min-height:32px}
.ts2 .row .th{display:none}
.times{padding:12px 20px 0;color:var(--sub)}
.times b{color:var(--ink)}
.link{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:600;font-size:var(--m)}
.fine{padding:8px 20px 28px;font-size:var(--s);line-height:1.5;color:var(--sub)}
.fine p{margin:0 0 8px}

/* checklist rows (gear) */
.ck-row{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;padding:10px 0;border-top:1px solid var(--line)}
.ck-row:first-child{border-top:0}
.mk{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.mk svg{width:14px;height:14px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mk.y{background:color-mix(in srgb,var(--open) 14%,var(--card))} .mk.y svg{stroke:var(--open)}
.mk.n{background:color-mix(in srgb,var(--closed) 12%,var(--card))} .mk.n svg{stroke:var(--closed)}
.ck-row .tx{flex:1;min-width:0}
.ck-row b{display:block;font-size:var(--b);font-weight:600;line-height:1.3}
.ck-row small{display:block;font-size:var(--m);color:var(--sub);line-height:1.4;margin-top:2px}

/* ---- sheets ---- */
.scrim{position:absolute;inset:0;background:rgba(10,12,14,.34);display:none;z-index:10}
.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line-2);
  box-shadow:var(--lift);max-height:90%;display:flex;flex-direction:column;transform:translateY(101%);transition:transform .22s cubic-bezier(.2,.75,.3,1)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.shead{flex:0 0 auto;padding:8px 8px 4px 20px;touch-action:none;cursor:grab}
.shead .r{display:flex;align-items:center;gap:8px}
.shead h2{margin:0;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--l);font-weight:700;letter-spacing:-.025em;flex:1;line-height:1.2}
.done{min-width:44px;min-height:44px;padding:0 10px;color:var(--accent);font-weight:700;font-size:var(--b);text-align:center}
.shead p{margin:0 12px 4px 0;font-size:var(--m);color:var(--sub)}
.sbody{flex:1 1 auto;overflow:auto;padding:4px 20px 24px;overscroll-behavior:contain}
.sec{padding-top:16px}
.sbody p{margin:0 0 10px}

/* part sheet */
.pmap{height:180px;margin:6px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--line-2);background:var(--land)}
.pmap svg{width:100%;height:100%;display:block}
.prow{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;padding:10px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:12px}
.prow+.prow{border-top:1px solid var(--line);border-radius:0}
.prow[aria-current="true"]{background:var(--wash);border-radius:12px;border-top-color:transparent}
.prow[aria-current="true"] + .prow{border-top-color:transparent}
.nb{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 13px Archivo,sans-serif}
.prow[aria-current="true"] .nb{background:var(--ink);color:var(--card)}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:var(--b);font-weight:600;line-height:1.3}
.prow .tx small{display:block;font-size:var(--m);color:var(--sub);line-height:1.35;margin-top:2px}

/* date sheet */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mgrid button{border:1px solid var(--line-2);border-radius:11px;min-height:44px;font-weight:600;font-size:var(--m);text-align:center}
.mgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);color:var(--accent);font-weight:700}
.days{display:flex;align-items:center;gap:12px;margin-top:10px;border:1px solid var(--line-2);border-radius:13px;padding:4px 6px}
.days button{min-width:44px;min-height:44px;font-size:20px;border-radius:8px;color:var(--sub);text-align:center}
.days .d{flex:1;text-align:center;font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--l);font-weight:800}

/* segmented (riffle faces) */
.seg{display:flex;gap:4px;background:var(--tint);border-radius:12px;padding:3px;min-height:44px}
.seg button{flex:1;border-radius:9px;min-height:38px;font-size:var(--m);font-weight:600;color:var(--sub);text-align:center;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(21,24,28,.1)}

/* fish sheet */
.pic{margin:4px -20px 0;background:var(--wash);aspect-ratio:2/1;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:contain}
.cred{margin-top:8px;font-size:11px;color:var(--faint)}
.standin{margin-top:6px;font-size:var(--m);color:var(--sub)}
.standin b{color:var(--limited-text);font-weight:700;margin-right:4px}
.ans1{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-size:var(--l);font-weight:700;letter-spacing:-.02em;line-height:1.25}
.meta{font-size:var(--m);color:var(--sub);margin-top:4px}
.tips{margin:0;padding:0;list-style:none}
.tips li{padding:9px 0 9px 22px;border-top:1px solid var(--line);position:relative;font-size:var(--m)}
.tips li:first-child{border-top:0}
.tips li::before{content:"";position:absolute;left:4px;top:1.05em;width:6px;height:6px;border-radius:2px;background:var(--faint)}
.lad .lv{padding:10px 0;border-top:1px solid var(--line)}
.lad .lv .who{display:block;font-size:var(--s);font-weight:700;color:var(--sub);margin-bottom:3px}
.lad .lv div{font-size:var(--m);line-height:1.45}
.lad .lv div small{display:block;font-size:var(--s);color:var(--sub)}
.lad .lv div + div{margin-top:8px}
.dim{opacity:.6}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pgrid figure{margin:0}
.pgrid .im{aspect-ratio:2/1;background:var(--wash);border-radius:10px;overflow:hidden}
.pgrid img{width:100%;height:100%;object-fit:contain}
.pgrid figcaption{font-size:var(--s);line-height:1.35;margin-top:5px}
.pgrid figcaption small{display:block;color:var(--faint);font-size:11px}

/* licence sheet */
.doc{padding:12px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc b{display:block;font-size:var(--b);font-weight:600}
.doc span{display:block;font-size:var(--m);color:var(--sub);margin-top:2px}
.doc em{display:block;font-style:normal;font-size:var(--m);margin-top:4px;font-variant-numeric:tabular-nums}
.note{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--m);line-height:1.45}
details.fold{border-top:1px solid var(--line);margin-top:14px}
details.fold summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:var(--m);font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"›";margin-left:auto;color:var(--sub);font-size:18px;transform:rotate(90deg)}
details.fold[open] summary::after{transform:rotate(-90deg)}
.src p{font-size:var(--m);line-height:1.5;margin:8px 0}
.src p small{display:block;color:var(--sub);font-size:var(--s)}
.src h5{margin:12px 0 0;font-size:var(--s);color:var(--sub)}

.toast{position:absolute;left:16px;right:16px;bottom:16px;z-index:20;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 16px;font-size:var(--m);display:none}
.toast.on{display:block}

/* ---- poster ---- */
.poster h1{font-family:"Bricolage Grotesque",Archivo,sans-serif;margin:0 0 18px;font-size:clamp(40px,5vw,64px);font-weight:800;line-height:.95;letter-spacing:-.045em;max-width:14ch}
.poster .ledep{font-size:18px;line-height:1.5;max-width:46ch;color:var(--sub);margin:0 0 26px}
.ctl{border-top:1px solid var(--line-2);padding:14px 0}
.ctl .cs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ctl .pill{min-height:36px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="app" id="app">
    <div class="sb"><span>9:41</span><i>●●● ▮</i></div>
    <div class="body" id="body">
      <div class="pane" id="p-map"></div>
      <div class="pane" id="p-regs"><div class="scroller" id="s-regs"></div></div>
      <div class="pane" id="p-gear"><div class="scroller" id="s-gear"></div></div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      <div class="toast" id="toast"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
  <div class="poster">
    <h1>Regs v5</h1>
    <p class="ledep">The v4b skeleton with v4a’s type, numbered parts and closed card. All the words come from page v36.</p>
    <div class="ctl"><span class="eb">Water</span><div class="cs" id="c-w"></div></div>
    <div class="ctl"><span class="eb">Screen</span><div class="cs" id="c-v"></div></div>
    <div class="ctl"><span class="eb">Theme and text size</span><div class="cs" id="c-t"></div></div>
  </div>
</div>

<script src="regs-mock/maps.js"></script>
<script src="regs-v5/data.js"></script>
<script>
"use strict";
/* Short part labels for the bar (the full legal text stays in the part sheet). */
const SHORT = {
  vedder:['Mouth → Vedder Crossing','Above Vedder Crossing'],
  klwa:['Whole lake'],
  cowichan:['Mouth → CNR Trestle','CNR Trestle → CNR Bridge','CNR Bridge → Greendale','Greendale → lake outlet','Side channel'],
};
const KCODES = {'Brook, brown and cutthroat trout':['EB','GB','CT'],'Dolly Varden, bull trout and lake trout':['DV','LT'],
  'Rainbow trout':['RB'],'Steelhead':['ST'],'Cutthroat and rainbow trout':['CT','RB'],'Dolly Varden, bull trout':['DV'],
  'Brook, brown and lake trout':['EB','GB','LT']};
const TODAY = 1010, YEAR = 2026;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DIM = [31,28,31,30,31,30,31,31,30,31,30,31];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const S = {w:'vedder', v:'regs', part:0, d:TODAY, age:'adult', sheet:'', theme:'', scroll:0, pic:0, ts:0};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip_ = s => String(s||'').replace(/<[^>]+>/g,'');
const fmt = md => MON[Math.floor(md/100)-1] + ' ' + (md%100);
const wday = md => WD[new Date(YEAR, Math.floor(md/100)-1, md%100).getDay()];
const doy = md => DIM.slice(0, Math.floor(md/100)-1).reduce((a,b)=>a+b,0) + md%100;
const mdOf = n => { let m=0; while (n > DIM[m]) { n -= DIM[m]; m++; } return (m+1)*100+n; };
const W = () => WATERS[S.w];
const P = () => W().parts[S.part] || W().parts[0];
const dayWord = md => md === TODAY ? 'today' : 'on ' + fmt(md);
const dateLabel = md => (md === TODAY ? 'Today' : wday(md)) + ' · ' + fmt(md);
const SC = {k:'--open', c:'--closed', r:'--limited'};
function stripAt(part, md){ if (!part.strip) return null; let x = doy(md); for (const [s,n] of part.strip){ if (x <= n) return s; x -= n; } return null; }
function frame(){ return W().frames.find(f => f.p === S.part && S.d >= f.a && S.d <= f.b) || null; }
function nextOpen(part, md){ if (!part.strip) return null; for (let i=1;i<=365;i++){ const m = mdOf(((doy(md)-1+i)%365)+1); if (stripAt(part,m)==='k') return m; } return null; }
const $ = id => document.getElementById(id);
const tint = (v,a) => `color-mix(in srgb, var(${v}) ${Math.round(a*100)}%, var(--card))`;

/* The verdict sentence: the shared total exactly as the card states it, never a sum of per-kind maxima.
   "Keep 2 trout and char a day" = group.big + group.t + group.unit; the qualifier is the group's first
   "for every kind" line; a timed rule in force today adds its own words ("Kokanee today: 5 a day").   */
function answer(){
  const f = frame(), p = P();
  if (f && f.closed) return {k:'closed', col:'--closed', word:'Closed', line:f.closed.d.replace(/ Together.*$/,''), right:f.closed.soon};
  if (f && f.regs) {
    const parts = f.regs.groups.map(g => {
      const q = (g.every||[]).map(e => strip_(e.h)).find(t => /^Hatchery only/.test(t));
      return `Keep ${g.big} ${g.t.toLowerCase()} ${g.unit}` + (q ? ` · ${q.split(',')[0].toLowerCase()}` : '');
    });
    (f.regs.times||[]).forEach(([t, now]) => { const m = /^today \([^)]*\):\s*(.*)$/.exec(now); const fish = t.split(':')[0];
      if (m) parts.push(`${fish} today: ${m[1]}`); });
    return {k:'open', col:'--open', word:'Open', line:parts.join('. ') + '.'};
  }
  const st = stripAt(p, S.d);
  if (st === 'c') { const n = nextOpen(p, S.d); return {k:'closed', col:'--closed', word:'Closed', line:'No fishing for any game fish.', right: n ? 'Opens '+fmt(n) : ''}; }
  if (st === 'k') return {k:'open', col:'--open', word:'Open', line:''};
  return {k:'unknown', col:'--sub', word:'No answer yet', line:'We don’t have this part’s rules yet.'};
}

/* =============================== icons =============================== */
const ICON = {
  map:'<path d="M2.5 5.5 8 3l7 2.5 5.5-2.5v15L15 20.5 8 18l-5.5 2.5Z"/><path d="M8 3v15"/><path d="M15 5.5v15"/>',
  search:'<circle cx="10.5" cy="10.5" r="7"/><path d="M15.6 15.6 20.5 20.5"/>',
  conditions:'<path d="M2.5 15c2.4 0 2.4-3 4.8-3s2.4 3 4.8 3 2.4-3 4.8-3 2.4 3 4.6 3"/><path d="M2.5 8.5c2.4 0 2.4-3 4.8-3s2.4 3 4.8 3 2.4-3 4.8-3 2.4 3 4.6 3"/>',
  pins:'<path d="M11.5 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="11.5" cy="10" r="2.6"/>',
  regs:'<path d="M5.5 2.5h8.5l3.5 3.5v14.5h-12Z"/><path d="M14 2.5V6h3.5"/><path d="M8.5 10.5h6M8.5 14h6M8.5 17.5h3.5"/>',
  gear:'<path d="M14.5 2.5v11a4.5 4.5 0 0 1-9 0v-2.2"/><path d="M5.5 11.3 3.2 13.6"/><path d="M14.5 2.5h3"/>',
  ways:'<path d="M3.5 20.5 18 6"/><path d="M18 6c1.5 2 2 5 2 8"/><path d="M20 14v3"/><circle cx="20" cy="18.2" r="1.2"/>',
  always:'<path d="M12 2.8 4.5 5.8v5.6c0 4.5 3.2 8 7.5 9.8 4.3-1.8 7.5-5.3 7.5-9.8V5.8Z"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8"/>',
  fish:'<path d="M3 12c3-4.5 9-5.5 13-1.8L20 7.5v9l-4-2.7C12 17.5 6 16.5 3 12Z"/><circle cx="7.5" cy="11.3" r=".6"/>',
};
const SMALL = {clock:'<circle cx="8" cy="8" r="6.3"/><path d="M8 4.6V8l2.3 1.5"/>', check:'<path d="M3 8.4 6.4 11.6 13 4.6"/>',
  cross:'<path d="M4 4l8 8M12 4l-8 8"/>', info:'<circle cx="8" cy="8" r="6.3"/><path d="M8 7.2v4"/><path d="M8 4.9v.1"/>'};
const svg = k => `<svg viewBox="0 0 23 23" aria-hidden="true">${ICON[k]}</svg>`;
const ico = (k, cls='i') => `<svg viewBox="0 0 16 16" class="${cls}" aria-hidden="true">${SMALL[k]}</svg>`;
const CHEV = '<svg viewBox="0 0 16 16" class="chev" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';

/* =============================== maps =============================== */
function nums(d){ return (d.match(/-?\d+(\.\d+)?/g)||[]).map(Number); }
function bbox(d){ const n = nums(d); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (let i=0;i+1<n.length;i+=2){ x0=Math.min(x0,n[i]); x1=Math.max(x1,n[i]); y0=Math.min(y0,n[i+1]); y1=Math.max(y1,n[i+1]); } return [x0,y0,x1,y1]; }
function midOf(d){ const n = nums(d), pts = []; for (let i=0;i+1<n.length;i+=2) pts.push([n[i],n[i+1]]); if (pts.length < 2) return pts[0];
  let L = 0; const seg = pts.slice(1).map((p,i) => { const l = Math.hypot(p[0]-pts[i][0], p[1]-pts[i][1]); L += l; return l; });
  let h = L/2; for (let i=0;i<seg.length;i++){ if (h <= seg[i]) { const t = seg[i] ? h/seg[i] : 0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t]; } h -= seg[i]; } return pts[pts.length-1]; }
/* which: 'big' (map tab) or 'thumb' (part sheet, w×h px). Numbered markers at each part's middle. */
function mapSvg(which, opts={}){
  const w = W(), M = (window.MAPS||{})[w.map]; if (!M) return '';
  const g = M[which], big = which === 'big', lake = w.kind === 'lake', many = w.parts.length > 1;
  let vb, k = 1;
  if (big) vb = [0,0,390,740];
  else { const [x0,y0,x1,y1] = bbox(g.target), A = opts.w/opts.h; let cx=(x0+x1)/2, cy=(y0+y1)/2, ww=Math.max(x1-x0,40)*1.25, hh=Math.max(y1-y0,30)*1.4;
    if (ww/hh > A) hh = ww/A; else ww = hh*A; vb = [cx-ww/2, cy-hh/2, ww, hh]; k = vb[2]/opts.w; }
  const ns = 'vector-effect="non-scaling-stroke"';
  let s = `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="${big?'xMidYMin slice':'xMidYMid meet'}" role="img" aria-label="Map of ${esc(w.name)}">`;
  s += `<rect x="-3000" y="-3000" width="7000" height="7000" fill="var(--land)"/><path d="${g.lakes}" fill="var(--osm-lake)" fill-rule="evenodd"/>`;
  for (const [o,d] of Object.entries(g.streams)) s += `<path d="${d}" fill="none" stroke="var(--osm-water)" ${ns} stroke-width="${big?(0.5+o*0.32):(0.4+o*0.18)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (lake) s += `<path d="${g.target}" fill="var(--osm-lake)" stroke="var(--ink)" stroke-opacity=".35" ${ns} stroke-width="1"/>`;
  else s += `<path d="${g.target}" fill="none" stroke="var(--ink)" stroke-opacity="${opts.dim?.2:.28}" ${ns} stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const pd = (g.parts||{})[String(S.part)] || '';
  if (pd && !opts.dim) { const st = stripAt(P(), S.d), col = st ? `var(${SC[st]})` : 'var(--ink)';
    if (lake) s += `<path d="${pd}" fill="${col}" fill-opacity=".35" stroke="${col}" ${ns} stroke-width="2"/>`;
    else s += `<path d="${pd}" fill="none" stroke="${col}" ${ns} stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`; }
  if (big) (g.marks||[]).forEach(m => { const r = m.xy[0] > 280;
    s += `<text x="${m.xy[0]+(r?-18:18)}" y="${m.xy[1]-16}" text-anchor="${r?'end':'start'}" font-size="12" font-weight="700" fill="var(--osm-label)" font-family="Archivo,sans-serif" paint-order="stroke" stroke="var(--land)" stroke-width="3">${esc(m.t)}</text>`; });
  const placed = [];
  if (many && !opts.dim) w.parts.forEach((p,i) => { const d = (g.parts||{})[String(i)]; if (!d) return; let [x,y] = midOf(d); const on = i === S.part;
    for (let n=0; n<6 && placed.some(([a,b]) => Math.hypot(a-x,b-y) < 30*k); n++) y -= 32*k;
    placed.push([x,y]);
    s += `<g class="mk-hit" data-part="${i}" role="button" aria-label="Part ${i+1}"><circle cx="${x}" cy="${y}" r="${22*k}" fill="transparent"/>
      <circle cx="${x}" cy="${y}" r="${14*k}" fill="${on?'var(--ink)':'var(--card)'}" stroke="var(--ink)" stroke-width="${1.6*k}"/>
      <text x="${x}" y="${y+4.6*k}" text-anchor="middle" font-size="${13*k}" font-weight="700" font-family="Archivo,sans-serif" fill="${on?'var(--card)':'var(--ink)'}">${i+1}</text></g>`; });
  return s + '</svg>';
}

/* =============================== shared bits =============================== */
function stripHtml(part){
  if (!part.strip) return '';
  const t = (doy(S.d)-0.5)/365*100, cur = Math.floor(S.d/100)-1;
  return `<button class="strip" data-strip aria-label="Open days this year; tap to pick a day">
    <div class="tw"><div class="bars">${part.strip.map(([s,n]) => `<span style="flex:${n};background:var(${SC[s]})"></span>`).join('')}</div><i class="tick" style="left:${t}%"></i></div>
    <div class="mo">${MON.map((m,i) => i===cur?`<b>${m[0]}</b>`:`<span>${m[0]}</span>`).join('')}</div></button>`;
}
const shortOf = i => (SHORT[S.w]||[])[i] || W().parts[i].t;
function datePill(cls=''){ const a = answer();
  return `<button class="pill ${cls}" data-open="date" aria-label="Day: ${dateLabel(S.d)}, ${a.word}"><span class="dot" style="background:var(${a.col})"></span>${dateLabel(S.d)}</button>`; }
function barHtml(){
  const w = W(), one = w.parts.length === 1;
  return `<div class="bar" id="bar">
    <button class="where" ${one?'aria-disabled="true"':'data-open="part"'} aria-label="${esc(w.name)}: ${one?'':'part '+(S.part+1)+' of '+w.parts.length+', change part'}">
      <b>${esc(w.short||w.name)}${one?'':`<span class="pn"> · Part ${S.part+1} of ${w.parts.length}</span>`}</b>
      <small><span>${esc(shortOf(S.part))}</span>${one?'':'<i>▼</i>'}</small></button>
    ${datePill()}</div>`;
}
function heroHtml(withStrip=true){
  const w = W(), a = answer();
  const foot = [w.region ? 'Region ' + w.region.replace(/\D/g,'') : '', w.kind.charAt(0).toUpperCase()+w.kind.slice(1)].filter(Boolean).join(' · ');
  return `<section class="card"><div class="band" style="background:${tint(a.col,.09)}">
    <div class="verd"><span class="w" style="color:var(${a.col})"><i style="background:var(${a.col})"></i>${a.word}</span><span class="d">${a.k==='unknown'?'':dayWord(S.d)}</span>
      ${a.right?`<span class="r" style="color:var(--open)">${esc(a.right)}</span>`:''}</div>
    ${a.line?`<p class="lead">${esc(a.line)}</p>`:''}${withStrip?stripHtml(P()):''}</div>
    <div class="foot">${esc(foot)}</div></section>`;
}
function timesHtml(){
  const f = frame(); if (!f || !f.regs || !f.regs.times) return '';
  return f.regs.times.map(([t,now]) => `<div class="times"><div class="line">${ico('clock')}<span>At certain times: <b>${esc(t)}</b></span></div></div>`).join('');
}
function thumb(codes){
  const pic = (codes||[]).map(c => (PICS[c]||[])[0]).find(Boolean);
  return pic ? `<span class="th"><img src="${FISHDIR+pic.f}" alt="" loading="lazy"></span>` : `<span class="th">${svg('fish')}</span>`;
}

/* =============================== REGULATIONS =============================== */
function renderRegs(){
  const f = frame();
  let h = barHtml() + heroHtml() + timesHtml();
  if (f && f.closed) {
    h += `<section class="block"><p class="eb">Why it’s closed</p><div class="rows">${f.closed.list.map(([t,src]) =>
      `<div class="row"><span class="tx"><b>${esc(t)}</b><small>${esc(src)}</small></span></div>`).join('')}</div>
      <button class="link" data-jump="${f.closed.reopen[0]}">See the rules from ${fmt(f.closed.reopen[0])} ›</button></section>`;
  } else if (f && f.regs) {
    f.regs.groups.forEach((g, gi) => { h += groupHtml(g, gi); });
    h += `<section class="block"><p class="eb">Other fish</p><div class="rows">${f.regs.other.map(([n,o],oi) => otherRow(n,o,oi)).join('')}</div></section>`;
    h += `<div class="fine sep" style="padding-top:16px"><p>Anywhere in B.C.: ${ANYWHERE.map(esc).join('. ')}.</p><p>${esc(POSS[0])}</p>
      <button class="link" data-open="src">Every regulation line ›</button></div>`;
  } else h += `<div style="height:24px"></div>`;
  $('s-regs').innerHTML = h;
}
function groupHtml(g, gi){
  const m = /^<b>(.*?)<\/b>\s*(.*)$/.exec(g.lead) || [0, strip_(g.lead), ''];
  let h = `<section class="block"><div class="ghd"><div style="flex:1;min-width:0"><h3>${esc(g.t)}</h3>
      <p><b>${m[1]}</b> ${m[2]?`<button class="shr" data-open="share:${gi}">${esc(m[2].replace(/\.$/,''))}. <span>More ›</span></button>`:''}</p></div>
    <div class="num"><b style="font-size:2.1rem">${esc(g.big)}</b><em>${esc(g.unit)}</em></div></div>`;
  h += `<div style="margin-top:6px">${g.every.map(e => `<div class="line">${ico('check','i ck')}<span>${e.h}</span>${e.tell?`<button class="more" data-open="fish:g${gi}k${g.kinds.findIndex(k=>k.n==='Steelhead')}">How to tell ›</button>`:''}</div>`).join('')}</div>`;
  h += `<div class="rows">${g.kinds.map((k,ki) => `<button class="row" data-open="fish:g${gi}k${ki}">${thumb(KCODES[k.n])}
      <span class="tx"><b>${esc(k.n)}</b><small>${esc((k.chips||[]).join(' · '))}</small></span>
      <span class="num"><b>${k.v}</b><em>${esc(k.of||'a day')}</em></span>${CHEV}</button>`).join('')}</div>`;
  return h + '</section>';
}
function otherRow(n, o, oi){
  const val = o.cls === 'keep' ? `<b>${esc(o.big)}</b><em>${esc(o.big==='∞'?'no limit':o.unit)}</em>`
    : `<b class="w ${o.cls==='closed'?'no':'rel'}">${o.cls==='closed'?'Closed':'Release'}</b>`;
  const sub = o.scope ? 'Region-wide' : o.which ? o.which.length + ' kinds' : '';
  return `<button class="row" data-open="${o.which?'prot':'fish:o'+oi}">${thumb(o.fish)}<span class="tx"><b>${esc(n)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span>
    <span class="num">${val}</span>${CHEV}</button>`;
}

/* =============================== GEAR & LICENCE =============================== */
function renderGear(){
  const f = frame(), a = answer(), u16 = S.age === 'u16';
  let h = barHtml();
  if (!f || !f.gear) { h += heroHtml(false) + (a.k==='closed' ? `<section class="block"><div class="line" style="color:var(--sub)">${ico('info')}<span>No fishing for any game fish ${dayWord(S.d)}, so there is no gear to check.</span></div></section>` : ''); $('s-gear').innerHTML = h + '<div style="height:24px"></div>'; return; }
  const G = f.gear;
  const glance = G.glance.map((g,i) => i===0 && u16 ? ['y','No licence needed',U16.body] : g);
  const jump = (t,i) => i===0?'licence':i===1?'line':t==='Snagging'?'ways':/Bait|bait|Water insects|Fish or fish parts/.test(t)?'bait':'line';
  h += `<section class="block" style="padding-top:8px"><p class="eb">For this water ${dayWord(S.d)}</p><div>${glance.map(([m,t,s],i) =>
    `<button class="ck-row" data-open="tile:${jump(t,i)}"><span class="mk ${m}">${ico(m==='y'?'check':'cross','')}</span>
      <span class="tx"><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</span>${CHEV}</button>`).join('')}</div></section>`;
  h += `<section class="block"><p class="eb">Also</p><div class="rows">${[['ways','Ways to fish'],['always','Always']].filter(([k]) => G.tiles[k]).map(([k,l]) =>
    `<button class="row" data-open="tile:${k}"><span class="th ic">${svg(k)}</span><span class="tx"><b>${esc(l)}: ${esc(G.tiles[k].v)}</b><small>${esc(G.tiles[k].s)}</small></span>${CHEV}</button>`).join('')}</div></section>
    <div style="height:24px"></div>`;
  $('s-gear').innerHTML = h;
}

/* =============================== MAP =============================== */
function renderMap(){
  const w = W(), a = answer(), open = S.v !== 'map0', many = w.parts.length > 1;
  let h = `<div class="mapsvg">${mapSvg('big', {dim:!open})}</div><div class="m-tl">${datePill('float')}</div><div class="m-tr"><span>+</span><span>−</span></div>`;
  if (open) h += `<div class="place"><div class="grab"></div>
    <div class="nm"><h2>${esc(w.name)}</h2><button class="x" data-close-water aria-label="Close"><span>✕</span></button></div>
    <button class="partbtn" ${many?'data-open="part"':'aria-disabled="true"'}><span class="stp" style="color:var(${a.col})"><span class="dot" style="background:var(${a.col})"></span>${a.word}</span>
      ${many?`<b>Part ${S.part+1} of ${w.parts.length}</b><span>${esc(shortOf(S.part))}</span><i>▼</i>`:`<span>${esc(shortOf(0))}</span>`}</button>
    ${a.line?`<button class="say" data-tab="regs">${esc(a.line)}</button>`:''}
    ${many?`<div class="hint">Tap a number on the map to switch part.</div>`:''}
    <button class="go" data-tab="regs"><span>${a.k==='closed'?'Why it’s closed':'See the regulations'}</span>${CHEV}</button></div>`;
  else h += `<button class="pill float" data-reopen style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%)">Open ${esc(w.name)}</button>`;
  $('p-map').innerHTML = h;
}

/* =============================== SHEETS =============================== */
function head(t, sub){ return `<div class="shead" id="shead"><div class="grab" style="margin-top:2px"></div><div class="r"><h2>${t}</h2><button class="done" data-close>Done</button></div>${sub?`<p>${sub}</p>`:''}</div>`; }
function sheetHtml(k){
  const w = W(), f = frame();
  if (k === 'part') return head('Which part?', '') + `<div class="sbody"><div class="pmap">${mapSvg('thumb', {w:348, h:180})}</div>${w.parts.map((p,i) => {
      const st = stripAt(p, S.d);
      return `<button class="prow" aria-current="${i===S.part}" data-part="${i}"><span class="nb">${i+1}</span><span class="tx"><b>${esc(shortOf(i))}</b><small>${esc(p.t)}</small></span>
        ${st?`<span class="stp" style="color:var(${SC[st]})"><span class="dot" style="background:var(${SC[st]})"></span>${st==='c'?'Closed':'Open'}</span>`:''}</button>`; }).join('')}</div>`;
  if (k === 'date') { const m = Math.floor(S.d/100);
    return head('Which day?', '') + `<div class="sbody"><div class="mgrid">${MON.map((x,i) => `<button aria-pressed="${i+1===m}" data-mon="${i+1}">${x}</button>`).join('')}</div>
      <div class="days"><button data-dd="-1" aria-label="Day before">−</button><span class="d">${wday(S.d)} ${S.d%100}</span><button data-dd="1" aria-label="Day after">+</button></div>
      ${S.d!==TODAY?`<button class="link" data-jump="${TODAY}">Back to today ›</button>`:''}</div>`; }
  if (k.startsWith('share:')) { const g = f.regs.groups[+k.slice(6)];
    return head(esc(g.t), '') + `<div class="sbody"><p style="font-size:var(--b)">${g.lead}</p>
      ${(g.qa||[]).map(([q,a]) => `<div class="doc"><span style="margin:0">${esc(q)}</span><b>${esc(a)}</b></div>`).join('')}
      ${g.note?`<div class="line" style="color:var(--sub)">${ico('info')}<span>${esc(g.note)}</span></div>`:''}</div>`; }
  if (k.startsWith('fish:')) {
    const m = /^fish:(?:g(\d+)k(\d+)|o(\d+))$/.exec(k); if (!m || !f || !f.regs) return '';
    let name, codes, body, lad;
    if (m[1] != null) { const g = f.regs.groups[+m[1]], kd = g.kinds[+m[2]]; name = kd.n; codes = KCODES[kd.n]||[]; lad = kd.ladder;
      body = `<div class="ans1">${esc(kd.verb)} ${kd.v} ${esc(kd.of||'a day')}</div><div class="meta">${esc((kd.chips||[]).join(' · '))}</div>
        ${kd.note?`<p style="margin:10px 0 0;font-size:var(--m)">${esc(kd.note)}</p>`:''}
        ${kd.extras?`<div style="margin-top:6px">${kd.extras.map(x => `<div class="line">${ico('check','i ck')}<span>${esc(x)}</span></div>`).join('')}</div>`:''}`;
    } else { const [n,o] = f.regs.other[+m[3]]; name = n; codes = o.fish||[]; lad = o.ladder;
      body = `<div class="ans1 ${o.cls==='closed'?'no':o.cls==='rel'?'rel':''}">${o.cls==='keep'?esc(o.word.charAt(0).toUpperCase()+o.word.slice(1)):o.cls==='closed'?'Closed':'Release every one'}</div>
        ${o.say?`<p style="margin:8px 0 0;font-size:var(--m)">${esc(o.say)}</p>`:''}${o.year&&o.year.say?`<p style="margin:6px 0 0;font-size:var(--m)">${esc(o.year.say)}</p>`:''}`; }
    const pics = codes.flatMap(c => PICS[c]||[]), pi = Math.min(S.pic, Math.max(pics.length-1,0)), p = pics[pi];
    const tips = [...new Set(codes)].map(c => FISH[c]).filter(x => x && x.tips.length);
    let h = head(esc(name), '') + `<div class="sbody">`;
    if (p) h += `<div class="pic"><img src="${FISHDIR+p.f}" alt="${esc(p.c)}"></div>
      ${pics.length>1?`<div class="seg" style="margin-top:10px" role="group" aria-label="Picture">${pics.map((q,i) => `<button aria-pressed="${i===pi}" data-pic="${i}">${q.ph?esc(q.ph.charAt(0).toUpperCase()+q.ph.slice(1)):esc(q.c.replace(/ trout$/,''))}</button>`).join('')}</div>`:''}
      <div class="cred">${esc(p.cr)} · ${esc(p.s)}</div>${p.si?`<div class="standin"><b>Stand-in:</b>${esc(p.c)}, pictured for the ${esc(p.si)}</div>`:''}`;
    h += `<div class="sec">${body}</div>`;
    if (tips.length) h += `<div class="sec"><p class="eb">How to tell</p>${tips.map(t => `${tips.length>1?`<div style="font-weight:600;font-size:var(--m);margin-top:8px">${esc(t.n)}</div>`:''}<ul class="tips">${t.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>`;
    if (lad) h += `<div class="sec lad"><p class="eb">Why this is the answer</p><p style="font-weight:600;font-size:var(--m)">${esc(lad.ok.replace(/^✓\s*/,''))}</p>
      ${lad.g.map(([who,items]) => `<div class="lv"><span class="who">${esc(who)}</span>${items.map(([t,l]) => `<div>${esc(t)}<small>${esc(l)}</small></div>`).join('')}</div>`).join('')}
      ${(lad.other||[]).map(([who,items]) => `<div class="lv"><span class="who">Also: ${esc(who)}</span>${items.map(([t]) => `<div>${esc(t)}</div>`).join('')}</div>`).join('')}
      ${lad.skip?`<div class="lv dim"><span class="who">Not used here</span>${lad.skip.map(([t,l]) => `<div>${esc(t)}<small>${esc(l)}</small></div>`).join('')}</div>`:''}</div>`;
    return h + '</div>';
  }
  if (k === 'prot') { const o = f.regs.other.find(([n]) => n === 'Protected species')[1], pics = o.fish.flatMap(c => PICS[c]||[]);
    return head('Protected species', esc(o.say)) + `<div class="sbody"><div class="pgrid">${pics.map(p =>
      `<figure><div class="im"><img src="${FISHDIR+p.f}" alt="${esc(p.c)}"></div><figcaption>${p.si?`<span class="standin"><b>Stand-in:</b></span>${esc(p.c)} for the ${esc(p.si)}`:esc(p.c)}<small>${esc(p.cr)}</small></figcaption></figure>`).join('')}</div>
      <div class="sec"><p class="eb">All ${o.which.length}</p><ul class="tips">${o.which.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`; }
  if (k === 'src') { const src = f.regs.groups[0].src;
    const li = arr => arr.map(([tier,t,where,eff]) => `<div class="lv"><span class="who">${esc(tier.charAt(0)+tier.slice(1).toLowerCase())}</span><div>${esc(t)}<small>${esc(where)} · ${esc(eff)}</small></div></div>`).join('');
    return head('Every regulation line', esc(src.sub)) + `<div class="sbody lad"><div class="sec"><p class="eb">In force (${src.on.length})</p>${li(src.on)}</div><div class="sec dim"><p class="eb">Not used (${src.off.length})</p>${li(src.off)}</div></div>`; }
  if (k.startsWith('tile:')) { const t = k.slice(5), G = f && f.gear; if (!G) return '';
    const L = {licence:'Licence', line:'Line & hooks', bait:'Bait', ways:'Ways to fish', always:'Always'}[t];
    return head(L, '') + `<div class="sbody">${({licence:licencePane, line:linePane, bait:baitPane, ways:waysPane, always:alwaysPane})[t](G)}</div>`; }
  return '';
}
function fold(t, inner){ return `<details class="fold"><summary>${esc(t)}</summary>${inner}</details>`; }
function srcBlock(groups){ return `<div class="src">${groups.map(([hd, items]) => `<h5>${esc(hd.charAt(0)+hd.slice(1).toLowerCase())}</h5>${items.map(([t,tier,doc]) =>
  `<p>${esc(t)}<small>${[tier,doc].filter(Boolean).map(esc).join(' · ')}</small></p>`).join('')}`).join('')}</div>`; }
function licencePane(G){
  const u16 = S.age === 'u16';
  let h = `<div class="sec" style="padding-top:6px"><p class="eb">Who is fishing?</p><div class="seg" role="group" aria-label="Age">
    <button aria-pressed="${!u16}" data-age="adult">16 or older</button><button aria-pressed="${u16}" data-age="u16">Under 16</button></div></div>`;
  const guide = fold('If you are guiding other anglers', `<div class="src"><p>${esc(GUIDING[0])}<small>Province · ${esc(GUIDING[2])}</small></p></div>`);
  if (u16) return h + `<div class="sec"><div class="doc"><b>${esc(U16.head)}</b><span>${esc(U16.body)}</span></div></div>` + guide;
  h += `<div class="sec">${G.need.map(d => `<div class="doc"><b>${esc(d.n)}</b><span>${esc(d.w)}</span><em>${esc(d.p)}</em></div>`).join('')}
    <p style="font-size:var(--s);color:var(--sub);margin-top:4px">Prices as printed for 2025–2027, before tax. Today’s prices: gov.bc.ca/fish-licence</p>
    <div class="note">${G.record}</div></div>`;
  return h + fold('Where each one comes from', srcBlock(G.where)) + guide + fold('Rules for other anglers', `<div class="src"><p>${esc(OTHERS[0])}<small>Province · ${esc(OTHERS[2])}</small></p></div>`);
}
function linePane(G){ return `<div class="sec" style="padding-top:4px">${G.lines.map(([l,v,s,t]) => `<div class="doc"><span style="margin:0 0 2px">${esc(l.charAt(0)+l.slice(1).toLowerCase())}${t?' · '+esc(t):''}</span><b>${esc(v)}</b>${s?`<span>${esc(s)}</span>`:''}</div>`).join('')}</div>`; }
function markList(items){ return items.map(([m,t,s]) => `<div class="ck-row" style="min-height:52px"><span class="mk ${m}">${ico(m==='y'?'check':'cross','')}</span><span class="tx"><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</span></div>`).join(''); }
function baitPane(G){ return `<div class="sec" style="padding-top:4px">${markList(G.bait)}</div>`; }
function waysPane(G){ return `<div class="sec" style="padding-top:4px"><p class="eb">Allowed</p>${markList(G.ways.yes.map(([t,s]) => ['y',t,s]))}</div>
  <div class="sec"><p class="eb">Not allowed</p>${markList(G.ways.no.map(t => ['n',t,'']))}<p style="font-size:var(--m);color:var(--sub);margin-top:8px">${esc(ALWAYS.duty)}</p></div>`; }
function alwaysPane(){ return `<div class="sec" style="padding-top:4px"><p style="font-weight:600">${esc(ALWAYS.duty)}</p></div>
  ${ALWAYS.groups.map(([hd,items]) => `<div class="sec"><p class="eb">${esc(hd.charAt(0)+hd.slice(1).toLowerCase())}</p><ul class="tips">${items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}`; }

/* =============================== render + events =============================== */
function renderTabs(){
  const water = S.v !== 'map0';
  const tabs = water ? [['map','Map','map'],['regs','Regulations','regs'],['gear','Gear & licence','gear']]
                     : [['map0','Map','map'],['search','Search','search'],['conditions','Conditions','conditions'],['pins','Spots','pins']];
  $('tabs').innerHTML = tabs.map(([k,t,ic]) => `<button role="tab" data-tab="${k}" aria-selected="${S.v===k}"><svg viewBox="0 0 23 23" aria-hidden="true">${ICON[ic]}</svg><em>${esc(t)}</em></button>`).join('');
}
function render(keepScroll){
  const de = document.documentElement;
  if (S.theme) de.dataset.theme = S.theme; else delete de.dataset.theme;
  de.classList.toggle('ts2', +S.ts === 2);
  const pane = S.v === 'regs' ? 'regs' : S.v === 'gear' ? 'gear' : 'map';
  ['map','regs','gear'].forEach(p => $('p-'+p).classList.toggle('on', p === pane));
  const sc = $('s-'+pane), prev = sc ? sc.scrollTop : 0;
  if (pane === 'regs') renderRegs(); else if (pane === 'gear') renderGear(); else renderMap();
  renderTabs();
  const sh = S.sheet ? sheetHtml(S.sheet) : '';
  const el = $('sheet'); el.innerHTML = sh; el.style.transform = ''; el.classList.toggle('on', !!sh); $('scrim').classList.toggle('on', !!sh);
  if (sh) bindSwipe();
  if (sc) { sc.scrollTop = keepScroll ? prev : S.scroll; lineBar(sc); }
  renderPoster();
  const q = Object.entries({w:S.w, v:S.v, part:S.part, d:S.d, age:S.age, sheet:S.sheet, theme:S.theme, ts:S.ts||''}).filter(([k,v]) => v!=='' && v!=null).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
  history.replaceState(null, '', '#'+(de.classList.contains('shot')?'shot=1&':'')+q);
}
/* swipe down on the sheet's head to dismiss */
function bindSwipe(){
  const hd = $('shead'), el = $('sheet'); if (!hd) return; let y0 = null, dy = 0;
  hd.onpointerdown = e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; el.classList.add('drag'); hd.setPointerCapture(e.pointerId); };
  hd.onpointermove = e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; };
  hd.onpointerup = hd.onpointercancel = () => { if (y0 == null) return; y0 = null; el.classList.remove('drag');
    if (dy > 80) go({sheet:''}, true); else el.style.transform = ''; };
}
function lineBar(sc){ const b = sc.querySelector('.bar'); if (b) b.classList.toggle('lined', sc.scrollTop > 4); }
['s-regs','s-gear'].forEach(id => $(id).addEventListener('scroll', e => lineBar(e.target), {passive:true}));
function go(o, keep){ Object.assign(S, o); if (!('scroll' in o)) S.scroll = 0; render(keep); }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-open],[data-close],[data-part],[data-jump],[data-mon],[data-dd],[data-age],[data-pic],[data-strip],[data-close-water],[data-reopen],[data-cw],[data-cv],[data-ct]');
  if (!t) { if (e.target === $('scrim')) go({sheet:''}, true); return; }
  const d = t.dataset;
  if (d.tab) { if (['search','conditions','pins'].includes(d.tab)) return toast('Unchanged riffle screen'); return go({v:d.tab, sheet:''}); }
  if (d.open != null) return go({sheet:d.open, pic:0}, true);
  if (d.close != null) return go({sheet:''}, true);
  if (d.part != null) return go({part:+d.part, sheet:''}, true);
  if (d.jump) return go({d:+d.jump, sheet:''});
  if (d.mon) { const m = +d.mon; return go({d: m*100 + Math.min(S.d%100, DIM[m-1])}, true); }
  if (d.dd) return go({d: mdOf(((doy(S.d)-1 + +d.dd + 365) % 365) + 1)}, true);
  if (d.age) return go({age:d.age}, true);
  if (d.pic != null) return go({pic:+d.pic}, true);
  if (d.strip != null) { const r = t.querySelector('.bars').getBoundingClientRect(); const x = Math.min(Math.max((e.clientX-r.left)/r.width,0),.999); return go({d: mdOf(Math.floor(x*365)+1)}, true); }
  if (d.closeWater != null) return go({v:'map0', sheet:''});
  if (d.reopen != null) return go({v:'map'});
  if (d.cw) return go({w:d.cw, part:0, d:TODAY, sheet:'', v: S.v==='map0'?'map':S.v});
  if (d.cv) { const [v,sheet] = d.cv.split('|'); return go({v, sheet:sheet||''}); }
  if (d.ct != null) { const [th, ts] = d.ct.split('|'); return go({theme:th, ts:+ts||0}, true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) go({sheet:''}, true); });
function renderPoster(){
  const ch = (on, attr, t) => `<button class="pill ${on?'on':''}" ${attr}>${esc(t)}</button>`;
  $('c-w').innerHTML = Object.entries(WATERS).map(([k,w]) => ch(S.w===k, `data-cw="${k}"`, w.name)).join('');
  $('c-v').innerHTML = [['map','','Map'],['regs','','Regulations'],['regs','part','Part picker'],['regs','date','Date'],['gear','','Gear & licence'],['gear','tile:licence','Licence']].map(([v,s,t]) =>
    ch(S.v===v && S.sheet===s, `data-cv="${v}|${s}"`, t)).join('');
  $('c-t').innerHTML = [['','Auto'],['light','Light'],['dark','Dark'],[S.theme+'|2','200% text']].map(([k,t]) => ch(t==='200% text'? +S.ts===2 : (S.theme===k && +S.ts!==2), `data-ct="${k}"`, t)).join('');
}
(function(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('shot')) document.documentElement.classList.add('shot');
  for (const [k,v] of h) if (k in S) S[k] = ['part','d','scroll','pic','ts'].includes(k) ? +v : v;
  if (!WATERS[S.w]) S.w = 'vedder';
  const sc = S.scroll; render();
  if (sc) requestAnimationFrame(() => { const el = $(S.v==='gear'?'s-gear':'s-regs'); if (el) { el.scrollTop = sc; lineBar(el); } });
})();
</script>
</body>
