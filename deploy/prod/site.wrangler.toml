# PRODUCTION site — the OWNER deploys it (deploy/prod/site.sh; never an agent). Same shape as deploy/staging/site.wrangler.toml:
# the Expo web export (the app at /) + the SEO pages (tools/seo) in one static-assets worker. The worker runs first for the v1
# paths (/waterbody/*: one 301 each), the water pages (/water/*: stored index.html.br / .gz by Accept-Encoding) and any path
# ending in "/" (one 301 to the path without it). Everything else is a static file or the real 404.
name = "bc-fishing-regulations"
main = "../../app/dist/prod-site-worker/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../../app/dist/prod-site"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = ["/waterbody/*", "/water/*", "/gauge/*", "/*/"]

# (T487) the gauge share cards the feeds worker draws (feeds/cards/<station>.png): the worker maps /gauge/<station>/card.png to
# one, and marks a missing one under private/cards-missing/ (read back by the feeds worker's gauge run)
[[r2_buckets]]
binding = "CARDS"
bucket_name = "bc-fishing-regulations"

[[routes]]
pattern = "canifishthis.ca"
custom_domain = true
