# PRODUCTION host redirect — OPTIONAL, the OWNER deploys it. Every other name of the site -> ONE 301 to https://canifishthis.ca
# with the path (no trailing slash) and query kept, HSTS on the answer. The worker is generated by the SEO build
# (tools/seo/hosting.ts `hostWorker`, held by a test to `redirectFor`): copy app/dist/seo-prod/host-worker.js to
# app/dist/prod-host-worker/worker.js first (deploy/prod/site.sh does). Remove any Cloudflare Redirect Rule / Page Rule on
# these hosts before deploying, or that rule answers first.
name = "canifishthis-host-redirect"
main = "../../app/dist/prod-host-worker/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "canifishthis.com"
custom_domain = true

[[routes]]
pattern = "www.canifishthis.com"
custom_domain = true

[[routes]]
pattern = "www.canifishthis.ca"
custom_domain = true
