# STAGING ONLY. Deploy: npx --prefix app wrangler deploy -c deploy/staging/data.wrangler.toml
# There is deliberately no production env in this file (prod = bc-fishing-r2 / bucket bc-fishing-regulations, human-run).
name = "bc-fishing-r2-staging"
main = "data-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bc-fishing-regulations-staging"

# (T249) per-IP rate limit (data-worker.js `limited`): 300 per 10 s (a map session pans at a few hundred tile range
# requests a MINUTE); period must be 10 or 60 s. Approximate: counted per machine, synced within the location.
[[ratelimits]]
name = "RL"
namespace_id = "2493"
simple = { limit = 300, period = 10 }

[[routes]]
pattern = "data-staging.canifishthis.ca"
custom_domain = true

# (T251) Workers Logs: the update checks' `app=<version>` lines (data-worker.js), kept for the dashboard's log search
[observability]
enabled = true
