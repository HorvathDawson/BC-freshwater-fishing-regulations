<meta charset="utf-8">
<title>Synopsis Review Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one target per screen, phone first — the book crop on top, then the map, the rules, the answer,
   and the four checks with big y / n / ? buttons; a sticky strip of the targets for moving between them. */
:root {
  --ground: #f2f4f3; --card: #ffffff; --ink: #172420; --sub: #56665f; --rule: #d4dcd8; --chip: #e3eae6;
  --water: #7d9bb0; --lake: #cfe0ea; --trib: #b4c4cd; --reach: #0f7a6c; --reach-lake: #8fd0c4;
  --cut: #b5371f; --accent: #0f7a6c; --ok: #237a3b; --bad: #b3261e; --unsure: #8a6a00; --hl: rgba(255, 196, 0, .32);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0f1614; --card: #17211e; --ink: #e2ebe7; --sub: #98aaa2; --rule: #2a3833; --chip: #22302b;
  --water: #7f9db3; --lake: #23404f; --trib: #3c4c55; --reach: #4fd1bd; --reach-lake: #1f6e63;
  --cut: #ff7a5c; --accent: #4fd1bd; --ok: #5cc47f; --bad: #ff7a70; --unsure: #e2c24a; --hl: rgba(255, 196, 0, .22); color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #0f1614; --card: #17211e; --ink: #e2ebe7; --sub: #98aaa2; --rule: #2a3833; --chip: #22302b;
  --water: #7f9db3; --lake: #23404f; --trib: #3c4c55; --reach: #4fd1bd; --reach-lake: #1f6e63;
  --cut: #ff7a5c; --accent: #4fd1bd; --ok: #5cc47f; --bad: #ff7a70; --unsure: #e2c24a; --hl: rgba(255, 196, 0, .22); color-scheme: dark }
body { background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 120px; display: grid; gap: 14px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--card); border-bottom: 1px solid var(--rule);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 6px; }
.toprow { display: flex; align-items: center; gap: 8px; max-width: 780px; margin: 0 auto; width: 100%; }
.toprow .pos { flex: 1; min-width: 0; font: 600 17px/1.1 var(--display); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navbtn { font: 600 18px var(--body); min-width: 44px; height: 40px; border-radius: 8px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); cursor: pointer; }
.navbtn:disabled { opacity: .4; cursor: default; }
.dots { display: flex; gap: 4px; overflow-x: auto; max-width: 780px; margin: 0 auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
.dots button { flex: none; width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--rule); background: var(--ground); cursor: pointer;
  font: 500 10px var(--mono); color: var(--sub); padding: 0; position: relative; }
.dots button[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.dots button.verified { background: var(--ok); border-color: var(--ok); color: var(--card); }
.dots button.wrong { background: var(--bad); border-color: var(--bad); color: var(--card); }
.dots button.unsure, .dots button.deferred { background: var(--unsure); border-color: var(--unsure); color: var(--card); }
.dots button.part { background: linear-gradient(135deg, var(--ok) 50%, var(--ground) 50%); }
.dots button.busy::after { content: ""; position: absolute; right: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 1px solid var(--card); }
h1 { font: 600 27px/1.08 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font: 600 19px/1.15 var(--display); letter-spacing: .03em; margin: 0; text-transform: uppercase; color: var(--sub); }
.sub { color: var(--sub); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .04em; background: var(--chip); color: var(--sub); border-radius: 4px; padding: 2px 6px; }
.chip.tier { background: var(--accent); color: var(--card); }
.chip.warn { color: var(--bad); }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.notice { background: var(--chip); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.notice.bad { color: var(--bad); }
.presence { border-left: 4px solid var(--accent); }
.crop { display: grid; gap: 4px; cursor: zoom-in; }
.strip { position: relative; overflow: hidden; width: 100%; max-width: 100%; background: #fff; border-radius: 3px; }
.strip img { position: absolute; max-width: none; display: block; }
.zoomhint { font-size: 13px; color: var(--sub); }
.cov { font-size: 14px; line-height: 1.5; background: var(--ground); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
.cov .cov-unquoted { color: var(--bad); text-decoration: underline wavy; text-decoration-thickness: 1px; }
.cov .cov-quoted { color: var(--ink); }
svg.map { display: block; width: 100%; height: auto; max-width: 100%; background: var(--ground); border-radius: 6px; cursor: zoom-in; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub); }
.legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.rulepick { display: flex; flex-wrap: wrap; gap: 6px; }
.rulepick button { font: 500 12px var(--mono); border: 1px solid var(--rule); background: var(--card); color: var(--sub); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.rulepick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rules li { display: grid; gap: 3px; padding-top: 8px; border-top: 1px solid var(--rule); min-width: 0; }
.rules li:first-child { border-top: 0; padding-top: 0; }
.rules li.active { background: var(--hl); border-radius: 6px; padding: 6px 8px; }
.rid { font: 500 12px var(--mono); color: var(--sub); }
.lab { font-weight: 600; }
.verb { color: var(--sub); font-size: 14px; }
.bind { font-size: 13px; color: var(--sub); }
.bind b { color: var(--ink); font-weight: 600; }
details summary { cursor: pointer; color: var(--sub); font-size: 13px; }
pre.diag { font: 12px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0; color: var(--sub); }
.pre ul { margin: 0; padding-left: 18px; font-size: 14px; }
.sev { font: 600 11px var(--mono); padding: 1px 5px; border-radius: 3px; margin-right: 4px; background: var(--chip); }
.sev.A { color: var(--bad); }
.ans-fish { display: grid; gap: 4px; }
.ans-fish h3 { margin: 6px 0 0; font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.ans-rule { font-size: 14px; display: flex; gap: 6px; }
.state { font: 500 11px var(--mono); text-transform: uppercase; color: var(--sub); flex: none; min-width: 64px; }
.state.speaks { color: var(--accent); }
.checks { display: grid; gap: 10px; }
.check { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--rule); border-radius: 8px; }
.check.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.check.held { opacity: .55; }
.check .q { font-size: 14px; }
.check .q kbd { font: 600 12px var(--mono); background: var(--chip); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.yn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.yn button { font: 600 20px var(--body); height: 48px; border-radius: 8px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); cursor: pointer; }
.yn button[aria-pressed="true"][data-a="y"] { background: var(--ok); border-color: var(--ok); color: var(--card); }
.yn button[aria-pressed="true"][data-a="n"] { background: var(--bad); border-color: var(--bad); color: var(--card); }
.yn button[aria-pressed="true"][data-a="?"] { background: var(--unsure); border-color: var(--unsure); color: var(--card); }
select, textarea { width: 100%; box-sizing: border-box; font: 15px var(--body); color: var(--ink); background: var(--ground);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
textarea { min-height: 56px; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1 1 140px; font: 600 16px var(--body); height: 48px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
.actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.actions button:disabled { opacity: .5; cursor: default; }
.msg { font-size: 14px; }
.msg.err { color: var(--bad); }
.others { font-size: 13px; color: var(--sub); }
.keys { font: 12px var(--mono); color: var(--sub); }
button:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#viewer { position: fixed; inset: 0; z-index: 50; background: var(--ground); display: grid; grid-template-rows: auto 1fr; }
#viewer .vbar { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px))
  max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--rule); background: var(--card); }
#viewer .vtitle { flex: 1; min-width: 0; font: 600 18px/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#viewer .vbar button { font: 600 16px var(--body); min-width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--rule); background: var(--ground); color: var(--ink); cursor: pointer; }
#viewer .vstage { position: relative; overflow: hidden; touch-action: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
#viewer svg { width: 100%; height: 100%; display: block; cursor: grab; }
.p-stream { fill: none; stroke: var(--water); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.p-side_channel { fill: none; stroke: var(--water); stroke-width: 1.2; stroke-dasharray: 4 3; }
.p-waterbody { fill: var(--lake); stroke: var(--water); stroke-width: 1; }
.p-trib { fill: none; stroke: var(--trib); stroke-width: 1; }
.p-reach { fill: none; stroke: var(--reach); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.p-reach_off { fill: none; stroke: var(--reach); stroke-width: 1.1; stroke-opacity: .75; }
.p-reach_lake { fill: var(--reach-lake); stroke: var(--reach); stroke-width: 2; }
.p-excluded { fill: none; stroke: var(--cut); stroke-width: 2.4; stroke-dasharray: 5 3; }
.pt { fill: var(--card); stroke: var(--ink); stroke-width: 1.4; }
.pt.focus { fill: var(--cut); stroke: var(--card); stroke-width: 1.6; }
.ptl { font: 600 13px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 3px; }
@media (prefers-reduced-motion: no-preference) { .dots button { transition: background .15s; } }
</style>

<div class="top" id="top">
  <div class="toprow">
    <button type="button" class="navbtn" id="prev" aria-label="Previous target (k)">‹</button>
    <span class="pos" id="pos">Loading…</span>
    <button type="button" class="navbtn" id="next" aria-label="Next target (j)">›</button>
  </div>
  <div class="dots" id="dots" role="tablist" aria-label="Targets"></div>
</div>
<main class="wrap" id="main"></main>

<script>
const DATA = /*__DATA__*/null;
const QUESTIONS = {
  T: "Text: the book says what we stored (the row or passage against the raw name and the regs).",
  R: "Rules: every clause is a rule and nothing is invented (species, quota, size, dates, gear, tributaries).",
  P: "Place: the rules land on the right water (matched water, split points, ambiguous cut, tributary walk).",
  A: "Answer: the angler's page for the sample day says the same thing, open or closed.",
};
const SPLIT_Q = { P: "Place: the cut is in the right place on the map." };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = DATA.targets;
const fmt = (n) => (n == null ? "–" : Number(n).toLocaleString());
const km = (m) => (m >= 1000 ? `${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km` : `${Math.round(m)} m`);

/* ---------------- identity, the store, presence */
let db = null, user = null, me = null, writable = true;
const marks = {};          // doc id -> body (everyone's)
const presence = {};       // reviewer id -> {target, at}
const names = {};          // id -> name (resolved each render, never stored)
const docId = (scope, target, rid) => ("m:" + scope + ":" + target + (rid ? "::" + rid : "")).replace(/[^A-Za-z0-9_\-.:@+]/g, (c) => "~" + c.charCodeAt(0).toString(16).padStart(2, "0"));
const LOCAL = "t184-marks";

/* ---------------- state */
let at = 0;
try { const h = decodeURIComponent(location.hash.slice(1)); const i = T.findIndex((t) => t.hash === h || t.id === h); if (i >= 0) at = i; } catch {}
let unit = 0;                         // a zone entry: which rule
let answers = {}, active = "T", problem = "", note = "";
let since = Date.now();
let selRule = null;                   // map highlight
let msg = "", msgErr = false, confirmOverwrite = null;
let showAnswer = false;

const unitsOf = (t) => t.units;
const unitKey = (t, u) => docId(u.scope, t.id, u.rule_id);
const checksOf = (t) => (t.kind === "split" ? DATA.checks.split : DATA.checks[t.zone ? "rule" : "entry"]);
const held = (t) => (t.vintage === "current" ? {} : { P: "awaiting build", A: "awaiting build" });

function verdictFrom(checks, a) {
  const got = checks.map((c) => a[c]);
  if (got.includes("n")) return "wrong";
  if (got.includes("?")) return "unsure";
  if (got.every((x) => x === "y")) return "verified";
  return null;
}
/* the store's own refusals (marks.Mark._consistent), said before the write */
function refusal(checks, verdict, a, prob, nt) {
  if (!verdict) return `Answer every check (${checks.join(" ")}) with y, n or ? before recording the mark, or defer it with a note.`;
  if (verdict === "wrong" && (!prob.trim() || !nt.trim())) return "A wrong mark needs a problem (pick one from the list) and a note saying what is wrong.";
  if (verdict === "deferred" && !nt.trim()) return "To defer, write a note saying why.";
  return null;
}
function targetState(t) {
  const us = unitsOf(t).map((u) => marks[unitKey(t, u)]);
  const done = us.filter(Boolean);
  if (!done.length) return "";
  if (done.length < us.length) return "part";
  for (const w of ["wrong", "unsure", "deferred"]) if (done.some((m) => m.verdict === w)) return w;
  return "verified";
}
function others(t) {
  const now = Date.now();
  return Object.entries(presence).filter(([id, p]) => id !== me && p.target === t.id && now - Date.parse(p.at) < 30 * 60e3);
}

/* ---------------- book crop: rectangles over the page image */
function cropHtml(t) {
  const b = t.book;
  if (!b || !b.page) return `<p class="notice">${esc(b?.why || "This target has no page in the book.")}</p>`;
  const pg = b.page;
  const pad = b.kind === "row" ? [4, 1] : [4, 4];
  const strips = (b.strips && b.strips.length ? b.strips : null);
  let html = "";
  if (strips) {
    html = strips.map(([x0, y0, x1, y1]) => {
      x0 = Math.max(0, x0 - pad[0]); x1 = Math.min(pg.w, x1 + pad[0]); y0 = Math.max(0, y0 - pad[1]); y1 = Math.min(pg.h, y1 + pad[1]);
      const w = x1 - x0, h = y1 - y0;
      return `<div class="strip" style="aspect-ratio:${w.toFixed(1)}/${h.toFixed(1)}"><img src="${esc(pg.image)}" alt="" loading="lazy" style="width:${(pg.w / w * 100).toFixed(3)}%;left:${(-x0 / w * 100).toFixed(3)}%;top:${(-y0 / h * 100).toFixed(3)}%"></div>`;
    }).join("");
  } else {
    html = `<div class="strip" style="aspect-ratio:${pg.w}/${pg.h}"><img src="${esc(pg.image)}" alt="" loading="lazy" style="width:100%;left:0;top:0"></div>`;
  }
  const where = b.kind === "row" ? "the row (water column above the regulation column)" : b.kind === "passage" ? `the passage (${b.found} of ${b.total} words found on the page)` : "the whole page: " + esc(b.why || "the row was not located");
  return `<div class="crop" data-zoom="book" role="button" tabindex="0" aria-label="Open printed page ${pg.printed} full screen">${html}</div>
    <div class="zoomhint">Printed page ${pg.printed}, ${where}. Tap to open the page and zoom.</div>`;
}

/* ---------------- the map */
function mapSvg(t, inViewer) {
  const m = t.map; if (!m) return "";
  const show = selRule ? [selRule] : Object.keys(m.rules);
  const on = new Set(), out = new Set();
  for (const r of show) { const x = m.rules[r]; if (x && x.drawn) { x.on.forEach((i) => on.add(i)); x.out.forEach((i) => out.add(i)); } }
  const base = (i) => (i == null ? "" : `<path class="p-${m.paths[i].k}" vector-effect="non-scaling-stroke" d="${m.paths[i].d}"/>`);
  let s = "";
  if (m.trib != null) s += base(m.trib);
  for (const k of ["waterbody", "side_channel", "stream"]) if (m.layers[k] != null) s += base(m.layers[k]);
  const order = (i) => ["reach_off", "reach_lake", "reach"].indexOf(m.paths[i].k);
  for (const i of [...on].sort((a, b) => order(a) - order(b))) s += base(i);
  for (const i of out) s += base(i);
  for (const p of m.splits) {
    s += `<circle class="pt${p.focus ? " focus" : ""}" cx="${p.x}" cy="${p.y}" r="${p.focus ? 6 : 4}" data-r="${p.focus ? 6 : 4}" vector-effect="non-scaling-stroke"><title>${esc(p.label || p.id)}</title></circle>`;
    if (p.focus) s += `<text class="ptl" x="${p.x + 9}" y="${p.y + 4}" data-fs="13">${esc(p.label || p.id)}</text>`;
  }
  const bar = Math.pow(10, Math.floor(Math.log10(m.w * 0.25 * m.m_per_unit)));
  const barU = bar / m.m_per_unit;
  if (!inViewer) s += `<g><rect x="12" y="${m.h - 26}" width="${barU}" height="4" fill="var(--ink)"/><text x="12" y="${m.h - 32}" font-size="16" fill="var(--sub)">${km(bar)}</text></g>`;
  return inViewer ? s : `<svg class="map" viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="Map of ${esc(t.name)}" data-zoom="map">${s}</svg>`;
}

/* ---------------- full-screen viewer: pinch / wheel / drag / double-tap, + − reset (the braid page's) */
function openViewer(kind) {
  const t = T[at];
  let inner, W, H, vb0, title;
  if (kind === "book") {
    const pg = t.book.page; W = pg.w; H = pg.h; title = `Printed page ${pg.printed}`;
    const boxes = (t.book.boxes || []).map(([x0, y0, x1, y1]) => `<rect x="${x0 - 2}" y="${y0 - 2}" width="${x1 - x0 + 4}" height="${y1 - y0 + 4}" fill="var(--hl)" stroke="var(--cut)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join("");
    inner = `<image href="${esc(pg.image)}" x="0" y="0" width="${W}" height="${H}"/>${boxes}`;
    const bx = t.book.boxes && t.book.boxes.length ? t.book.boxes : null;
    if (bx) {
      const x0 = Math.min(...bx.map((b) => b[0])) - 10, y0 = Math.min(...bx.map((b) => b[1])) - 10;
      const x1 = Math.max(...bx.map((b) => b[2])) + 10, y1 = Math.max(...bx.map((b) => b[3])) + 10;
      vb0 = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    }
  } else {
    const m = t.map; W = m.w; H = m.h; title = t.name; inner = mapSvg(t, true);
  }
  vb0 = vb0 || { x: 0, y: 0, w: W, h: H };
  const v = document.createElement("div"); v.id = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", title);
  v.innerHTML = `<div class="vbar"><span class="vtitle">${esc(title)}</span><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">−</button><button type="button" data-z="reset" aria-label="Reset">⟲</button><button type="button" data-z="close" aria-label="Close">✕</button></div>
    <div class="vstage"><svg viewBox="${vb0.x} ${vb0.y} ${vb0.w} ${vb0.h}" preserveAspectRatio="xMidYMid meet">${inner}</svg></div>`;
  document.body.appendChild(v); document.body.style.overflow = "hidden";
  const svg = v.querySelector("svg");
  let vb = { ...vb0 };
  const apply = () => {
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    const z = vb.w / W;
    svg.querySelectorAll("circle[data-r]").forEach((d) => d.setAttribute("r", (+d.dataset.r * z * 1.4).toFixed(2)));
    svg.querySelectorAll("text[data-fs]").forEach((d) => d.setAttribute("font-size", (+d.dataset.fs * z * 1.4).toFixed(2)));
  };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), sc = Math.min(r.width / vb.w, r.height / vb.h);
    const ox = (r.width - vb.w * sc) / 2, oy = (r.height - vb.h * sc) / 2;
    return [vb.x + (cx - r.left - ox) / sc, vb.y + (cy - r.top - oy) / sc, sc]; };
  const zoomAt = (f, cx, cy) => {
    const nw = Math.min(W * 4, Math.max(W / 80, vb.w / f)), real = vb.w / nw;
    const [sx, sy] = cx == null ? [vb.x + vb.w / 2, vb.y + vb.h / 2] : toSvg(cx, cy);
    vb = { x: sx - (sx - vb.x) / real, y: sy - (sy - vb.y) / real, w: nw, h: vb.h * nw / vb.w }; apply();
  };
  const close = () => { v.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", key, true); };
  const key = (e) => { e.stopPropagation(); if (e.key === "Escape" || e.key === "m") { e.preventDefault(); close(); } if (e.key === "+" || e.key === "=") zoomAt(1.5); if (e.key === "-") zoomAt(1 / 1.5); };
  document.addEventListener("keydown", key, true);
  v.querySelector(".vbar").addEventListener("click", (e) => {
    const z = e.target.closest("[data-z]")?.dataset.z;
    if (z === "in") zoomAt(1.6); else if (z === "out") zoomAt(1 / 1.6);
    else if (z === "reset") { vb = { ...vb0 }; apply(); } else if (z === "close") close();
  });
  svg.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX, e.clientY); }, { passive: false });
  const pts = new Map(); let last = null, lastTap = 0;
  svg.addEventListener("pointerdown", (e) => {
    svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { const now = Date.now(); if (now - lastTap < 300) zoomAt(2, e.clientX, e.clientY); lastTap = now; }
    last = null;
  });
  svg.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    const p = [...pts.values()];
    if (p.length === 1) {
      const [x, y] = p[0];
      if (last && last.x != null) { const sc = toSvg(0, 0)[2]; vb.x -= (x - last.x) / sc; vb.y -= (y - last.y) / sc; apply(); }
      last = { x, y };
    } else {
      const [a, b] = p, cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (last && last.d) zoomAt(d / last.d, cx, cy);
      last = { d };
    }
  });
  const up = (e) => { pts.delete(e.pointerId); last = null; };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  apply();
  v.querySelector("[data-z=close]").focus();
}

/* ---------------- sections */
function rulesHtml(t) {
  if (!t.rules.length) return `<p class="sub">This entry has no rules${t.licensing.length ? " (licensing records only)" : ""}.</p>`;
  const zr = t.zone ? t.units[unit]?.rule_id : null;
  return `<ul class="rules">${t.rules.map((r) => {
    const b = r.binding || {};
    const amb = (t.ambiguous_cuts[r.rule_id] || []).map((c) => `cut ${esc(c.split_id)}: candidates ${c.candidates.map((x) => km(x)).join(", ")}, took <b>${km(c.used)}</b>`).join("; ");
    const d = (b.diagnostics || []).length ? `<details><summary>what the builder decided (${b.diagnostics.length})</summary><pre class="diag">${esc(b.diagnostics.map((x) => JSON.stringify(x)).join("\n"))}</pre></details>` : "";
    const where = [r.extent_text && `place in words: ${esc(r.extent_text)}`, (r.unresolved_locators || []).length && `unresolved: ${esc(r.unresolved_locators.join("; "))}`, r.undrawn_part && `undrawn part: ${esc(r.undrawn_part)}`].filter(Boolean).join(" · ");
    return `<li class="${zr === r.rule_id ? "active" : ""}"><span class="rid">${esc(r.rule_id)} · ${esc(r.type || "")}${r.species ? " · " + esc(r.species.join(", ")) : ""}</span>
      <span class="lab">${esc(r.label || r.verbatim)}</span>
      <span class="verb">“${esc(r.verbatim || "")}”</span>
      <span class="bind">${t.zone ? `<b>${esc(r.impact || "")}</b>` : `binds <b>${fmt(b.n_sections)}</b> section${b.n_sections === 1 ? "" : "s"} · ${esc(b.outcome || "")}${b.reason ? " (" + esc(b.reason) + ")" : ""}`}${b.tributaries_pending ? " · tributaries pending" : ""}${r.includes_tributaries ? " · incl. tributaries" : ""}${r.tributaries_only ? " · tributaries only" : ""}</span>
      ${where ? `<span class="bind">${where}</span>` : ""}${amb ? `<span class="bind">${amb}</span>` : ""}${r.review_reason ? `<span class="bind">parser: ${esc(r.review_reason)}</span>` : ""}${d}</li>`;
  }).join("")}</ul>`;
}
function prechecksHtml(t) {
  const p = t.prechecks || [];
  if (!p.length && !(t.parse_findings || []).length) return "";
  return `<section class="panel pre"><h2>Pre-checks</h2><ul>${p.map((f) => `<li><span class="sev ${f.severity}">${f.severity}</span>${f.rule_id ? `<span class="rid">${esc(f.rule_id)}</span> ` : ""}${esc(f.what)}</li>`).join("")}${(t.parse_findings || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>`;
}
function answerHtml(a) {
  if (!a) return "";
  if (!a.previews || !a.previews.length) return `<p class="sub">${esc(a.why || "No answer to show.")}</p>`;
  return `<p class="sub">The page an angler opens for ${esc(a.item)}${a.part != null ? `, part ${a.part}` : ""} (${fmt(a.sections)} sections${a.via && a.via !== "reach" ? ", via " + esc(a.via) : ""}), on ${esc(DATA.date)}. Rules marked “speaks” decide the answer; the others stand beside it.</p>` +
    a.previews.map((p) => p.error ? `<p class="sub">${esc(p.fish)}: ${esc(p.error)}</p>` : `<div class="ans-fish"><h3>${esc(p.fish)}${p.tidal ? " · tidal" : ""}${p.waters?.length ? ` · ${esc(p.waters.slice(0, 3).join(", "))}` : ""}</h3>
      ${p.rules.length ? p.rules.map((r) => `<div class="ans-rule"><span class="state ${esc(r.state)}">${esc(r.state)}</span><span>${esc(r.label || r.verbatim)} <span class="rid">${esc(r.entry_name || r.entry_id)}</span></span></div>`).join("") : `<p class="sub">No rule speaks for this fish here.</p>`}
      ${(p.licensing || []).length ? `<div class="sub">Licensing: ${p.licensing.map((l) => esc(l.label)).join("; ")}</div>` : ""}</div>`).join("");
}
function zoneAnswerHtml(t) {
  const r = t.rules.find((x) => x.rule_id === t.units[unit]?.rule_id);
  return r ? answerHtml(r.answer) : "";
}

function checksHtml(t) {
  const checks = checksOf(t), h = held(t), qs = t.kind === "split" ? SPLIT_Q : QUESTIONS;
  const u = t.units[unit], key = unitKey(t, u), mine = marks[key];
  const probs = checks.filter((c) => answers[c] === "n").flatMap((c) => (DATA.problems[c] || []).map((p) => [c, p]));
  const prior = mine ? `<p class="others">Marked <b>${esc(mine.verdict)}</b> by ${esc(nameOf(mine.reviewer))} on ${esc((mine.at || "").slice(0, 10))}${mine.fp !== u.fp ? " (on another vintage)" : ""}${mine.note ? `: “${esc(mine.note)}”` : ""}. Recording again replaces it.</p>` : "";
  const repo = (t.marks_now || []).filter((m) => (m.rule_id || null) === (u.rule_id || null)).map((m) => `<p class="others">In the repo: ${esc(m.status)} by ${esc(m.reviewer)}, ${esc(m.date)}.</p>`).join("");
  const zoneRules = t.zone ? `<div class="rulepick" role="group" aria-label="Rule to mark">${t.units.map((x, i) => {
    const mm = marks[unitKey(t, x)];
    return `<button type="button" data-unit="${i}" aria-pressed="${i === unit}">${esc(x.rule_id.split(".").pop())}${mm ? " · " + esc(mm.verdict) : ""}</button>`;
  }).join("")}</div>` : "";
  return `<section class="panel" id="checks"><h2>${t.zone ? `Check rule ${esc(u.rule_id)}` : t.kind === "split" ? "Check the split point" : "Check this entry"}</h2>${zoneRules}${prior}${repo}
    <div class="checks">${checks.map((c) => `<div class="check${active === c ? " active" : ""}${h[c] ? " held" : ""}" data-check="${c}">
      <div class="q"><kbd>${c.toLowerCase()}</kbd>${esc(qs[c])}${h[c] ? ` <b>Waits for the build.</b>` : ""}</div>
      ${h[c] ? "" : `<div class="yn">${["y", "n", "?"].map((a) => `<button type="button" data-a="${a}" data-c="${c}" aria-pressed="${answers[c] === a}" aria-label="${c} ${a === "?" ? "unsure" : a === "y" ? "yes" : "no"}">${a}</button>`).join("")}</div>`}</div>`).join("")}</div>
    ${probs.length ? `<label for="problem" class="sub">Problem</label><select id="problem"><option value="">Pick the problem…</option>${checks.filter((c) => answers[c] === "n").map((c) => `<optgroup label="${c}">${(DATA.problems[c] || []).map((p) => `<option${p === problem ? " selected" : ""}>${esc(p)}</option>`).join("")}</optgroup>`).join("")}</select>` : ""}
    <label for="note" class="sub">Note${checks.some((c) => answers[c] === "n") ? " (say what is wrong)" : " (optional; needed to defer — start it with TOOL: if the page stopped you)"}</label>
    <textarea id="note" rows="2">${esc(note)}</textarea>
    ${confirmOverwrite ? `<p class="notice">${esc(nameOf(confirmOverwrite))} already marked this. Record again to replace their mark.</p>` : ""}
    <div class="actions"><button type="button" class="primary" id="record">Record mark ↵</button><button type="button" id="defer">Defer</button></div>
    ${msg ? `<p class="msg${msgErr ? " err" : ""}" role="status">${esc(msg)}</p>` : ""}
    <p class="keys">Keys: t r p a pick a check · y n ? answer · Enter records · o answer · m map · j k next / previous</p></section>`;
}
const nameOf = (id) => (id === me ? "you" : names[id] || "someone");

function render() {
  const t = T[at];
  $("#pos").textContent = `${at + 1} / ${T.length} · ${t.tier} · ${t.name}`;
  $("#prev").disabled = at === 0; $("#next").disabled = at === T.length - 1;
  const busyIds = new Set(Object.entries(presence).filter(([id, p]) => id !== me && Date.now() - Date.parse(p.at) < 30 * 60e3).map(([, p]) => p.target));
  $("#dots").innerHTML = T.map((x, i) => `<button type="button" role="tab" data-go="${i}" class="${targetState(x)}${busyIds.has(x.id) ? " busy" : ""}" aria-current="${i === at}" aria-label="${i + 1}: ${esc(x.name)} (${x.tier})" title="${esc(x.name)}">${i + 1}</button>`).join("");
  const done = T.filter((x) => ["verified", "wrong", "unsure", "deferred"].includes(targetState(x))).length;
  const o = others(t);
  const head = `<header class="panel" style="gap:6px">
      <div class="chips"><span class="chip tier">${esc(t.tier)}</span>${t.kind === "split" ? `<span class="chip">split point</span>` : `<span class="chip">${t.zone ? "zone" : "water"} · region ${esc(t.region)}</span>`}${(t.risks || []).map((r) => `<span class="chip warn">${esc(r)}</span>`).join("")}<span class="chip">${done} of ${T.length} done</span></div>
      <h1>${esc(t.kind === "split" ? (t.label || t.id) : t.name)}</h1>
      <div class="sub">${t.kind === "split" ? `${esc(t.waterbody)} · ${esc(t.split_kind || "")}${t.grade ? ` · auto-proposal, grade ${esc(t.grade)}` : ""}` : `${t.display_name && t.display_name !== t.name ? `Shown in the app as “${esc(t.display_name)}”. ` : ""}${t.item ? `Water: ${esc(t.item.name)}${t.also_items.length ? " + " + t.also_items.map((a) => esc(a.name)).join(", ") : ""}.` : t.zone ? "A regional rule: it applies by area." : "No water matched."}`}</div>
      ${t.vintage !== "current" ? `<p class="notice bad">Awaiting build: only T and R can be answered.</p>` : ""}
      ${(t.gate_errors || []).length ? `<p class="notice bad">This entry fails the gate, so it cannot be marked: ${esc(t.gate_errors.join("; "))}</p>` : ""}
      ${o.length ? `<p class="notice presence">Being reviewed by ${o.map(([id, p]) => `${esc(nameOf(id))} (opened ${Math.max(1, Math.round((Date.now() - Date.parse(p.at)) / 60e3))} min ago)`).join(", ")}.</p>` : ""}
      ${!db ? `<p class="notice bad">Marks cannot be saved here: open the page signed in to claude.ai. Anything you record stays in this browser only.</p>` : !me ? `<p class="notice bad">This view has no identity, so marks cannot name you. Open the page signed in.</p>` : !writable ? `<p class="notice bad">You can read this page but not record marks. Ask the owner for Contributor access.</p>` : ""}
    </header>`;
  let body = "";
  if (t.kind === "split") {
    body += `<section class="panel"><h2>The split point</h2>${t.note ? `<p>${esc(t.note)}</p>` : `<p class="sub">No note.</p>`}
      ${t.meta && Object.keys(t.meta).length ? `<p class="sub">${Object.entries(t.meta).map(([k, v]) => `${esc(k)}: ${esc(typeof v === "object" ? JSON.stringify(v) : v)}`).join(" · ")}</p>` : ""}
      ${t.anchor?.anchor ? `<details><summary>anchor</summary><pre class="diag">${esc(JSON.stringify(t.anchor.anchor, null, 1))}</pre></details>` : ""}</section>`;
  } else {
    body += `<section class="panel"><h2>The book</h2>${cropHtml(t)}
      ${t.coverage ? `<div class="cov" aria-label="The row as stored; red is quoted by no rule">${t.coverage.segments.map((s) => `<span class="cov-${esc(s.kind)}">${esc(s.text)}</span>`).join("")}</div>
      <div class="sub">${t.coverage.unquoted_chars === 0 ? "Every word of the row is quoted by a rule." : `${t.coverage.unquoted_chars} letters and digits of the row are quoted by no rule (red).`}${t.coverage.missing?.length ? ` Not in the row: ${esc(t.coverage.missing.join(", "))}.` : ""}</div>` : ""}
      ${t.symbols?.length ? `<div class="sub">Symbols printed: ${esc(t.symbols.join(", "))}</div>` : ""}</section>`;
  }
  if (t.map) {
    const rk = Object.keys(t.map.rules);
    const notDrawn = rk.filter((r) => !t.map.rules[r].drawn);
    body += `<section class="panel"><h2>The map</h2>
      ${rk.length > 1 ? `<div class="rulepick" role="group" aria-label="Rule to show"><button type="button" data-rule="" aria-pressed="${!selRule}">all rules</button>${rk.map((r) => `<button type="button" data-rule="${esc(r)}" aria-pressed="${selRule === r}">${esc(r.split(".").pop())}</button>`).join("")}</div>` : ""}
      ${mapSvg(t)}
      <div class="legend"><span><i style="background:var(--water)"></i>the water</span>${t.map.paths.some((p) => p.k.startsWith("reach")) ? `<span><i style="background:var(--reach)"></i>${selRule ? "where this rule binds" : "where the rules bind"}</span>` : ""}${t.map.paths.some((p) => p.k === "reach_off") ? `<span><i style="background:var(--reach);height:2px"></i>bound off the water (tributaries, area)</span>` : ""}${t.map.trib != null ? `<span><i style="background:var(--trib)"></i>tributaries (one level)</span>` : ""}${t.map.paths.some((p) => p.k === "excluded") ? `<span><i style="background:var(--cut)"></i>carved out</span>` : ""}<span><i style="background:var(--cut);height:8px;width:8px;border-radius:50%"></i>${t.kind === "split" ? "this split point" : "a split a rule names"}</span></div>
      ${notDrawn.length ? `<p class="sub">Not drawn (too many sections for this page): ${notDrawn.map((r) => `${esc(r)} binds ${fmt(t.map.rules[r].n)}`).join("; ")}.</p>` : ""}
      <div class="zoomhint">Tap the map to open it full screen (key m).</div></section>`;
  } else if (t.zone) {
    body += `<section class="panel"><h2>Where it applies</h2><p class="sub">A zone rule binds by area. Each rule below states how many sections it binds; the map is not drawn for an area this large.</p></section>`;
  }
  if (t.kind !== "split") {
    body += prechecksHtml(t);
    body += `<section class="panel"><h2>Rules</h2>${rulesHtml(t)}${t.licensing.length ? `<details><summary>${t.licensing.length} licensing record(s)</summary><ul>${t.licensing.map((l) => `<li>${esc(l.kind)}: ${esc(l.label || l.verbatim)}</li>`).join("")}</ul></details>` : ""}
      ${t.related.length ? `<p class="sub">Same water, reviewed separately: ${t.related.map((r) => esc(r.name)).join(", ")}</p>` : ""}</section>`;
    body += `<section class="panel" id="answer"><details${showAnswer ? " open" : ""} id="answerbox"><summary><h2 style="display:inline">The angler's answer</h2> (key o)</summary>${t.zone ? zoneAnswerHtml(t) : answerHtml(t.answer)}</details></section>`;
  }
  body += checksHtml(t);
  $("#main").innerHTML = head + body;
  resolveNames();
}

let resolving = false;
async function resolveNames() {
  if (!user || resolving) return;
  const ids = [...new Set([...Object.values(marks).map((m) => m.reviewer), ...Object.keys(presence)].filter((x) => x && !(x in names)))];
  if (!ids.length) return;
  resolving = true;
  try { const ps = await user.profiles(ids); let changed = false; for (const id of ids) { const n = ps[id]?.name || ""; if (names[id] !== n) { names[id] = n; changed = true; } } if (changed) safeRender(); }
  catch {} finally { resolving = false; }
}
const safeRender = () => { if (document.activeElement?.id === "note" || document.activeElement?.id === "problem") return; render(); };

/* ---------------- moving between targets */
function open(i) {
  at = Math.max(0, Math.min(T.length - 1, i));
  const t = T[at];
  unit = Math.max(0, t.units.findIndex((u) => !marks[unitKey(t, u)]));
  resetChecklist();
  selRule = t.zone ? null : null;
  showAnswer = false;
  try { history.replaceState(null, "", "#" + encodeURIComponent(t.hash).replace(/%/g, "~")); } catch {}
  render();
  window.scrollTo({ top: 0 });
  announce();
}
function resetChecklist() {
  const t = T[at], checks = checksOf(t), h = held(t);
  answers = {}; problem = ""; note = ""; msg = ""; msgErr = false; confirmOverwrite = null;
  active = checks.find((c) => !h[c]) || checks[0];
  since = Date.now();
}
function nextCheck(checks, h) {
  const i = checks.indexOf(active);
  for (let k = 1; k <= checks.length; k++) { const c = checks[(i + k) % checks.length]; if (!h[c] && !answers[c]) return c; }
  return active;
}
async function announce() {
  if (!db || !me || !writable) return;
  try { await db.collection("presence").doc(docId("p", me, null)).set({ reviewer: me, target: T[at].id, at: new Date().toISOString() }); } catch {}
}

/* ---------------- recording a mark: one doc per (target, rule) in "marks" */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let inFlight = false;
async function record(defer) {
  if (inFlight) return;
  const t = T[at], u = t.units[unit], checks = checksOf(t), h = held(t);
  note = $("#note")?.value ?? note; problem = $("#problem")?.value ?? problem;
  if ((t.gate_errors || []).length) { msg = "This entry fails the gate, so it cannot be marked."; msgErr = true; render(); return; }
  const a = Object.fromEntries(checks.filter((c) => answers[c] && !h[c]).map((c) => [c, answers[c]]));
  const verdict = defer ? "deferred" : verdictFrom(checks, a);
  const why = refusal(checks, verdict, a, problem, note);
  if (why) { msg = why; msgErr = true; render(); return; }
  if (!me && db) { msg = "This view has no identity, so the mark cannot name you. Open the page signed in."; msgErr = true; render(); return; }
  const key = unitKey(t, u), prior = marks[key];
  if (prior && prior.reviewer && prior.reviewer !== me && confirmOverwrite !== prior.reviewer) { confirmOverwrite = prior.reviewer; msg = ""; render(); return; }
  const body = { scope: u.scope, target: t.id, rule_id: u.rule_id || null, verdict, answers: a,
    problem: verdict === "wrong" ? problem : (problem || null), note: note.trim(), seconds: Math.round((Date.now() - since) / 100) / 10,
    reviewer: me, fp: u.fp, release: DATA.vintage?.release?.id || null, pages: t.pages || [], at: new Date().toISOString(), v: 1 };
  inFlight = true;
  msg = "Saving…"; msgErr = false; render();
  try {
    if (db) {
      try { await db.collection("marks").doc(key).set(body); }
      catch (e) { if (e?.code === "unavailable" || e?.code === "resource_exhausted") { await sleep(1200 + Math.random() * 800); await db.collection("marks").doc(key).set(body); } else throw e; }
    } else {
      try { const loc = JSON.parse(localStorage.getItem(LOCAL) || "{}"); loc[key] = body; localStorage.setItem(LOCAL, JSON.stringify(loc)); } catch {}
    }
    marks[key] = body;
    since = Date.now();
    const nextUnit = t.units.findIndex((x, i) => i !== unit && !marks[unitKey(t, x)]);
    if (nextUnit >= 0) { unit = nextUnit; resetChecklist(); msg = `${u.rule_id ? u.rule_id + ": " : ""}${verdict}. Next rule.`; render(); }
    else if (at < T.length - 1) { open(at + 1); msg = `Recorded ${verdict} on ${t.name}.`; render(); }
    else { resetChecklist(); msg = `Recorded ${verdict}. That was the last target.`; render(); }
  } catch (e) {
    if (e?.code === "invalid_argument") writable = false;
    msg = "Not saved: " + (e?.code === "invalid_argument" ? "you do not have write access to this page's marks." : (e?.message || e?.code || "error") + ". Try again.");
    msgErr = true; render();
  } finally { inFlight = false; }
}

/* ---------------- events */
document.addEventListener("click", (e) => {
  const z = e.target.closest("[data-zoom]");
  if (z && !e.target.closest("#viewer")) { openViewer(z.dataset.zoom); return; }
  const g = e.target.closest("[data-go]"); if (g) { open(+g.dataset.go); return; }
  if (e.target.closest("#prev")) { open(at - 1); return; }
  if (e.target.closest("#next")) { open(at + 1); return; }
  const r = e.target.closest("[data-rule]"); if (r) { selRule = r.dataset.rule || null; render(); return; }
  const un = e.target.closest("[data-unit]"); if (un) { note = $("#note")?.value ?? note; unit = +un.dataset.unit; resetChecklist(); render(); return; }
  const b = e.target.closest("button[data-a]");
  if (b) { note = $("#note")?.value ?? note; problem = $("#problem")?.value ?? problem; const t = T[at];
    answers[b.dataset.c] = b.dataset.a; active = b.dataset.c; active = nextCheck(checksOf(t), held(t)); msg = ""; b.blur(); render(); return; }
  const ck = e.target.closest(".check[data-check]"); if (ck && !held(T[at])[ck.dataset.check]) { active = ck.dataset.check; render(); return; }
  if (e.target.closest("#record")) { record(false); return; }
  if (e.target.closest("#defer")) { record(true); return; }
});
document.addEventListener("toggle", (e) => { if (e.target.id === "answerbox") showAnswer = e.target.open; }, true);
document.addEventListener("input", (e) => { if (e.target.id === "note") note = e.target.value; if (e.target.id === "problem") problem = e.target.value; });
document.addEventListener("change", (e) => { if (e.target.id === "problem") problem = e.target.value; });
document.addEventListener("keydown", (e) => {
  const el = e.target;
  if (el && (el.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName)) || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("#viewer")) return;
  const t = T[at], checks = checksOf(t), h = held(t), k = e.key;
  const c = k.toUpperCase();
  if (["T", "R", "P", "A"].includes(c) && k.length === 1 && k === k.toLowerCase() && checks.includes(c) && !h[c]) { active = c; render(); e.preventDefault(); return; }
  if ((k === "y" || k === "n" || k === "?") && !h[active] && checks.includes(active)) {
    answers[active] = k; active = nextCheck(checks, h); msg = ""; render(); e.preventDefault(); return; }
  if (k === "Enter") { if (el?.closest?.("button, a, summary, [data-zoom]")) return; if (e.repeat) return; record(false); e.preventDefault(); return; }
  if (k === "o" && t.kind !== "split") { showAnswer = !showAnswer; render(); if (showAnswer) $("#answer")?.scrollIntoView({ block: "start" }); e.preventDefault(); return; }
  if (k === "m" && t.map) { openViewer("map"); e.preventDefault(); return; }
  if (k === "j") { open(at + 1); e.preventDefault(); return; }
  if (k === "k") { open(at - 1); e.preventDefault(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest?.("[data-zoom]")) { openViewer(e.target.closest("[data-zoom]").dataset.zoom); e.preventDefault(); } });

window.addEventListener("hashchange", () => {
  try { const h = decodeURIComponent(location.hash.slice(1).replace(/~/g, "%")); const i = T.findIndex((t) => t.hash === h || t.id === h); if (i >= 0 && i !== at) open(i); } catch {}
});

/* ---------------- boot */
try { const h = decodeURIComponent(location.hash.slice(1).replace(/~/g, "%")); const i = T.findIndex((t) => t.hash === h || t.id === h); if (i >= 0) at = i; } catch {}
try { Object.assign(marks, JSON.parse(localStorage.getItem(LOCAL) || "{}")); } catch {}
resetChecklist();
render();
(async () => {
  const c = window.claude;
  try { db = c?.use ? await c.use("db") : null; } catch { db = null; }
  try { user = c?.use ? await c.use("user") : null; } catch { user = null; }
  try { me = user ? await user.id() : null; } catch { me = null; }
  try { if (user && (await user.can("data.write")) === false) writable = false; } catch {}
  if (db) {
    for (const k of Object.keys(marks)) delete marks[k];
    try {
      db.collection("marks").onSnapshot((snap) => {
        for (const k of Object.keys(marks)) delete marks[k];
        snap.docs.forEach((d) => { const v = d.data(); if (v) marks[d.id] = v; });
        safeRender(); resolveNames();
      }, () => {});
      db.collection("presence").onSnapshot((snap) => {
        snap.docs.forEach((d) => { const v = d.data(); if (v && v.reviewer) presence[v.reviewer] = { target: v.target, at: v.at }; });
        safeRender(); resolveNames();
      }, () => {});
    } catch {}
  }
  render();
  announce();
})();
</script>
